系と単位の差の吸収<\/h4>\n<p>3つのシステムは、コード体系と単位が異なっていた。工場は、生産・在庫管理システムでは工場コード、会計システムでは部門コードで表されていた。そこで工場コードと部門コードの対応表を作り、集計の前に変換することにした。<\/p>\n<p>単位の差はより大きかった。在庫は個数、会計は金額、廃棄物管理システムは重量で持っている。金額は、個数に会計システムの単価を掛けて求める。重量は、品目ごとの単位重量を新たに持たせ、個数に掛けて求めることにした。単位重量の登録の状況は、3章で述べる。こうして、部品の側から求めた重量と、廃棄物管理システムの実際の重量を、同じ単位で並べられるようにした。廃棄物管理システムの重量には梱包材なども含まれるので、比べるときは金属くずなど部品に由来する区分だけに絞った。<\/p>\n<h4>2.4 収集の方式<\/h4>\n<p>会計システムと廃棄物管理システムは、他のシステムからデータベースを直接参照させない方針であった。そこで、それぞれが月次の締めの後に出力するファイルを受け取り、集計用のテーブルに取り込む方式にした。日次で連携する案は、相手の2つのシステムの改修が要り、費用も保守の手間も増える。指標は環境推進委員会の月次の会議で使うので、月次の鮮度で足りると判断し、ファイルで受け取る案を選んだ。<\/p>", "u": "<h3>第3章 データの内容の問題と対応<\/h3>\n<h4>3.1 廃棄の理由が記録されていない<\/h4>\n<p>最も大きな問題は、システムの廃棄の実績に理由が無いことであった。旧版になったための廃棄か、破損や劣化による廃棄かを区別できず、旧版の廃棄率を正しく求められない。<\/p>\n<p>そこで、新たなデータ取得の仕組みを作った。ハンディ端末で廃棄の出庫を記録するときに、理由を選択させることにした。選択肢は「版の切替」「破損」「劣化」「その他」の4つに絞り、作業者の負担を抑えた。<\/p>\n<p>一方、仕組みを作る前の実績には理由のデータが無い。そこで、目標の基準になる前年度の値は、みなし処理で求めた。期末棚卸の廃棄記録の用紙には、手書きの理由欄がある。理由欄が「旧版」のものを紙の4M変更申請書と照合し、対象の品目の廃棄を版の切替による廃棄とみなした。破損などは理由欄で除かれるので、値が高めに出ることはない。<\/p>\n<p>ただし、用紙に版の記録は無い。どの変更による廃棄かは、品目と切替日から割り当てた。割り当てた結果は、在庫管理課長に抜き取りで確かめてもらった。みなした値には印を付け、指標の画面で区別できるようにした。<\/p>\n<h4>3.2 単位重量が登録されていない品目が多い<\/h4>\n<p>重量を求めるための単位重量は、多くの品目で登録されていなかった。全品目を量り直すと時間が掛かる。そこで、廃棄金額の大きい主要な品目は、設計部の図面の情報から単位重量を登録した。残りの品目は、同じ品目区分の平均の単位重量を使うことにした。部品の側から求めた重量は推計値と明記し、廃棄物管理システムの実際の重量と月次で照合した。両者の差が2割を超えた月は、平均の単位重量を使った品目のうち、廃棄の多いものを量り直した。<\/p>\n<h4>3.3 版の分からない在庫がある<\/h4>\n<p>版の運用を始める前の在庫には、版の情報が無いものがあった。これらの廃棄は、どの4M変更によるものかを特定できない。そこで、「版不明」として別に集計し、廃棄率の計算からは除いて件数だけを示した。版不明の在庫は先に使い切る方針なので、その件数が減ることも確かめられる。<\/p>\n<h4>3.4 評価と今後の課題<\/h4>\n<p>これらの対応により、環境推進委員会は、廃棄量の推移と、その原因になった4M変更を同じ画面で確かめられるようになった。最初の期末棚卸で確定した旧版部品の廃棄金額は、前年度の約3割減となり、目標に届いた。当年度も理由が「版の切替」の廃棄だけを数えたので、前年度の基準と範囲はそろっている。<\/p>\n<p>廃棄率は、即日切替の変更で他の切替方法より高かった。そこで委員会は、廃棄の見込み金額が基準を超える即日切替では在庫管理課長の承認も必須にするよう、申請の手順を見直させた。一方、理由を選ぶ操作が定着するまでは「その他」が多かった。今後は、選ばれた理由を定期的に確かめ、選択肢を見直していきたい。<\/p>"}], "groups": [{"name": "最優先:全文を模写", "sub": "どの問題にも転用しやすい3本", "ids": ["h29q1", "h27q1", "r7q2"]}, {"name": "次点:設問イを模写", "sub": "形式が独特・安定してAの3本", "ids": ["r3q1", "r1q2", "h28q2"]}, {"name": "骨子を読む", "sub": "5分ずつ目を通す7本", "ids": ["h27q2", "h28q1", "h29q2", "h30q1", "r1q1", "r4q2", "r7q1"]}]};
const TABS=[["q","問題"],["k","骨子"],["a","ア"],["i","イ"],["u","ウ"]];
const byId={};D.items.forEach(x=>byId[x.id]=x);
const ls={get(k,d){try{const v=localStorage.getItem("sami:"+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem("sami:"+k,JSON.stringify(v))}catch(e){}}};
let fs=ls.get("fs",17), hl=ls.get("hl",false), cur=null, tab="k";
function applyFs(){document.documentElement.style.setProperty("--fs",fs+"px")}
applyFs();
document.getElementById("hl").checked=hl;
document.getElementById("hl").addEventListener("change",e=>{hl=e.target.checked;ls.set("hl",hl)});

function renderHome(){
  const lastId=ls.get("lastId",null);
  const g=document.getElementById("groups");g.innerHTML="";
  D.groups.forEach(gr=>{
    const s=document.createElement("section");s.className="grp";
    s.innerHTML=`<h2>${gr.name}</h2><p class="gsub">${gr.sub}</p>`;
    gr.ids.forEach(id=>{
      const x=byId[id];const b=document.createElement("button");b.className="card";b.type="button";
      b.innerHTML=`<div class="lb">${x.label}${id===lastId?'<span class="last">前回ここまで</span>':''}</div><div class="th">${x.theme}</div><div class="ct">ア ${x.n.a}字 / イ ${x.n.i}字 / ウ ${x.n.u}字</div>`;
      b.addEventListener("click",()=>{location.hash=id});
      s.appendChild(b);
    });
    g.appendChild(s);
  });
}
function markNums(h){
  if(!hl) return h;
  return h.replace(/(>[^<]*)/g,seg=>seg.replace(/約?[0-9０-９][0-9０-９,，.]*(?:〜[0-9０-９,]+)?(?:人月|時間|万円|百万円|千枚|万枚|品目|秒|分|件|名|割|日間|日|か月|ポイント|通り|台|回|年|%|字|人)?/g,m=>`<mark>${m}</mark>`));
}
function showTab(t){
  tab=t;const x=cur;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.t===t)));
  let h=x[t];
  if(t==="a"||t==="i"||t==="u") h=markNums(h)+`<div class="meta">${x.n[t]}字(見出しを含む、空白を除く)</div>`;
  document.getElementById("body").innerHTML=h;
  const idx=TABS.findIndex(e=>e[0]===t);
  const p=document.getElementById("prev"),n=document.getElementById("next");
  p.disabled=idx===0;p.textContent=idx>0?"‹ "+TABS[idx-1][1]:"";
  n.disabled=idx===TABS.length-1;n.textContent=idx<TABS.length-1?TABS[idx+1][1]+" ›":"";
  const tabs=ls.get("tabs",{});tabs[x.id]=t;ls.set("tabs",tabs);
  window.scrollTo(0,0);
}
function openItem(id){
  cur=byId[id];ls.set("lastId",id);
  document.getElementById("ttl").textContent=cur.label+" "+cur.theme;
  const tb=document.getElementById("tabs");tb.innerHTML="";
  TABS.forEach(([k,l])=>{const b=document.createElement("button");b.className="tab";b.type="button";b.dataset.t=k;b.textContent=l;b.setAttribute("role","tab");b.addEventListener("click",()=>showTab(k));tb.appendChild(b)});
  document.getElementById("home").hidden=true;document.getElementById("detail").hidden=false;
  showTab(ls.get("tabs",{})[id]||"k");
}
function route(){
  const id=location.hash.slice(1);
  if(id&&byId[id]) openItem(id);
  else{document.getElementById("detail").hidden=true;document.getElementById("home").hidden=false;renderHome();window.scrollTo(0,0)}
}
document.getElementById("back").addEventListener("click",()=>{location.hash=""});
document.getElementById("prev").addEventListener("click",()=>{const i=TABS.findIndex(e=>e[0]===tab);if(i>0)showTab(TABS[i-1][0])});
document.getElementById("next").addEventListener("click",()=>{const i=TABS.findIndex(e=>e[0]===tab);if(i<TABS.length-1)showTab(TABS[i+1][0])});
document.getElementById("fsm").addEventListener("click",()=>{fs=Math.max(14,fs-1);ls.set("fs",fs);applyFs()});
document.getElementById("fsp").addEventListener("click",()=>{fs=Math.min(24,fs+1);ls.set("fs",fs);applyFs()});
window.addEventListener("hashchange",route);
route();
</script>
