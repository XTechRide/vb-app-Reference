<script>
const D={"items": [{"id": "h29q1", "group": "最優先:全文を模写", "label": "平成29 問1", "theme": "非機能要件を定義するプロセス", "n": {"a": 549, "i": 1471, "u": 1191}, "q": "<h3>問1 非機能要件を定義するプロセスについて<\/h3><p>情報システムは、非機能要件の考慮漏れによって重大な障害を引き起こすことがある。非機能要件とは、信頼性を含む品質要件、運用・操作要件など、機能要件以外の要件のことである。利用者は非機能要件を明確に認識していないことが多いので、システムアーキテクトは、利用者を含む関連部門へのヒアリングによって必要な情報を収集する。収集した情報を基に、業務及び情報システム両方の視点から非機能要件を検討し、検討結果を意思決定者に提示し、判断してもらう。<\/p><p>例えば、信頼性要件の場合、次のようなプロセスで検討する。<\/p><p>・リスクを洗い出し、想定される損失並びに事業及び業務への影響を分析する。<\/p><p>・分析結果に基づき、目標とすべき復旧時間を設定する。<\/p><p>・設定した復旧時間を達成するための情報システムの実現方式を具体化する。<\/p><p>その際、前提となるシステム構成、開発標準、システム運用形態など、非機能要件を定義するに当たって制約となる事項を示した上で、例えば次のように、意思決定者に判断してもらうための工夫をすることも必要である。<\/p><p>・複数のシステム構成方式について、想定される損失と、対策に必要なコストの比較を示す。<\/p><p>・信頼性を向上させるためにデュアルシステム方式にすると効率性の指標の一つであるスループットが下がる、といった非機能要件間でのトレードオフが生じる場合、各非機能要件の関係性を示す。<\/p><p>あなたの経験と考えに基づいて、設問ア〜ウに従って論述せよ。<\/p><div class=\"ask\"><b>設問ア<\/b>設問ア あなたが要件定義に携わった情報システムについて、対象業務の概要と情報システムの概要を、800字以内で述べよ。<\/div><div class=\"ask\"><b>設問イ<\/b>設問イ 設問アで述べた情報システムについて、どのような非機能要件を、業務及び情報システム両方のどのような視点から、どのようなプロセスで検討したか。検討した結果とともに、800字以上1,600字以内で具体的に述べよ。<\/div><div class=\"ask\"><b>設問ウ<\/b>設問ウ 設問イで述べた非機能要件の検討の際、意思決定者に判断してもらうためにどのような工夫をしたか。600字以上1,200字以内で具体的に述べよ。<\/div>", "k": "<p class=\"lead\">この問題の主役は、非機能要件を「どういう順番で」決めたか(プロセス)と、意思決定者への示し方です。問題文のプロセス(リスクの洗い出し→影響の分析→目標→実現方式)を、そのまま第一〜第三の段落に使います。目標は業務の言葉で決めてから測れる値(2秒以内、半日)に直します。この問題は数値が必須なので、損失と費用の値も覚えて書きます。<\/p><ul class=\"pts\"><li>設問ア:「出庫が止まるとラインが止まる」という業務の特性を書いておき、イの分析につなげます。<\/li><li>設問イ:要件(性能・信頼性・時刻の正確さ)、視点(業務とシステム)、プロセス、結果の4つを全て書きます。<\/li><li>設問ウ:問題文の2つの例(方式ごとの損失とコストの比較、トレードオフ)を、自分の事例で書きます。制約(2層・サーバ1台)を先に示したことも書きます。<\/li><\/ul><h3>骨子<\/h3><ul class=\"ol\"><li class=\"ch\">第1章 対象業務と情報システムの概要<\/li><li class=\"sub\">1.1 業務 → 出庫が止まるとラインが止まる。先入れ先出しの背景<\/li><li class=\"sub\">1.2 システム → 2層、専用線。出庫のたびにサーバで判定。立場<\/li><li class=\"ch\">第2章 非機能要件の検討の視点、プロセス、結果<\/li><li class=\"sub\">2.1 要件と視点 → 性能・信頼性・切替の時刻(正確性)。業務の視点とシステムの視点<\/li><li class=\"sub\">2.2 プロセス → ①聞き取り(専用線は3年で2回、保守は翌営業日対応) ②リスクと影響(専用線は最長約2時間で吸収できる。サーバ故障は1日以上) ③目標:次の部品に手を伸ばすまで約3秒 → 2秒以内(朝の集中時間帯、第3工場)。目標復旧時間は半日以内に出庫を再開<\/li><li class=\"sub\">2.3 結果 → 性能:ストアドプロシージャ・往復1回・複合索引 / 信頼性:端末に出庫停止品目の一覧(毎朝取込み、承認分は応答に載せる)、止まっても一覧だけ確認して出庫、実績を一時保存、復旧後に順序違反を一覧にして翌朝までに確認 / 時刻:サーバの時刻だけ。障害中は端末の時刻(毎朝合わせる)<\/li><li class=\"ch\">第3章 意思決定者に判断してもらうための工夫<\/li><li class=\"sub\">3.1 工場長に3案(A止める・B続ける・C二重化)を、止まる時間・順序違反のリスク・5年間の費用で並べる。A:1時間約200万円の損失 / B:約1人月(約100万円)/ C:5年で約2,500万円 → Bを推奨。制約(2層・サーバ1台)を先に示す<\/li><li class=\"sub\">3.2 案Bの弱点 → 一覧の確認は続く。障害中に承認された即日停止は届かない → 電話で補う(月1件あるかないか)<\/li><li class=\"sub\">3.3 トレードオフ → 全件確認は約2秒増えて3秒を超える → 警告は古い在庫があるときだけ。結果(2秒以内、専用線1時間断でも出庫継続)と残課題(電話に頼る)<\/li><\/ul>", "a": "<h3>第1章 対象業務と情報システムの概要<\/h3>\n<h4>1.1 対象業務の概要<\/h4>\n<p>B社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。第2・第3工場で製造したユニットを本社工場で組み立てて出荷している。対象の業務は、3工場の倉庫での部品の保管と出庫、及び部品の作り方を変える4M変更の管理である。<\/p>\n<p>倉庫からの出庫は、生産ラインへの部品の供給そのものである。ラインの横には半日分ほどの部品を置いており、出庫が止まれば、それを使い切った時点で生産が止まる。また、4M変更は月平均4〜5件あり、旧版の部品が棚に滞留して廃棄の原因になっていた。そこでB社は、出庫を先入れ先出しに統一することを決めた。<\/p>\n<h4>1.2 情報システムの概要<\/h4>\n<p>対象の情報システムは、B社の生産・在庫管理システムである。PCのクライアントとデータベースサーバの2層構成で、サーバは本社工場に1台置き、第2・第3工場からは専用線で利用する。倉庫ではハンディ端末でロケーションと現品票のQRコードを読み取り、入出庫を記録する。<\/p>\n<p>今回、出庫の都度、サーバで版と生産ロットの順序を判定し、古い在庫があれば知らせる機能を追加した。あわせて、4M変更の申請を電子化し、承認時に切替の日時を登録する機能を追加した。<\/p>\n<p>私はシステム開発会社A社のシステムアーキテクトとして、本機能追加の要件定義を担当した。<\/p>", "i": "<h3>第2章 非機能要件の検討の視点、プロセス、結果<\/h3>\n<h4>2.1 検討した非機能要件と視点<\/h4>\n<p>私は、性能、信頼性、切替の時刻の正確さの3つの非機能要件を検討した。3つとも品質要件で、切替の時刻は正確性に当たる。障害の後の確認の手順は、運用・操作要件として合わせて検討した。今回の機能は出庫のたびにサーバで判定するため、出庫という業務の流れに直接割り込む。しかし利用者は、遅くなったり止まったりした場合を意識しておらず、私から問いかけて引き出す必要があった。<\/p>\n<p>検討には2つの視点を使った。業務の視点は、出庫が遅れたり止まったりしたとき、生産ラインと品質にどんな影響が出るかである。システムの視点は、2層構成で判定を毎回サーバで行い、第2・第3工場は専用線を通るという構成上の制約である。<\/p>\n<h4>2.2 検討のプロセス<\/h4>\n<p>第一に、倉庫作業者、在庫管理担当者、情報システム部に聞き取りを行った。情報システム部からは、専用線が過去3年で2回切れたことと、サーバの保守契約が翌営業日対応であることを聞いた。<\/p>\n<p>第二に、リスクを洗い出し、業務への影響を分析した。判定が遅ければ出庫が滞り、ラインを待たせる。専用線の停止は最長でも約2時間で、ライン横の部品で吸収できる。しかし、サーバのハードウェアが故障すると、復旧に1日以上かかりうる。その間出庫できなければ、ライン横の部品が尽きた時点で生産が止まる。切替の時刻がずれれば、止めるべき旧版が出庫され、品質問題につながる。<\/p>\n<p>第三に、業務の言葉で目標を決め、測れる値に直した。性能は、作業者が現品票を読み取ってから次の部品に手を伸ばすまでに結果が出ることとした。倉庫で観察すると、この間は約3秒だった。そこで、読取りから判定結果の表示まで2秒以内を目標とした。条件は、朝の出庫が集中する時間帯に、専用線を通る第3工場の端末で測ることである。<\/p>\n<p>信頼性は、ライン横の部品が尽きるまでの半日を目標復旧時間とした。障害から半日以内に、出庫を再開できることである。切替の時刻は、どの端末から出庫しても、同じ時刻で切り替わることとした。<\/p>\n<h4>2.3 検討の結果<\/h4>\n<p>性能については、判定をデータベースサーバのストアドプロシージャにまとめ、端末との往復を1回にした。品目、版、生産ロットの複合索引も追加した。<\/p>\n<p>信頼性については、現行のサーバ1台と翌営業日対応の保守では、サーバの故障のときに半日で復旧できない。そこで、復旧までの間の方式を3案で比べ、判定ができない間も出庫を続ける方式を推奨案とした。比較は3章で述べる。<\/p>\n<p>ハンディ端末には、出庫停止品目の一覧を持たせる。一覧は、端末が毎朝の始業時にサーバから取り込む。承認された変更は、次の判定の応答に載せて取り込むので、往復は増えない。サーバや専用線が止まった間は、端末はこの一覧だけを確認して出庫を受け付ける。順序の判定はせず、実績を端末に一時保存する。当日分の出庫指示は朝に倉庫へ出力済みなので、端末だけで実績を記録できる。<\/p>\n<p>この方式なら、サーバの復旧が翌営業日になっても出庫は止まらず、半日の目標を守れる。復旧後に実績をサーバへ送り、順序を外れた出庫を一覧に出す。運用・操作の要件として、この一覧は在庫管理担当者が翌朝までに確認すると決めた。担当者が見るのは違反の分だけなので、1日分でも確認できる量と見積もった。<\/p>\n<p>切替の時刻については、判定に端末の時刻を使わず、サーバの時刻だけを使うことにした。ただし、障害の間はサーバの時刻を使えない。そこで、一覧には出庫停止日時も載せ、障害の間に日時が来た品目は端末の時刻で止める。端末の時刻は、毎朝の取込みのときにサーバに合わせる。<\/p>", "u": "<h3>第3章 意思決定者に判断してもらうための工夫<\/h3>\n<h4>3.1 障害時の方式を3案で比べ、損失とコストを並べた<\/h4>\n<p>信頼性の方式は本社工場の工場長に判断してもらうため、次の3案を示した。案Aは、判定ができない間は出庫を止める方式である。案Bは、判定なしで出庫を続け、復旧後に確認する方式である。案Cは、サーバと回線を二重にする方式である。前提として、現行の2層構成とサーバ1台の構成は変えないという制約を最初に示した。案Cは、この前提を変えた場合との比較のために並べた。<\/p>\n<p>そのうえで、3案を、ラインが止まる時間、順序違反のリスク、5年間の費用の3つの軸で、1枚の表に並べた。専用線の停止は過去3年で2回、最長約2時間で、どの案でもライン横の部品で吸収できる。半日を超えうるのは、復旧が翌営業日以降になるサーバの故障である。<\/p>\n<p>このとき、案Aは順序を必ず守れて費用も掛からないが、ラインが止まる。工場の試算で損失は1時間当たり約200万円で、1日止まれば1,000万円を超える。案Bはラインが止まらない。損失は、順序を外れた出庫を翌朝に確認する手間である。費用は端末への機能追加の約1人月で、約100万円である。案Cは止まる時間が最も短いが、費用は初期の約1,500万円と年約200万円で、5年で約2,500万円になる。<\/p>\n<p>案Cが案Bより多く防げる損失は、確認の手間だけである。そのため、案Cの費用は見合わないと示し、案Bを推奨した。<\/p>\n<h4>3.2 案Bの弱点と、その補い方を示した<\/h4>\n<p>工場長は、案Bでは旧版を即日止めるべき部品まで出庫されることを心配した。そこで私は、障害の間も、端末に持たせた出庫停止品目の一覧の確認だけは続けることを示した。<\/p>\n<p>残る弱点も隠さず示した。専用線が切れている間に本社で承認された即日停止は、第2・第3工場の端末に届かない。この場合は、在庫管理担当者が倉庫に電話で伝える運用で補うとした。即日停止は月に1件あるかないかで、電話で足りる頻度である。<\/p>\n<h4>3.3 非機能要件どうしのトレードオフを示した<\/h4>\n<p>在庫管理担当者からは、全ての出庫で確認画面を出してほしいという要望があった。私は工場長に、順序の順守と出庫の速さがトレードオフになることを示した。確認を全件に増やすと操作が1回増え、倉庫で試すと約2秒掛かった。判定の2秒と合わせると、作業者が次の部品に手を伸ばすまでの約3秒を超え、朝の時間帯にラインを待たせる。そこで、古い在庫がある場合だけ警告を出す案と並べ、どちらを取るかを判断してもらった。<\/p>\n<p>その結果、工場長は案Bを選び、警告は古い在庫がある場合だけと決めた。システムテストでは、応答は目標の2秒以内に収まった。稼働後に専用線が約1時間切れたときも出庫は続き、復旧後の確認は翌朝までに終わった。<\/p>\n<p>一方、障害の間の即日停止を電話で伝える運用は、人の連絡に頼っている。今後は、復旧の直後に一覧を取り込み直し、その間の出庫を優先して確認する仕組みを加えたい。<\/p>"}, {"id": "h27q1", "group": "最優先:全文を模写", "label": "平成27 問1", "theme": "システム方式設計", "n": {"a": 645, "i": 1519, "u": 962}, "q": "<h3>問1 システム方式設計について<\/h3><p>システムアーキテクトは、情報システムの開発で、ハードウェア、ソフトウェア及び人手による作業をどのように組み合わせてシステム要件を実現するのかを総合的に検討し、システム方式を設計する。総合的な検討の視点としては、業務プロセスへの効果、実現可能性などがある。業務プロセスへの効果としては、情報システムの稼働後の業務の処理時間短縮、品質向上、運用コスト削減などがある。実現可能性の判断のためには、適用技術、開発コスト、開発期間、セキュリティリスク、運用性、保守性などを考慮する。<\/p><p>このようなシステム方式設計には、例えば次のようなものがある。<\/p><p>・業務の品質向上という要件を実現するために、業務上のミスが他の業務に大きな影響を与えるような重要な作業は、全てソフトウェア開発の対象に含めた。<\/p><p>・低コストでの業務の効率化という要件を実現するために、実施頻度が高い作業をソフトウェア開発の対象にし、開発すると費用が掛かるが手作業で実施しても業務運用上大きな問題にならない作業は、人手で実施することにした。<\/p><p>・開発期間を短くするために、外部との通信などの共通機能には、ソフトウェアパッケージを活用した。<\/p><p>また、システム方式設計の結果は、利用者に説明しなければならない。そのため、情報システム稼働後の業務の全体像を示して業務部門の役割分担を明確にしたり、業務担当者の利用するシステム機能を業務フローに明示して情報システムの利用局面を示したりするなど、利用者の理解度を高める工夫をすることも必要である。<\/p><p>あなたの経験と考えに基づいて、設問ア〜ウに従って論述せよ。<\/p><div class=\"ask\"><b>設問ア<\/b>設問ア あなたがシステム方式設計に携わった、対象の業務と情報システムの概要を、それぞれの特徴を含めて、800字以内で述べよ。<\/div><div class=\"ask\"><b>設問イ<\/b>設問イ 設問アで述べた情報システムで、どのようなシステム要件を実現するために、どのようなシステム方式を設計したか。業務プロセスへの効果、実現可能性などの決定理由を含めて、800字以上1,600字以内で具体的に述べよ。<\/div><div class=\"ask\"><b>設問ウ<\/b>設問ウ 設問イで述べたシステム方式設計の結果を説明する際に実施した、利用者の理解度を高める工夫を、実例を含めて、600字以上1,200字以内で具体的に述べよ。<\/div>", "k": "<p class=\"lead\">この問題の主役は、システム要件を「ハードウェア、ソフトウェア、人手」にどう分担させたかです。各方式には、問題文の「業務プロセスへの効果」と「実現可能性」の両方を理由として書きます。<\/p><ul class=\"pts\"><li>設問ア:「それぞれの特徴を含めて」とあるので、業務の特徴とシステムの特徴を別々に書きます。<\/li><li>設問イ:要件を先に3つ並べ、方式を3つの視点(置き場所、判定の場所、人手とハードウェア)で書きます。添付論文の案A・案Bがそのまま使えます。<\/li><li>設問ウ:工夫と実例を対にします。実例は「誰が何を心配し、工夫の後どう変わったか」で書くと具体的になります。<\/li><\/ul><h3>骨子<\/h3><ul class=\"ol\"><li class=\"ch\">第1章 対象の業務と情報システムの概要<\/li><li class=\"sub\">1.1 業務と特徴 → 4M変更月4〜5件で版が変わる。取りやすいものから出庫→滞留・廃棄<\/li><li class=\"sub\">1.2 システムと特徴 → 2層、ハンディ、3工場を1つのDB、他工場は専用線越し。先入れ先出しの機能追加。立場<\/li><li class=\"ch\">第2章 システム要件と設計したシステム方式<\/li><li class=\"sub\">2.1 要件 → ①古い順に出庫 ②切替方法を守る ③出庫作業を止めない。HW・SW・人手への分担<\/li><li class=\"sub\">2.2 取り違え防止 → 案A棚はそのままソフトで指示(止められるが混在した棚で手に取れる)/ 案B棚を版で分ける → B。効果:読取り2回のまま。実現可能性:開発は約2人月増、再配置 約300品目・約150時間、主要は11〜12月・残りは棚卸。誤出庫1回でユニット回収 → 手間は許容。申請の電子化で当日の手更新を無くす<\/li><li class=\"sub\">2.3 判定の場所 → 端末(専用線が切れても動く・速い)かサーバか → サーバ(保守性)。ストアドプロシージャ、往復1回、複合索引、2秒以内<\/li><li class=\"sub\">2.4 止めないための分担とHW → 例外は人の判断+3つの理由(止めた旧版は不可)。障害時は端末の出庫停止品目一覧だけ確認して出庫、実績を一時保存、順序は復旧後に確認。既存の端末とプリンタを流用<\/li><li class=\"ch\">第3章 利用者の理解度を高める工夫<\/li><li class=\"sub\">3.1 業務フロー1枚、自動と人手を色分け → 在庫管理担当者が同意<\/li><li class=\"sub\">3.2 班長の担当する棚の写真+約300品目の一覧 → 班長が再配置に協力<\/li><li class=\"sub\">3.3 試作画面を棚の前で操作 → 理由の選択肢を1つ替えた。班長に手順を説明してもらって確認。結果(問合せ数件、誤出庫なし)と残課題(他工場は資料だけ)<\/li><\/ul>", "a": "<h3>第1章 対象の業務と情報システムの概要<\/h3>\n<h4>1.1 対象の業務の概要と特徴<\/h4>\n<p>B社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。第2・第3工場で製造したユニットを本社工場で組み立てて出荷している。対象の業務は、3工場をまたがる生産計画、部品の所要量計算と発注、受入と検査、倉庫での保管と出庫、工場間の移動、組立、出荷までの生産管理業務と在庫管理業務である。<\/p>\n<p>業務の特徴は2つある。一つは、部品の作り方を変える4M変更が月平均4〜5件あり、内製品の版が頻繁に変わることである。もう一つは、倉庫の作業者が品目コードだけを見て、取りやすい部品から出庫していたことである。そのため旧版の部品が棚の奥に滞留し、棚卸のたびに廃棄されていた。また、倉庫の出庫は生産ラインへの部品の供給そのもので、出庫が止まるとラインが止まる。<\/p>\n<h4>1.2 情報システムの概要と特徴<\/h4>\n<p>対象の情報システムは、B社の生産・在庫管理システムである。PCのクライアントとデータベースサーバの2層構成で、サーバは本社工場に置き、第2・第3工場からは専用線で利用する。倉庫ではハンディ端末でロケーションと現品票のQRコードを読み取り、入出庫を記録する。3工場の在庫を1つのデータベースで持つことが特徴である。第2・第3工場の端末は専用線越しにサーバを使うため、回線の遅延や停止が出庫に直結する。<\/p>\n<p>B社は廃棄を減らすため、出庫を先入れ先出しに統一することを決めた。私はシステム開発会社A社のシステムアーキテクトとして、そのための機能追加の要件定義から方式設計までを担当した。<\/p>", "i": "<h3>第2章 システム要件と設計したシステム方式<\/h3>\n<h4>2.1 実現するシステム要件<\/h4>\n<p>実現するシステム要件は次の3つである。第一に、同じ品目は版と生産ロットの古い順に出庫すること。第二に、4M変更で指定された切替方法を守って新しい版に切り替えること。第三に、倉庫の出庫作業を止めないことである。私は、これらをハードウェア、ソフトウェア、人手の作業にどう分担させるかを検討した。<\/p>\n<h4>2.2 版の取り違えを防ぐ方式<\/h4>\n<p>第一と第二の要件に対して、2つの方式を比較した。案Aは、棚は品目コード単位のままで、出庫時にソフトウェアが古い版とロットを指示する方式である。棚の再配置が要らず、開発も小さい。旧版の出庫もソフトウェアで止められる。しかし、同じ棚に新旧の版が混在するため、止めた旧版を手に取れる状態が残る。読取りを省いた出庫や、汚れて読めない現品票には歯止めがない。<\/p>\n<p>案Bは、棚を品目コードと版の単位に分ける方式である。棚の再配置という人手の作業が要るが、置き場所そのものが歯止めになり、旧版を棚単位で出庫停止できる。<\/p>\n<p>私は案Bを選んだ。業務プロセスへの効果として、切替方法を確実に守ることが品質上最も重要だと考えたからである。再配置の後も、作業者の手順は棚と現品票の読取り2回のままで、出庫の時間は延びない。同じ版の中のロットの順序は、ソフトウェアの判定で補った。<\/p>\n<p>実現可能性は、開発と再配置の量で確かめた。案Bはロケーションの持ち方を変える分、開発が案Aより約2人月増えるが、期初までの開発の枠に収まる。再配置の対象は4M変更のあった品目だけで、3工場で約300品目、約150時間である。主要な品目を11〜12月に先に移し、残りを年末年始の棚卸で移せば、期初に間に合うと見積もった。<\/p>\n<p>一方、旧版を即日止める変更は月に1件あるかないかだが、1回でも誤って出庫すれば、組み立てたユニットの回収につながる。この影響の大きさから、案Bの手間の差は許容できると判断した。<\/p>\n<p>さらに、紙の4M変更申請を電子化し、承認の時点で切替の日時を登録することにした。切替日の人手によるマスタ更新がなくなり、更新漏れも防げる。<\/p>\n<h4>2.3 順序を判定する場所<\/h4>\n<p>順序の判定を、ハンディ端末で行うか、データベースサーバで行うかも比較した。端末で行えば、専用線が切れても動き、応答も速い。しかし、端末の種類ごとに同じ判定を作ることになり、保守性が悪い。障害時は出庫停止品目の一覧で補えるので、私は保守性を優先した。判定はサーバのストアドプロシージャとして持ち、候補を古い順に並べて返す方式とした。<\/p>\n<p>専用線を通る応答が遅れないよう、端末との往復を1回にまとめ、品目、版、生産ロットの複合索引を追加した。目標は、朝の出庫が集中する時間帯に、第3工場の端末で読取りから表示まで2秒以内とした。<\/p>\n<h4>2.4 出庫を止めないための分担と、ハードウェア<\/h4>\n<p>第三の要件には、2つの方式で応えた。一つは例外の扱いである。古い在庫が奥にあって取り出せないなどの例外を認めないと、出庫が止まる。そこで、例外の判断は人手に残し、作業者は3つの理由から選んで出庫できる。ただし、出庫を止めた旧版は、理由を選んでも出庫できない。品質に関わる判断は人手に任せないためである。<\/p>\n<p>もう一つは障害時である。復旧まで出庫を止める案は、ライン横の部品が半日で尽きるので採らなかった。障害の間、端末は保持している出庫停止品目の一覧だけを確認して出庫を続け、実績を一時保存する。一覧は、端末が毎朝と変更の承認後にサーバから取り込む。順序は復旧後にサーバで確かめる。<\/p>\n<p>ハードウェアは、既存のハンディ端末とラベルプリンタをそのまま使った。QRコードに版と生産ロットを加えても印字と読取りができると確かめ、機器の購入を避けた。<\/p>", "u": "<h3>第3章 利用者の理解度を高める工夫<\/h3>\n<h4>3.1 稼働後の業務の全体像と役割分担を1枚で示した<\/h4>\n<p>この方式では、4M変更の申請から出庫停止までに、申請部門、在庫管理担当者、倉庫作業者の3者が関わる。説明の当初、在庫管理担当者は「切替日のマスタ更新は誰がするのか」を心配していた。そこで私は、申請、承認、置き場所の登録、出庫停止、出庫までを1枚の業務フローにし、システムが自動で行う部分と人が行う部分を色で分けて示した。<\/p>\n<p>承認の時点で切替の日時が登録され、当日の手作業が無くなることが一目で分かるようにした。その結果、在庫管理担当者は切替日の管理をシステムに任せることに同意した。<\/p>\n<h4>3.2 方式の違いを、実際の棚で示した<\/h4>\n<p>倉庫の班長からは、棚の再配置の負担に不満が出た。そこで、新旧の版が混在している実際の棚の写真を使い、案Aでは作業者がこの棚から旧版を取れてしまうことを示した。写真は、班長が担当する棚から選んだ。自分の職場の棚であれば、危険を具体的に想像できると考えたからである。案Bの再配置は3工場で約300品目に限られることも、品目の一覧で示した。班長は、取り違えの危険を現場の目で確かめ、再配置の計画づくりに協力してくれた。<\/p>\n<h4>3.3 試作の画面で、作業者に実際に操作してもらった<\/h4>\n<p>倉庫作業者には、文書ではなく、試作したハンディ端末の画面で説明した。実際の棚の前で、古い在庫があるときの警告、古い在庫の置き場所の表示、理由を選んで出庫する流れを操作してもらった。その場で、作業者から「奥の在庫はフォークリフトが無いと出せない」という意見が出た。そこで、3つの理由の選択肢の1つを「荷役の機器が必要」に替えた。<\/p>\n<p>これらの工夫により、利用者は方式の決定理由を自分の業務の言葉で理解し、稼働前に合意できた。説明の最後には、本社工場の班長に例外の出庫の手順を自分の言葉で説明してもらい、理解を確かめた。切替日のマスタ更新を誰がするのかという質問は出なくなり、班長は再配置の計画を自分で作った。<\/p>\n<p>稼働後の1か月、本社工場では操作についての問合せは数件にとどまり、例外の出庫も3つの理由の範囲で運用されている。旧版が誤って出庫された事例も起きていない。一方、説明は本社工場で先に行い、第2・第3工場には資料で伝えたため、質問が稼働後に集中した。今後は、各工場で同じ実演を行う時間を計画に入れたい。<\/p>"}, {"id": "r7q2", "group": "最優先:全文を模写", "label": "令和7 問2", "theme": "現行システムと新システム間の差異を踏まえたデータ移行", "n": {"a": 601, "i": 1501, "u": 1141}, "q": "<h3>問2 現行システムと新システム間の差異を踏まえたデータ移行について<\/h3><p>情報システムの刷新や企業統合などを背景にして，現行システムの取引先や仕訳などの重要なデータを新システムに移行することが多い。その際システムアーキテクトは，現行システムから新システムへのデータ移行方法を設計し，移行計画を立案する。<\/p><p>データ移行方法の設計では，現行システムのデータの意味や値のバリエーションなどを調査する。調査した結果から判明した現行システムと新システム（以下，現新システムという）の仕様やデータ構造などの差異を踏まえた，データマッピングやデータ変換ルールの策定，さらにデータクレンジングなどを検討する。現新システムのデータのもち方や粒度に差異がある場合，例えば次のように移行データの仕様や特性に応じてシステム面及び業務面での移行方法を検討する。<\/p><p>・複数の現行システムに同じ取引先のデータが存在する場合，データの更新頻度が最も高いシステムのデータを移行元システムとして移行する。<\/p><p>・仕訳データを移行する場合，勘定科目を統合するのであればバッチ処理で金額を合算し，分割するのであれば分割後の勘定科目ごとの金額を画面から入力する。<\/p><p>・売上データを税込金額で保有している現行システムと税抜金額で保有している現行システムがある場合，税抜金額にそろえて移行する。<\/p><p>移行計画の立案では，適切な移行タイミングを検討することが重要である。さらに，移行日に全てのデータを一括して移行する方法や，事前に一部のデータを移行し，その後の差分を蓄積して移行日に反映する方法など，実施方法を検討することも重要である。その際，作業時間や作業品質などの観点を含めた移行計画の検討が必要である。<\/p><p>あなたの経験と考えに基づいて，設問ア～ウに従って論述せよ。<\/p><div class=\"ask\"><b>設問ア<\/b>設問ア　あなたが携わったデータ移行について，対象とする業務及び情報システムの概要，データ移行が必要となった背景について，400字以上800字以内で述べよ。<\/div><div class=\"ask\"><b>設問イ<\/b>設問イ　設問アで述べたデータ移行において，現新システムにはどのような仕様やデータ構造などの差異があったか。その差異を踏まえたシステム面及び業務面での移行方法を，800字以上1,600字以内で具体的に述べよ。<\/div><div class=\"ask\"><b>設問ウ<\/b>設問ウ　設問アで述べたデータ移行において，データの移行タイミングと実施方法を，移行計画を検討した観点を踏まえて，600字以上1,200字以内で具体的に述べよ。<\/div>", "k": "<p class=\"lead\">この問題の主役は「データ」です。各段落の主語を「ロケーションマスタは」「在庫の版は」「4M変更の情報は」のようにデータにすると、システム変更の論文にずれません。機能をどう作ったかは設問アの背景で1文触れるだけにして、イ・ウでは「現行のデータがどう持たれていて、新しい持ち方にどう移したか」だけを書きます。<\/p><ul class=\"pts\"><li>設問ア:業務とシステムの概要、移行が必要になった背景。背景は「先入れ先出しのために、版とロットで在庫を持つ機能を追加した → 現行のデータを新しい持ち方に移す必要があった」の順。<\/li><li>設問イ:①現新の差異、②差異ごとの「システム面」と「業務面」の移行方法。採点講評は、差異を明確にせず実施事項だけを書いた論述を指摘しています。<\/li><li>設問ウ:移行タイミングと実施方法。問題文の「作業時間」「作業品質」を観点として最初に宣言します。<\/li><li>添付論文から使う材料:2.4の2段階の移行、3.1の適用開始日時、3.2の版不明。<\/li><\/ul><h3>骨子<\/h3><ul class=\"ol\"><li class=\"ch\">第1章 対象の業務と情報システム、データ移行の背景<\/li><li class=\"sub\">1.1 業務とシステム → 共通の文<\/li><li class=\"sub\">1.2 背景 → 4M変更で旧版が滞留・廃棄 → 先入れ先出しに統一(期初3工場一斉) → 版とロットで持つ機能を追加 → 現行データの移行が必要。立場<\/li><li class=\"ch\">第2章 現新システムの差異と移行方法<\/li><li class=\"sub\">2.1 差異 → ①ロケーションマスタ(品目単位→品目+版、2つの日時) ②在庫データ(版が無い在庫) ③4M変更の情報(紙)<\/li><li class=\"sub\">2.2 ロケーション → シ:対象外の品目は1対1で変換、対象の約300品目だけ版ごとに登録。版不明は元のロケーションを使い切りまで / 業:担当者が区画を決め、班長が現場で確かめてから登録・再配置。空いた区画は再利用<\/li><li class=\"sub\">2.3 在庫の版 → 3案比較(A全数調査・B推定・C版不明)。Cを選ぶ。欠点(新版が混じる)は使い切り切替なら違反でないので許容。現品票 約1万枚を一括発行、旧票番号を印字。即日停止・時期指定の品目だけ現品調査→確定→現品票を再発行。移行後の即日停止は版不明も出庫停止<\/li><li class=\"sub\">2.4 4M変更 → シ:未切替の申請だけ様式から一括取込、誤りは理由付き一覧(クレンジング) / 業:担当者が転記、申請部門が確認<\/li><li class=\"ch\">第3章 データの移行タイミングと実施方法<\/li><li class=\"sub\">3.1 観点 → 作業時間(生産を止めず期初までに)・作業品質(誤りなく)<\/li><li class=\"sub\">3.2 タイミング → 再配置 約150時間、貼り替え 約170時間、棚卸2日間で使えるのは約100時間 → 3つに分ける:主要 約200品目・約7千枚は11〜12月の終業後 / 残り 約100品目・約3千枚は棚卸 / 並べ方は期初に一斉<\/li><li class=\"sub\">3.3 実施方法 → 一括と事前+差分を比較 → 事前。11月に申請機能を先に稼働し紙を廃止(差分が残らない)。ロケーションと版は再配置した日から有効<\/li><li class=\"sub\">3.4 作業品質 → ①判定条件(主要品目は差異なし、他は現品確認に回せる) ②版不明の件数を集計 ③並べ方を設定で戻せる(リハーサル約10分、始業1時間前の基準)。結果(2日で完了、判定条件を満たした)と残課題(残る版不明は現品調査)<\/li><\/ul>", "a": "<h3>第1章 対象の業務と情報システム、データ移行の背景<\/h3>\n<h4>1.1 対象の業務と情報システムの概要<\/h4>\n<p>B社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。第2・第3工場で製造したユニットを本社工場で組み立てて出荷している。対象の業務は、3工場をまたがる生産計画、部品の所要量計算と発注、受入と検査、倉庫での保管と出庫、工場間の移動、組立、出荷までの生産管理業務と在庫管理業務である。<\/p>\n<p>対象の情報システムは、B社の生産・在庫管理システムである。PCのクライアントとデータベースサーバの2層構成で、サーバは本社工場に置き、第2・第3工場からは専用線で利用する。倉庫ではハンディ端末でロケーションと現品票のQRコードを読み取り、入出庫を記録する。<\/p>\n<h4>1.2 データ移行が必要となった背景<\/h4>\n<p>B社では4M変更が月平均4〜5件発生し、変更前の版の部品が棚の奥に残って、棚卸のたびに廃棄の対象になっていた。B社は廃棄物の削減を環境目標に掲げており、業務改善指針で出庫を先入れ先出しに統一し、翌年度の期初から3工場一斉に適用することを決めた。<\/p>\n<p>これを実現するため、在庫を品目コードだけでなく版と生産ロットで管理する機能を追加した。そのため、品目コード単位で持っていた現行のロケーションと在庫のデータ、紙で管理していた4M変更の情報を、新しい持ち方に移行する必要があった。<\/p>\n<p>私はシステム開発会社A社のシステムアーキテクトとして、本機能追加の要件定義から移行設計までを担当した。<\/p>", "i": "<h3>第2章 現新システムの差異と移行方法<\/h3>\n<h4>2.1 現新システムの差異<\/h4>\n<p>私はまず、現行のデータの項目の意味と、実際に入っている値を調べた。差異は次の3つである。<\/p>\n<p>第一に、ロケーションマスタである。現行は品目コード単位で、同じロケーションに異なる版が混在していた。新システムは品目コードと版の単位でロケーションを持ち、適用開始日時と出庫停止日時を加える。<\/p>\n<p>第二に、在庫データである。現行も生産ロットの管理番号は持つが、版の運用を始める前の在庫には版の情報が無い。こうした在庫が、4M変更の対象になった品目にも残っていた。新システムは全ての在庫に版を必須とする。<\/p>\n<p>第三に、4M変更の情報である。現行は紙の申請書で管理し、切替方法と時期はシステムに無かった。新システムは変更申請機能でこれらを持ち、ロケーションの日時に反映する。<\/p>\n<h4>2.2 ロケーションマスタの移行方法<\/h4>\n<p>システム面では、4M変更の対象になったことがない品目は、現行のロケーション1件を「品目コードと現在の版」の1件にそのまま変換した。4M変更の対象になった品目は3工場で約300品目あり、これらだけ版ごとに区画を分けた新しいロケーションを登録した。版不明の在庫は、移行前の品目単位のロケーションを版不明用としてそのまま使い、使い切った時点で解除する。<\/p>\n<p>業務面では、在庫管理担当者が約300品目の版ごとの区画を決め、倉庫の班長が現場の棚で置けることを確かめてから登録する手順とした。そのうえで倉庫作業者が棚を再配置する。棚の不足に備え、旧版の在庫がなくなったロケーションは解除して、新版に再利用できるようにした。<\/p>\n<h4>2.3 在庫の版の移行方法<\/h4>\n<p>版の情報が無い在庫の扱いは、3つの案を比較した。案Aは、全ての在庫の版を現品で調べてから移行する案である。確実だが、調査に時間が掛かり期初に間に合わない。案Bは、申請書の変更時期と棚入れの時期から、全ての在庫の版を推定する案である。早いが、推定を誤ると旧版を新版として出庫するおそれがある。案Cは、版の項目に「版不明」のコード値を追加して移行し、出庫引当で最優先にする案である。<\/p>\n<p>私は案Cを選んだ。版不明の在庫を先に使い切れば、版が分かる在庫だけが残る状態に自然に移れるからである。案Cには、版不明の中に新版が混じっていると、新版が先に出る欠点がある。しかし、旧版を使い切る切替は、新旧のどちらを使ってもよい変更である。切替方法の違反にはならないと判断し、許容した。<\/p>\n<p>システム面では、このコード値と優先の規則を出庫引当に加えた。現品票は約1万枚をロケーション単位で一括発行する。新しい票には旧票の番号を印字し、貼り替えの後に新旧の両方を読み取って、対応を確かめられるようにした。<\/p>\n<p>ただし、旧版を即日止める品目や切替時期を指定した品目を版不明のまま出庫すると、切替方法に違反する。業務面では、これらの品目に限って案Aの現品調査を行った。対象は一部の品目に絞れるので、期初に間に合う。現品で版を確かめて在庫管理担当者が確定させ、その場で現品票を再発行して版別のロケーションに移す。移行後に即日停止が承認された品目も、版不明の在庫を出庫停止とし、同じ調査で版を確定してから解除する。<\/p>\n<h4>2.4 4M変更の情報の移行方法<\/h4>\n<p>システム面では、承認済みで切替が終わっていない申請だけを、決まった様式から変更申請機能に一括で取り込む仕組みを用意した。データクレンジングとして、切替時期が過去日である、品目コードが品目マスタに無いなどの誤りは、取込時に理由付きの一覧に出し、直してから取り込む。業務面では、在庫管理担当者が紙の申請書から様式に転記し、申請した部門が切替方法と時期を確認してから取り込んだ。<\/p>", "u": "<h3>第3章 データの移行タイミングと実施方法<\/h3>\n<h4>3.1 移行計画を検討した観点<\/h4>\n<p>作業時間と作業品質の2つの観点で移行計画を検討した。作業時間は、生産を止めずに、期初までに3工場の移行を終えられるかである。作業品質は、版とロケーションを誤りなく移せるかである。<\/p>\n<h4>3.2 移行のタイミング<\/h4>\n<p>棚の再配置は4M変更の対象の約300品目で、1品目約30分として約150時間と見積もった。現品票の貼り替えは全品目の約1万枚で、1枚約1分として約170時間である。一方、生産が止まる年末年始の棚卸は2日間で、棚卸と並行して使える倉庫要員の時間は約100時間しかない。この中では終わらない。<\/p>\n<p>そこで、タイミングを3つに分けた。出庫の多い主要品目約200品目とその現品票約7千枚は、11〜12月の終業後に事前に行う。期初の初日から出庫が集中するので、確実に終えておくためである。残りの約100品目と約3千枚は約100時間の作業なので、年末年始の棚卸で行う。出庫の並べ方の切替は、期初の適用開始日時に3工場一斉に行う。<\/p>\n<h4>3.3 実施方法<\/h4>\n<p>実施方法は、移行日に全てを一括で移す方法と、事前に一部を移して差分を移行日に反映する方法を比べた。一括の方法は、作業時間が棚卸の2日間に収まらない。版の付与も短時間になり、誤りを確かめる時間が取れない。そこで、事前に移す方法を選び、データの種類ごとに分けた。<\/p>\n<p>まず、11月に変更申請機能を先に稼働させ、その時点で4M変更の情報を取り込み、紙の申請を廃止した。以後の変更は全てこの機能で受け付けるので、差分が紙に残らない。<\/p>\n<p>次に、ロケーションと在庫の版は、再配置した棚から順に移した。再配置した日を適用開始日時として新しいロケーションを登録し、在庫を移し替える。その日から有効なので、以後の入出庫は新しいロケーションに記録され、差分の反映が要らない。<\/p>\n<h4>3.4 作業品質の確保<\/h4>\n<p>作業品質は、次の3つで確保した。第一に、切替の判定条件を決めた。主要品目は、在庫数とロケーションの登録内容に差異がないことを条件とした。その他の品目は、差異があっても出庫前の現品確認に回せればよいとした。棚卸の結果と新しいロケーションの在庫を照合して確かめる。<\/p>\n<p>第二に、版不明の在庫の件数を工場ごとに集計し、減っていくことを確認した。第三に、出庫の並べ方を設定で従来に戻せるようにした。戻しの手順はリハーサルし、所要時間が約10分であることを確かめた。切替日の始業1時間前に主要品目の差異が残っていれば戻す、という基準を在庫管理担当者と合意した。<\/p>\n<p>その結果、棚卸での作業は2日間で終えられた。期初には判定条件を満たし、生産を止めずに3工場で新しい並べ方へ切り替えられた。一方、出庫の少ない品目では版不明の在庫が残る。今後は、半年たっても残るものを現品調査で確定させたい。<\/p>"}, {"id": "r3q1", "group": "次点:設問イを模写", "label": "令和3 問1", "theme": "アジャイル開発における要件定義の進め方", "n": {"a": 642, "i": 1224, "u": 1135}, "q": "<h3>問1 アジャイル開発における要件定義の進め方について<\/h3><p>情報システムの開発をアジャイル開発で進めることが増えてきている。代表的な手法のスクラムでは，スクラムマスタがアジャイル開発を主導する。システムアーキテクトはスクラムマスタの役割を担うことが多い。<\/p><p>スクラムでは，要件の“誰が・何のために・何をするか”をユーザストーリ（以下，USという）として定め，必要に応じてスプリントごとに見直す。例えば，スマートフォンアプリケーションによるポイントカードシステムでは，主なUSとして，“利用者が，商品を得るために，ためたポイントを商品と交換する”，“利用者が，ポイントの失効を防ぐために，ポイントの有効期限を確認する”などがある。<\/p><p>スクラムマスタはプロダクトオーナとともに，まずUSをスプリントの期間内で完了できる規模や難易度に調整する必要がある。そのためにはUSを人・場所・時間・操作頻度などで分類して，規模や難易度を明らかにする。USに抜け漏れが判明した場合は不足のUSを追加する。USの規模が大き過ぎる場合や難易度が高過ぎる場合は，操作の切れ目，操作結果などで分割する。USの規模が小さ過ぎる場合は統合することもある。<\/p><p>次に，USに優先順位を付け，プロダクトオーナと合意の上でプロダクトバックログにし，今回のスプリント内で実現すべきUSを決定する。スクラムでは，USに表現される“誰が”にとって価値の高いUSを優先することが一般的である。例えば先の例で，利用者のメリットの度合いに着目して優先順位を付ける場合，“利用者が，商品を得るために，ためたポイントを商品と交換する”のUSを優先する。<\/p><p>あなたの経験と考えに基づいて，設問ア～ウに従って論述せよ。<\/p><div class=\"ask\"><b>設問ア<\/b>設問ア　あなたが携わったアジャイル開発について，対象の業務と情報システムの概要，アジャイル開発を選択した理由を，800字以内で述べよ。<\/div><div class=\"ask\"><b>設問イ<\/b>設問イ　設問アで述べた開発において，あなたは，どのようなUSをどのように分類し，規模や難易度をどのように調整したか。分類方法を選択した理由を含めて，800字以上1,600字以内で具体的に述べよ。<\/div><div class=\"ask\"><b>設問ウ<\/b>設問ウ　設問イで述べたUSに関して，あなたは，どのような価値に着目して，USの優先順位を付けたか。具体的なUSの例を交えて，600字以上1,200字以内で述べよ。<\/div>", "k": "<p class=\"lead\">先入れ先出しの機能追加を、スクラムで開発したことにします。職場のスクラムの経験(プロダクトオーナが不慣れ、スクラムマスタが案を作る)をそのまま使えます。ただし、論文では「順位を決めるのはプロダクトオーナ」と役割を分けて書きます。<\/p><ul class=\"pts\"><li>設問ア:アジャイルを選んだ理由は「使ってみないと決められない部分があった」。変えない部分(データ構造)は先に決めた、と書くと判断が伝わります。<\/li><li>設問イ:問題文の「人・場所・時間・操作頻度」から分類を選び、選んだ理由と選ばなかった理由を書きます。分割・難易度・統合・追加をUSの具体例で示します。<\/li><li>設問ウ:問題文の軸は「“誰が”にとっての価値」です。利用者ごとの価値を先に書き、USの例で順位を示します。順位は「私が付けて、POと合意した」と書き、設問の「あなたは」に正面から答えます。<\/li><\/ul><h3>骨子<\/h3><ul class=\"ol\"><li class=\"ch\">第1章 対象の業務と情報システム、アジャイル開発を選択した理由<\/li><li class=\"sub\">1.1 業務とシステム → 廃棄→先入れ先出し、申請の電子化<\/li><li class=\"sub\">1.2 理由 → 画面と例外は使わないと決められない。データ構造は先に決める(後から変えると全USに手戻り)。私=SM、PO=在庫管理課長<\/li><li class=\"ch\">第2章 USの分類と、規模や難易度の調整<\/li><li class=\"sub\">2.1 分類 → 誰が×場面。理由:①場面で端末が違い難易度が分かる ②確かめる相手が決まり規模が分かる。時間・頻度は採らない<\/li><li class=\"sub\">2.2 分割 → 基準3ポイント、2週間×6回、1回約20ポイント。「古い在庫から取り出す」21ポイント → 知る8・置き場所5・理由8<\/li><li class=\"sub\">2.3 難易度 → 承認した日時の自動反映 → 検証のUSを先に<\/li><li class=\"sub\">2.4 統合と追加 → 置き場所の解除と登録(各1ポイント)を統合。現品票の再発行のUSを追加<\/li><li class=\"ch\">第3章 着目した価値と、USの優先順位<\/li><li class=\"sub\">3.1 価値 → 「誰が」ごとの価値。基準の順序:①誤った版を出さない ②作業を止めない ③頻度 → 同じなら規模の小さい順<\/li><li class=\"sub\">3.2 例 → 即日停止が最優先(1回目は手設定で提供、自動反映は3回目。11月に本番へ)。知る+理由は2回目(16ポイント)、置き場所は3回目(2回目は棚番を1行で補う)。図で確かめるUSは期初の後<\/li><li class=\"sub\">3.3 POとの合意 → 私が案、課長が現品票の再発行を上げた(第二の基準)。受入条件は品質保証部にも確認。結果と残課題<\/li><\/ul>", "a": "<h3>第1章 対象の業務と情報システム、アジャイル開発を選択した理由<\/h3>\n<h4>1.1 対象の業務と情報システムの概要<\/h4>\n<p>B社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。対象の業務は、3工場の倉庫での保管と出庫、及び部品の作り方を変える4M変更の申請と切替の業務である。B社では4M変更で旧版の部品が棚に滞留し、廃棄の原因になっていた。そこで出庫を先入れ先出しに統一し、翌年度の期初から3工場一斉に適用することを決めた。<\/p>\n<p>対象の情報システムは、B社の生産・在庫管理システムである。PCのクライアントとデータベースサーバの2層構成で、倉庫ではハンディ端末でロケーションと現品票のQRコードを読み取る。今回、版と生産ロットの古い順に出庫させる機能と、4M変更の申請を電子化する機能を追加した。<\/p>\n<h4>1.2 アジャイル開発を選択した理由<\/h4>\n<p>出庫の順序を守らせる画面や例外の扱いは、作業者が実際に使ってみないと、正しい形が決められなかった。また、4M変更の申請の運用は、B社の中でも開発と並行して決まっていく部分があった。最初に全ての要件を固めるより、短い期間で動くものを見せて確かめる方が、手戻りが少ないと考えた。一方、ロケーションを品目と版の単位で持つデータ構造は、全ての機能の前提である。後から変えると全てのUSに手戻りが出るため、最初に決めて変えないことにした。そこで、データ構造を先に設計し、画面と運用の部分をスクラムで開発した。<\/p>\n<p>私はシステム開発会社A社のシステムアーキテクトとして、スクラムマスタを担当した。プロダクトオーナはB社の在庫管理課長である。<\/p>", "i": "<h3>第2章 USの分類と、規模や難易度の調整<\/h3>\n<h4>2.1 USの分類方法と、選択した理由<\/h4>\n<p>私は、USを「誰が」と「業務のどの場面で」の2つの軸で分類した。誰がは、申請者、在庫管理担当者、倉庫作業者の3つである。場面は、申請と承認、マスタの管理、出庫の3つである。例えば「倉庫作業者が、品質問題を起こさないために、即日停止された旧版を読み取ると出庫が止まる」というUSは、倉庫作業者と出庫の区分に入る。<\/p>\n<p>この分類を選んだ理由は2つある。第一に、場面が違えば使う端末が違い、難易度も違う。申請と承認はPCの画面だが、出庫はハンディ端末で、倉庫での確認が必要になる。場面で分ければ、難易度の高いUSがどこにあるかが分かると考えた。第二に、利用者で分ければ、そのUSを誰に確かめてもらうかが決まる。確かめる相手が倉庫作業者のUSは、倉庫で試す作業が加わる分だけ規模が大きくなる。<\/p>\n<p>時間や操作頻度で分ける方法も検討した。しかし、出庫は毎日、申請は月に数回と、頻度の違いは利用者の違いとほぼ重なっていた。そこで、軸を増やさずに2つに絞った。<\/p>\n<h4>2.2 規模が大き過ぎるUSの分割<\/h4>\n<p>見積りは、開発メンバ3名で基準のUSを3ポイントと決め、相対的な大きさを比べて行った。スプリントは2週間とし、期初までに6回を予定した。1回のスプリントで完了できる量は、合計20ポイント前後と見た。見積りを分類に重ねると、倉庫作業者と出庫の区分に大きいUSが集まっていたので、調整はこの区分から始めた。<\/p>\n<p>例えば「倉庫作業者が、古い版を先に使うために、出庫時に古い在庫から取り出す」というUSは21ポイントで、これだけで1回のスプリントの量を超えた。そこで、操作の切れ目で3つに分割した。「読み取った現品票より古い在庫があれば知る」「古い在庫の置き場所を知る」「取り出せないときに理由を選んで出庫する」である。分割した3つは順に8、5、8ポイントとなり、それぞれ1回のスプリントで完了できる規模になった。<\/p>\n<h4>2.3 難易度が高過ぎるUSの調整<\/h4>\n<p>「在庫管理担当者が、切替を確実にするために、承認した切替の日時を在庫に自動で反映する」というUSは、既存の在庫管理の機能を呼び出すため、難易度が高かった。既存の出庫引当にどう影響するかが、見積りの時点では分からなかった。そこで、影響を調べる小さな検証のUSを先に置き、その結果を見てから本体のUSを見積もった。<\/p>\n<h4>2.4 規模が小さ過ぎるUSの統合と、抜け漏れの追加<\/h4>\n<p>「在庫管理担当者が、空いた置き場所を解除する」と「新しい版の置き場所を登録する」は、それぞれ1ポイントで小さ過ぎた。別々にレビューしても、利用者が確かめる意味が薄い。どちらも同じマスタの画面なので、1つのUSに統合した。<\/p>\n<p>また、スプリントレビューで倉庫の班長から「現品票が汚れて読めないときはどうするのか」と質問があり、USの抜け漏れが分かった。そこで、「倉庫作業者が、出庫を止めないために、読めなくなった現品票をその場で再発行する」というUSを追加した。<\/p>", "u": "<h3>第3章 着目した価値と、USの優先順位<\/h3>\n<h4>3.1 着目した価値<\/h4>\n<p>私は、USの「誰が」ごとに、その人にとっての価値を考えた。倉庫作業者にとっては、迷わず正しい版を取れて、作業が止まらないことである。在庫管理担当者にとっては、切替の当日に手作業でマスタを直さずに済むことである。申請者にとっては、申請を間違えずに出せることである。<\/p>\n<p>そのうえで、価値を比べる基準に順序を付けた。第一は、誤った版を出庫しないことである。業務改善指針の目的である品質の確保に直結するからである。第二は、作業を止めないことである。第三は利用の頻度で、価値が同じなら頻度の高いUSを先にした。なお同じなら、規模の小さいUSを先にした。<\/p>\n<h4>3.2 USの優先順位の例<\/h4>\n<p>最優先にしたのは、「倉庫作業者が、誤って旧版を取っても品質問題を起こさないために、即日停止された旧版を読み取ると出庫が止まる」というUSである。違反すると品質問題に直結するからである。<\/p>\n<p>ただし、このUSは2.3で述べた自動反映のUSが無いと、出庫停止日時が在庫に入らない。そこで最初のスプリントでは、在庫管理担当者が出庫停止日時をマスタの画面で設定する形で作った。自動反映は、検証のUSの結果を受けて3回目に置いた。この成果は11月に本番へ出し、即日停止の品目だけ棚を分けて使い始めた。出庫の順序のUSは、期初に一斉に使い始めた。<\/p>\n<p>次に、2.2で分割した「古い在庫があれば知る」と「取り出せないときに理由を選んで出庫する」を、2回目の同じスプリントに置いた。合計16ポイントで、1回に収まる。前者だけでは、取り出せない場面で作業が止まる。価値は2つがそろって初めて生まれると考えた。「古い在庫の置き場所を知る」は、3つを合わせると1回に収まらないので3回目に置いた。2回目の時点では、警告に古い在庫の棚番を文字で1行出して補った。<\/p>\n<p>一方、「申請者が、切替方法を間違えないために、切替の流れを図で確かめる」というUSは、期初の後のスプリントに回した。切替方法の誤りは品質に関わるが、在庫管理担当者が申請を確かめるので、第一の基準は満たせる。申請は月平均4〜5件と頻度も低い。<\/p>\n<h4>3.3 プロダクトオーナとの合意<\/h4>\n<p>私は、USごとに、誰にとってのどの価値かと規模を並べ、順位の案を示した。課長は、現品票の再発行のUSを私の案より上げた。期初の直後は、貼り替えたばかりの現品票に読めないものが出ると見たからである。作業を止めないという第二の基準に当たるので、案を改めた。即日停止のUSの受入条件は、要求元の品質保証部にも課長を通じて確かめた。<\/p>\n<p>その結果、期初までに、出庫に関わるUSを全て提供できた。一方、課長が忙しい時期はレビューへの出席が減った。今後は、レビューに倉庫の班長も加え、利用者の意見を直接聞きたい。<\/p>"}, {"id": "r1q2", "group": "次点:設問イを模写", "label": "令和元 問2", "theme": "システム適格性確認テストの計画", "n": {"a": 588, "i": 1340, "u": 999}, "q": "<h3>問2 システム適格性確認テストの計画について<\/h3><p>情報システムの開発では、定義された機能要件及び非機能要件を満たしているか、実際の業務として運用が可能であるかを確認する、システム適格性確認テスト（以下、システムテストという）が重要である。システムアーキテクトは、システムテストの適切な計画を立案しなければならない。<\/p><p>システムテストの計画を立案する際、テストを効率的に実施するために、例えば次のような区分けや配慮を行う。<\/p><p>・テストを、販売・生産管理・会計などの業務システム単位、商品・サービスなどの事業の範囲、日次・月次などの業務サイクルで区分けする。<\/p><p>・他の関連プロジェクトと同期をとるなどの制約について配慮する。<\/p><p>・処理負荷に応じた性能が出ているかなどの非機能要件を確認するタイミングについて配慮する。<\/p><p>さらに、テスト結果を効率的に確認する方法についても検討しておくことが重要である。例えば、次のような確認方法が考えられる。<\/p><p>・結果を検証するためのツールを開発し、テスト結果が要件どおりであることを確認する。<\/p><p>・本番のデータを投入して、出力帳票を本番のものと比較する。<\/p><p>・ピーク時の負荷を擬似的にテスト環境で実現して、処理能力の妥当性を確認する。<\/p><p>あなたの経験と考えに基づいて、設問ア〜ウに従って論述せよ。<\/p><div class=\"ask\"><b>設問ア<\/b>設問ア あなたがシステムテストの計画に携わった情報システムについて、対象業務と情報システムの概要を800字以内で述べよ。<\/div><div class=\"ask\"><b>設問イ<\/b>設問イ 設問アで述べた情報システムのシステムテストの計画で、テストを効率的に実施するために、どのような区分けや配慮を行ったか。そのような区分けや配慮を行うことで、テストが効率的に実施できると考えた理由とともに、800字以上1,600字以内で具体的に述べよ。<\/div><div class=\"ask\"><b>設問ウ<\/b>設問ウ 設問アで述べた情報システムのシステムテストの計画で、テスト結果を効率的に確認するために、どのような確認方法を検討し採用したか。採用した理由とともに、600字以上1,200字以内で具体的に述べよ。<\/div>", "k": "<p class=\"lead\">この問題の主役は、テストの「区分け」と「結果の確認方法」です。採点講評は、単体テストや結合テストの話を書いた論述を指摘しています。「実際の業務として運用できるか」を確かめるテストとして書きます。<\/p><ul class=\"pts\"><li>設問ア:追加した機能を具体的に書きます(日時で動きが変わることが、イの区分けの理由になります)。<\/li><li>設問イ:区分け(5つ)ごとに「こう分ければ効率的な理由」を書きます。「分けなかったもの」(工場)も書くと判断が伝わります。応答の合格基準(2秒以内)は数値で書きます。<\/li><li>設問ウ:確認方法ごとに「採用した理由」を書きます。問題文の3つの例(検証ツール、本番データとの比較、負荷)のうち2つを、自分の事例に合わせて使っています。<\/li><\/ul><h3>骨子<\/h3><ul class=\"ol\"><li class=\"ch\">第1章 対象業務と情報システムの概要<\/li><li class=\"sub\">1.1 業務 → 共通の文+先入れ先出しの背景<\/li><li class=\"sub\">1.2 システム → 2層、ハンディ。追加した機能(日時、引当、申請の電子化)。立場<\/li><li class=\"ch\">第2章 テストの区分けと配慮<\/li><li class=\"sub\">2.1 業務の場面で5つ → 毎日の出庫/申請〜切替(日付を進めるシナリオ)/期初の一斉切替/棚卸/障害時(専用線を切って第3工場から出庫)<\/li><li class=\"sub\">2.2 組合せ → 100通り超 → 過去の申請書で実際に起きたものを優先し約30通り<\/li><li class=\"sub\">2.3 工場では分けない → 同じDB・同じ処理。他工場は応答と障害時だけ<\/li><li class=\"sub\">2.4 非機能 → 2秒以内。最初の週に、第3工場の10台同時で確認(届かなければ方式の見直しで手戻り大)<\/li><li class=\"sub\">2.5 配慮 → テストは9〜10月。先行稼働する機能のシナリオを9月に、並べ方は10月に。テストデータに再配置の計画を取り込む<\/li><li class=\"ch\">第3章 テスト結果を効率的に確認する方法<\/li><li class=\"sub\">3.1 照合ツール → 別の担当者が規則を作る。不一致だけ出す。棚卸の集計も<\/li><li class=\"sub\">3.2 本番データで新旧比較 → 想定どおりの違いを自動で仕分け。不具合を発見<\/li><li class=\"sub\">3.3 応答時間 → 端末の時刻記録から2秒超だけ抜き出す<\/li><li class=\"sub\">3.4 人が見る所は倉庫で → 項目ごとの合否基準、1日にまとめチェックリストで回収。結果(11月の先行稼働に間に合う)と残課題<\/li><\/ul>", "a": "<h3>第1章 対象業務と情報システムの概要<\/h3>\n<h4>1.1 対象業務の概要<\/h4>\n<p>B社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。第2・第3工場で製造したユニットを本社工場で組み立てて出荷している。対象の業務は、3工場をまたがる生産計画、部品の所要量計算と発注、受入と検査、倉庫での保管と出庫、工場間の移動、組立、出荷までの生産管理業務と在庫管理業務である。<\/p>\n<p>B社では、部品の作り方を変える4M変更が月平均4〜5件あり、旧版の部品が棚に滞留して廃棄の原因になっていた。そこで出庫を先入れ先出しに統一し、翌年度の期初から3工場一斉に適用することを決めた。<\/p>\n<h4>1.2 情報システムの概要<\/h4>\n<p>対象の情報システムは、B社の生産・在庫管理システムである。PCのクライアントとデータベースサーバの2層構成で、サーバは本社工場に置き、第2・第3工場からは専用線で利用する。倉庫ではハンディ端末でロケーションと現品票のQRコードを読み取り、入出庫を記録する。<\/p>\n<p>今回、次の機能を追加した。ロケーションを品目コードと版の単位に分け、適用開始日時と出庫停止日時を持たせる。出庫引当は、その時点で有効なロケーションから、版と生産ロットの古い順に候補を出す。また、紙の4M変更申請を電子化し、承認と同時に切替の日時を登録する。<\/p>\n<p>私はシステム開発会社A社のシステムアーキテクトとして、本機能追加の要件定義から方式設計、システムテストの計画までを担当した。<\/p>", "i": "<h3>第2章 テストの区分けと配慮<\/h3>\n<h4>2.1 業務の場面による区分け<\/h4>\n<p>私は、システムテストを業務の場面で5つに区分けした。毎日の出庫、4M変更の申請から切替まで、期初の一斉切替、年末年始の棚卸、障害時である。<\/p>\n<p>このように分けた理由は、今回の機能が日時によって動きを変えるからである。例えば、指定した時期に切り替える4M変更は、切替の日時を過ぎて初めて旧版の出庫が止まる。場面ごとにまとめれば、テスト環境の日付を何度も行き来せずに済み、効率的に進められると考えた。<\/p>\n<p>4M変更の区分では、システム日付を進めながら、申請、承認、切替前の出庫、切替後の出庫を1つの流れとして確かめるシナリオを作った。各シナリオには在庫管理担当者の業務の手順の名前を付け、業務の流れと結び付けた。期初の一斉切替は、並べ方の設定を切り替え、切替の前後で同じ出庫指示の結果を比べる。棚卸は、再配置と現品票の貼り替えの後に、在庫が版別に正しく集計されることを確かめる。<\/p>\n<p>障害時は、専用線を切った状態で第3工場の端末から出庫する。端末に保持した出庫停止品目の一覧で旧版が止まること、復旧後に実績が欠けずにサーバへ届くこと、順序を外れた出庫が一覧に出ることを確かめる。<\/p>\n<h4>2.2 組合せの絞り込み<\/h4>\n<p>出庫引当の結果は、切替方法の3通り、版不明の在庫の有無、ロットの数、切替日時の前後などの組合せで変わる。単純に掛け合わせると100通りを超える。そこで、過去の4M変更の申請書を見直し、実際に起きた組合せを優先した。例えば、即日停止と版不明の在庫が同じ品目で重なる組合せは、過去に実際に起きていたので必ず含めた。起きていない組合せは代表的なものだけを残し、全体を約30通りに絞った。<\/p>\n<h4>2.3 工場では区分けしなかった<\/h4>\n<p>一方、工場ごとにテストを分けることはしなかった。3工場は同じデータベースと同じ引当の処理を使い、工場ごとの違いは棚の配置だけである。棚の配置はデータとして持つだけなので、処理には影響しない。同じテストを3回行っても、見つかる不具合は増えないと考えた。そこで機能の確認は本社工場のデータで行い、第2・第3工場では専用線を通した応答と障害時の確認だけを行った。<\/p>\n<h4>2.4 非機能要件を確認するタイミング<\/h4>\n<p>非機能要件では、ハンディ端末の応答を重視した。合格の基準は、読み取ってから判定結果を表示するまで2秒以内である。引当の判定を毎回サーバで行うため、専用線を経由する第3工場の応答が最も厳しい。基準に届かなければ判定の方式を見直すことになり、手戻りが大きい。そこで応答の確認は最後に回さず、システムテストの最初の週に行った。朝の出庫が集中する時間帯を想定し、第3工場の10台の端末から同時に出庫して確かめた。<\/p>\n<h4>2.5 関連する作業への配慮<\/h4>\n<p>システムテストは9〜10月で、11月からは先行稼働と主要品目の事前の再配置が始まる。先行稼働では、変更申請と旧版の出庫停止だけを先に本番で使う。そこで、この2つのシナリオを9月に終え、期初に切り替える並べ方のシナリオを10月に置いた。先に使う機能から確かめれば、不具合の修正が先行稼働に間に合う。<\/p>\n<p>また、テストデータのロケーションには、主要品目の再配置の計画を取り込んだ。本番に近い配置でテストでき、計画した棚の割当ての誤りも先に見つけられる。<\/p>", "u": "<h3>第3章 テスト結果を効率的に確認する方法<\/h3>\n<h4>3.1 引当の順序を自動で照合するツール<\/h4>\n<p>出庫引当の結果は、在庫の版、ロット、ロケーションの日時、処理した日時によって変わる。在庫管理担当者に全ての結果を目視で確かめてもらう方法も検討した。しかし、約30通りのシナリオのそれぞれに多数の出庫があり、目視では見落としが出るうえ、10月までに終わらない。<\/p>\n<p>そこで、テストデータと処理した日時から正しい候補の順序を求めるツールを作り、実行結果と自動で照合する方法を採用した。照合の規則は、引当の処理とは別の担当者が要件定義書から作った。同じ人が作ると、同じ思い込みで誤るおそれがあるからである。照合の結果は不一致だけを一覧に出し、確認の手間を減らした。棚卸の区分の、版別の在庫の集計も同じツールで照合した。<\/p>\n<h4>3.2 本番データを使った新旧の比較<\/h4>\n<p>期初の一斉切替の区分では、3工場の本番の在庫データを写したテスト環境で、従来の引当と新しい引当を同じ出庫指示で実行し、結果を並べた。違いの多くは、古い版が優先されたという想定どおりのものである。そこで、想定どおりの違いを規則で自動的に仕分け、残った違いだけを在庫管理担当者が見るようにした。仕分けの規則は、一部を抜き取って人が確かめた。<\/p>\n<p>この方法を採用したのは、本番の在庫には、テストデータでは思い付かない偏りがあるからである。実際に、版不明の在庫が多い品目で、想定と違う順序になる不具合が見つかった。<\/p>\n<h4>3.3 応答時間の確認<\/h4>\n<p>応答の確認では、人がストップウォッチで測る方法は採らなかった。10台の同時出庫を人が測ると、ばらつきが出て手間も掛かる。そこで、端末が読み取った時刻と判定結果を表示した時刻を記録し、2秒を超えた出庫だけを抜き出す方法を採用した。超えた出庫が無ければ合格と、すぐに判断できる。<\/p>\n<h4>3.4 人が見るべき確認は、倉庫で行った<\/h4>\n<p>警告の表示や、古い在庫の場所の分かりやすさは、ツールでは確かめられない。そこで、ツールで確かめられない項目だけを一覧に切り出し、項目ごとに合否の基準を決めた。本社工場の倉庫での確認を1日にまとめ、作業者が実際の端末で判定した結果をチェックリストで回収した。<\/p>\n<p>人が見るべき所だけを人が見ることで、10月までにテストを終え、11月の先行稼働に間に合わせられた。一方、照合ツールの規則は、要件が変わるたびに直す必要がある。今後の4M変更の運用の変更に合わせて、規則を保守する担当を決めておきたい。<\/p>"}, {"id": "h28q2", "group": "次点:設問イを模写", "label": "平成28 問2", "theme": "情報システムの移行方法", "n": {"a": 629, "i": 1486, "u": 1120}, "q": "<h3>問2 情報システムの移行方法について<\/h3><p>情報システムの機能強化のために、新たに開発した情報システム（以下、新システムという）を稼働させる場合、現在稼働している情報システム（以下、現システムという）から新システムへの移行作業が必要になる。<\/p><p>システムアーキテクトは、移行方法の検討において、対象業務の特性による制約条件を踏まえ、例えば、次のような情報システムの移行方法を選択する。<\/p><p>・多数の利用部門があり、教育に時間が掛かるので、利用部門ごとに新システムに切り替える。<\/p><p>・移行当日までに発生したデータを当日中に全て処理しなければ、データの整合性を維持できないので、全部門で現システムから新システムに一斉に切り替える。<\/p><p>・障害が発生すると社会的な影響が大きいので、現システムと新システムを並行稼働させる期間を設けた上で、障害のリスクを最小限にして移行する。<\/p><p>また、移行作業後の業務に支障が出ないようにするために、例えば、次のような工夫をすることも重要である。<\/p><p>・移行作業が正確に完了したことを確認するために、現システムのデータと新システムのデータを比較する仕組みを準備しておく。<\/p><p>・移行作業中に遅延や障害が発生した場合に移行作業を継続するかどうかを判断できるように、切戻しのリハーサルを実施し、所要時間を計測しておく。<\/p><p>あなたの経験と考えに基づいて、設問ア〜ウに従って論述せよ。<\/p><div class=\"ask\"><b>設問ア<\/b>設問ア あなたが移行に携わった情報システムについて、対象業務の概要、現システムの概要、及び現システムから新システムへの変更の概要について、800字以内で述べよ。<\/div><div class=\"ask\"><b>設問イ<\/b>設問イ 設問アで述べた情報システムにおいて、対象業務の特性によるどのような制約条件を踏まえ、どのような移行方法を選択したか。選択した理由とともに、800字以上1,600字以内で具体的に述べよ。<\/div><div class=\"ask\"><b>設問ウ<\/b>設問ウ 設問イで述べた情報システムの移行において、移行作業後の業務に支障が出ないようにするために、どのような工夫をしたか。想定した支障の内容とともに、600字以上1,200字以内で具体的に述べよ。<\/div>", "k": "<p class=\"lead\">この問題の主役は「業務の特性から来る制約条件」と、それで選んだ「移行方法」です。令和7 問2がデータが主役だったのに対して、こちらは切り替え方が主役です。<\/p><ul class=\"pts\"><li>設問ア:対象業務、現システム、新システムへの変更の3つを、問われた順に見出しにします。現システムは「今はどう出庫しているか」まで書くと、変更の意味が伝わります。<\/li><li>設問イ:制約条件を先に並べ、案をその制約で落としていく形にします。「第三の制約から」のように、制約と案の比較を言葉でつなぐのがコツです。<\/li><li>設問ウ:「想定した支障」と「工夫」を必ず対にします。支障を書かずに工夫だけを書くと、設問漏れになります。<\/li><li>添付論文から使う材料:2.4の2段階の移行、3.1の適用開始日時、3.3の警告と理由の記録。<\/li><\/ul><h3>骨子<\/h3><ul class=\"ol\"><li class=\"ch\">第1章 対象業務と現システム、新システムへの変更の概要<\/li><li class=\"sub\">1.1 対象業務 → 共通の文<\/li><li class=\"sub\">1.2 現システム → 2層、ハンディ。品目コードだけで取りやすいものから出庫、4M変更は紙、年末年始に期末棚卸<\/li><li class=\"sub\">1.3 変更 → 廃棄→先入れ先出しに統一(期初3工場一斉)。品目+版のロケーション、引当、申請の電子化、QR。立場<\/li><li class=\"ch\">第2章 制約条件と選択した移行方法<\/li><li class=\"sub\">2.1 制約 → ①順序の規則は3工場同時(移動先で版の順序が逆転する) ②生産を止められない(止まるのは棚卸の2日間) ③現品の作業量(再配置 約300品目・約150時間、貼り替え 約1万枚・約170時間、使えるのは約100時間)<\/li><li class=\"sub\">2.2 比較 → A一斉(③で落ちる) B工場ごと(①で落ちる) C 2段階。Cだけが3つの制約を満たす。代償は終業後の作業。並行稼働は採らず、設定で戻す仕組みで代える<\/li><li class=\"sub\">2.3 内容 → 11月に申請機能と出庫停止を3工場同時に先行稼働(並べ方は従来のまま)。即日停止・期初前に切替の品目は先に再配置 → 第1段階:主要 約200品目・約7千枚を11〜12月の終業後、残り 約100品目・約3千枚を棚卸。再配置した日から有効 → 第2段階:判定条件2つ→期初に並べ方を一斉切替(設定だけ)<\/li><li class=\"ch\">第3章 移行後の業務に支障を出さない工夫<\/li><li class=\"sub\">3.1 支障:紙で承認済みの切替が漏れる → 先行稼働時に未切替の紙の申請を全て取り込み、紙を廃止<\/li><li class=\"sub\">3.2 支障:切替直後の出庫の滞り → 警告の理由と古い在庫の場所を文字で表示、3つの理由で出庫(止めた旧版は不可)。切替後1週間は班長が立ち会う<\/li><li class=\"sub\">3.3 支障:移行データの誤り → 棚卸の現品と照合した差異一覧、現品確認の表示。戻しのリハーサル(約10分)と基準(始業1時間前)<\/li><li class=\"sub\">3.4 結果と課題 → 3つの支障とも起きず、ラインも止まらず。順序外の出庫は奥の棚に偏る → 棚の配置を見直す<\/li><\/ul>", "a": "<h3>第1章 対象業務と現システム、新システムへの変更の概要<\/h3>\n<h4>1.1 対象業務の概要<\/h4>\n<p>B社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。第2・第3工場で製造したユニットを本社工場で組み立てて出荷している。対象の業務は、3工場をまたがる生産計画、部品の所要量計算と発注、受入と検査、倉庫での保管と出庫、工場間の移動、組立、出荷までの生産管理業務と在庫管理業務である。<\/p>\n<h4>1.2 現システムの概要<\/h4>\n<p>現システムは、B社の生産・在庫管理システムである。PCのクライアントとデータベースサーバの2層構成で、サーバは本社工場に置き、第2・第3工場からは専用線で利用する。倉庫ではハンディ端末でロケーションと現品票のQRコードを読み取り、入出庫を記録する。年末年始に3工場一斉の期末棚卸を行う。ロケーションは品目コード単位で管理し、出庫は作業者が品目コードだけを見て、取りやすいものから行っていた。4M変更は紙の申請書で管理していた。<\/p>\n<h4>1.3 新システムへの変更の概要<\/h4>\n<p>B社では4M変更で旧版の部品が棚に滞留し、棚卸のたびに廃棄されていた。そこでB社は出庫を先入れ先出しに統一し、翌年度の期初から3工場一斉に適用することを決めた。新システムでは、ロケーションを品目コードと版の単位に分け、出庫引当で版と生産ロットの古いものを候補にする。また、紙の4M変更申請を電子化し、現品票のQRコードに版と生産ロットを加える。<\/p>\n<p>私はシステム開発会社A社のシステムアーキテクトとして、本機能追加の要件定義から方式設計、移行設計までを担当した。<\/p>", "i": "<h3>第2章 制約条件と選択した移行方法<\/h3>\n<h4>2.1 対象業務の特性による制約条件<\/h4>\n<p>私は、対象業務の特性から、移行の制約条件を次の3つに整理した。<\/p>\n<p>第一に、出庫の順序の規則は3工場で同時に切り替える必要がある。第2・第3工場で作ったユニットや部品は、本社工場に移動して使う。規則が工場で違うと、移動先で版の順序が逆転し、どの版まで使い切ったかを全社で判断できなくなる。個々の4M変更の切替時期は工場ごとに決められるが、順序の規則そのものは分けられない。<\/p>\n<p>第二に、生産を止められない。3工場の生産ラインが止まるのは、年末年始の期末棚卸の2日間だけである。期初はその直後の年明けである。<\/p>\n<p>第三に、現品を動かす作業量が多い。新システムでは版ごとに置き場所を分けるため、4M変更の対象の約300品目は棚の再配置が要る。1品目約30分として約150時間である。現品票の貼り替えは全品目の約1万枚で、1枚約1分として約170時間である。一方、棚卸の2日間に、棚卸と並行して使える倉庫要員の時間は約100時間しかない。この中で全部は終わらない。<\/p>\n<h4>2.2 移行方法の比較と選択<\/h4>\n<p>私は3つの案を比較した。案Aは、年末年始の棚卸の2日間に、棚の再配置から出庫引当の切替までを一度に行う一斉移行である。切替の時点はそろうが、第三の制約から作業が終わらない。案Bは、工場ごとに順に切り替える段階移行である。一度に扱う作業量は減るが、切替の済んだ工場と済んでいない工場の間で部品が移動するたびに順序が崩れ、第一の制約に反する。案Cは、移行を2段階に分ける案である。現品の準備は前倒しで段階的に行い、出庫引当の切替だけを期初に3工場一斉に行う。<\/p>\n<p>私は案Cを選んだ。一斉の切替と生産の継続という第一・第二の制約を満たし、第三の制約の作業量を前倒しで分散できるのは、案Cだけだからである。代償は、11〜12月の終業後の作業が増えることである。<\/p>\n<p>新旧の順序を並行して動かす並行稼働も検討した。しかし、同じ倉庫で2つの出庫順序が混在すると作業者が迷い、取り違えの原因になる。そのため採らなかった。障害への備えは、設定で従来の順序に戻せる仕組みで代えた(3.3で述べる)。<\/p>\n<h4>2.3 2段階の移行の内容<\/h4>\n<p>システムテストを10月までに終え、11月に、変更申請機能と、ロケーションの適用開始日時と出庫停止日時を見て引き当てる処理を、3工場同時に先に稼働させた。出庫の並べ方は従来のままで、この時点から効くのは旧版の出庫停止だけである。<\/p>\n<p>ただし、出庫停止は版ごとに分かれた棚でしか効かない。そこで、即日停止が承認された品目と、期初までに切替の時期が来る品目は、その品目だけ先に再配置する手順とした。即日停止は月に1件あるかないかなので、都度の対応で足りる。<\/p>\n<p>第1段階は、棚の再配置と現品票の貼り替えである。入出庫の実績から出庫の多い主要品目約200品目を選び、その現品票約7千枚とあわせて、11〜12月の終業後に事前に行う。主要品目は期初の初日から出庫が集中し、終わらなかったときの影響が大きいからである。残りの約100品目と約3千枚は約100時間の作業で、棚卸の2日間に収まる。再配置した棚は、その日を適用開始日時として品目と版のロケーションを登録し、在庫を移し替える。<\/p>\n<p>第2段階は、出庫の並べ方の切替である。判定条件は2つとした。主要品目は、在庫数とロケーションの登録内容に差異がないこと。その他の品目は、差異のある品目を一覧にして、出庫前の現品確認に回せることである。条件を満たせば、期初の適用開始日時に3工場一斉に、版と生産ロットの古い順の並べ方へ切り替える。切替は設定の変更だけで済む。<\/p>", "u": "<h3>第3章 移行作業後の業務に支障を出さない工夫<\/h3>\n<h4>3.1 移行前に決まっていた4M変更の切替漏れ<\/h4>\n<p>想定した支障の一つ目は、移行前に紙で承認された4M変更のうち、切替が期初より後になるものが漏れることである。漏れれば、切替後に旧版が出庫され、切替方法に違反する。4M変更は月平均4〜5件あり、移行の前後も止まらない。紙のままでは、新しい仕組みに切替の日時が伝わらない。<\/p>\n<p>そこで、11月に変更申請機能を先に稼働させる時点で、承認済みで切替が済んでいない紙の申請を全て取り込み、紙の申請は廃止した。取り込んだ申請も、新しい申請と同じく、切替方法に応じた日時がロケーションに登録される。切替の時期になると、人手を介さずに旧版の出庫が止まる。<\/p>\n<h4>3.2 切替直後の出庫の滞り<\/h4>\n<p>二つ目は、切替直後に作業者が新しい順序に戸惑い、出庫が滞ることである。古い在庫の場所を知らなければ、順序を指示されても守れない。<\/p>\n<p>そこで、読み取った現品票より古い在庫がある場合は、警告の理由と古い在庫のロケーションをハンディ端末に文字で表示した。また、古い在庫が奥にあって取り出せない場合などは、3つの理由から選択すれば出庫できるようにした。作業を止めずに、順序を外れた出庫を後から確認できる。ただし、出庫を止めた旧版は、理由を選んでも出庫できない。さらに、切替後の1週間は、朝の出庫が集中する時間帯に班長が倉庫に立ち、警告が出た作業者に理由の選び方をその場で教えることにした。<\/p>\n<h4>3.3 移行データの誤りによる引当の失敗<\/h4>\n<p>三つ目は、ロケーションの登録内容と現品が食い違い、引当の候補に実在しない在庫が出ることである。そこで、切替の前に、棚卸で数えた現品と新しいロケーションの在庫を3工場分照合し、差異を一覧に出す仕組みを用意した。差異が残った品目は、出庫の際に現品確認を促す表示を端末に出す。<\/p>\n<p>さらに、出庫引当の順序を設定で従来に戻せるようにした。戻す手順は本番のデータの写しでリハーサルし、所要時間が約10分であることを確かめた。この結果から、切替日の始業1時間前に主要品目の差異が残っていれば従来の順序に戻す、という基準を在庫管理担当者と事前に合意した。戻しても、再配置した棚と現品票はそのまま使えるので、出庫は続けられる。<\/p>\n<h4>3.4 結果と今後の課題<\/h4>\n<p>期初には判定条件を満たした状態で切り替えられ、従来の順序に戻す基準に当たることも無かった。切替後の1週間、取り込んだ申請の旧版が出庫されることは無かった。現品確認に回した品目でも引当の失敗は起きず、部品待ちで生産ラインが止まることも無かった。一方、理由を選択して順序を外れた出庫は、奥の棚に古い在庫が残る品目に偏っていた。今後は、記録された理由を在庫管理担当者と分析し、棚の配置を見直していきたい。<\/p>"}, {"id": "h27q2", "group": "骨子を読む", "label": "平成27 問2", "theme": "業務の課題に対応するための業務機能の変更又は追加", "n": {"a": 703, "i": 1519, "u": 1144}, "q": "<h3>問2 業務の課題に対応するための業務機能の変更又は追加について<\/h3><p>システムアーキテクトは、業務の課題に対応するために、情報システムの業務機能を変更したり追加したりする。<\/p><p>例えば、通信販売業で、受注量や納品場所などの変更を出荷指示直前まで受け付け、受注当日中に出荷したいという業務の課題に対応するためには、次のような業務機能の変更又は追加が必要となる。<\/p><p>・翌日以降分だけが可能であった受注内容の変更を、出荷指示直前まで受け付け、変更内容を作業計画や作業指示に反映する。そのため、受注から出荷指示までの既存の各業務機能を、日次起動方式から随時起動方式に変更する。<\/p><p>・出荷作業時間を短縮するために、既存の出荷指示機能に、出荷作業者の倉庫内の移動距離が最短となるピッキング順序を指示する機能を追加する。<\/p><p>このような業務機能の変更又は追加では、既存機能の活用や既存の情報システムへの影響の最小化のために、例えば次のような工夫をすることも重要である。<\/p><p>・既存の出荷指示のロジック部分をそのまま利用し、処理方式を随時起動方式に変更することで、受注内容が変更される都度、出荷指示内容に反映できるようにする。<\/p><p>・出荷機能に影響を与えないよう、ピッキング順序を最適化する機能を新たに開発し、既存の情報システムから利用する方式にする。<\/p><p>あなたの経験と考えに基づいて、設問ア〜ウに従って論述せよ。<\/p><div class=\"ask\"><b>設問ア<\/b>設問ア あなたが携わった情報システムにおいて、業務機能の変更又は追加を必要とするような業務の課題はどのようなものであったか。対象となった情報システムの概要、及び業務の概要とともに、800字以内で述べよ。<\/div><div class=\"ask\"><b>設問イ<\/b>設問イ 設問アで述べた業務の課題に対応するために、どのような業務機能の変更又は追加が必要となったか。業務の課題に対応できると考えた理由とともに、800字以上1,600字以内で具体的に述べよ。<\/div><div class=\"ask\"><b>設問ウ<\/b>設問ウ 設問イで述べた業務機能の変更又は追加の際、既存機能の活用や既存の情報システムへの影響の最小化のために、どのような工夫をしたか、600字以上1,200字以内で具体的に述べよ。<\/div>", "k": "<p class=\"lead\">添付論文に最も近い問題です。違いは、設問ウが「既存機能の活用と影響の最小化」を問うことです。採点講評は、「システムの変更が業務にどんな効果をもたらすか」まで書いていない論述を指摘しています。<\/p><ul class=\"pts\"><li>設問ア:「業務の課題」が主役。廃棄と切替方法の違反を、業務の言葉で書きます。<\/li><li>設問イ:課題の原因を3つに分け、機能を1対1で対応させます。各機能に「これで課題に対応できると考えた理由」を付けます。<\/li><li>設問ウ:既存の何をそのまま使い、何に手を入れなかったかを、処理・画面・帳票・QRコードの順に書きます。<\/li><\/ul><h3>骨子<\/h3><ul class=\"ol\"><li class=\"ch\">第1章 業務の課題と、情報システム及び業務の概要<\/li><li class=\"sub\">1.1 業務 / 1.2 システム → 共通の文<\/li><li class=\"sub\">1.3 課題 → 取りやすいものから出庫→滞留・廃棄。切替方法が守られない。目標:廃棄金額を前年度の3割減、切替方法を確実に守る。立場<\/li><li class=\"ch\">第2章 必要となった業務機能の変更と追加<\/li><li class=\"sub\">2.1 原因 → ①版が混在する棚 ②手元に判断の情報がない ③切替の情報が紙<\/li><li class=\"sub\">2.2 ロケーション管理の変更 → 品目+版、出庫停止日時。再配置前の即日停止は先に棚を分ける。棚はそのままの案と比較<\/li><li class=\"sub\">2.3 出庫引当と現品票の変更 → 古い順の候補(版不明→版→ロット)。現品票を変えない案と比較。QRに版とロット、警告と場所<\/li><li class=\"sub\">2.4 変更申請機能の追加 → 担当者が棚を指定、品質保証部の管理者の承認で日時を登録。紙のままの案と比較<\/li><li class=\"sub\">2.5 対応できる理由 → 廃棄の内訳(取り残し約5割、使い切り前約3割)。前者は古い順で、後者は承認前に在庫数と出庫予定を示して減らす → 3割減に届く<\/li><li class=\"ch\">第3章 既存機能の活用と影響の最小化<\/li><li class=\"sub\">3.1 引当の数量処理はそのまま。前に絞り込みと並べ替えを足す。出庫指示の画面は修正なし、端末は警告だけ追加<\/li><li class=\"sub\">3.2 新しい処理は独立した部品に。既存の画面は呼出し1か所<\/li><li class=\"sub\">3.3 帳票は品目単位の見せ方でそのまま(棚卸表だけ版別に)。所要量計算はあえて修正(止めた在庫を除く、1か所だけ)<\/li><li class=\"sub\">3.4 QRは末尾に追加。結果(修正の量)と残課題(版別の追跡は品質保証部と合意して範囲外)<\/li><\/ul>", "a": "<h3>第1章 業務の課題と、情報システム及び業務の概要<\/h3>\n<h4>1.1 業務の概要<\/h4>\n<p>B社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。第2・第3工場で製造したユニットを本社工場で組み立てて出荷している。対象の業務は、3工場の倉庫での部品の保管と出庫、及び部品の作り方を変える4M変更の管理である。<\/p>\n<h4>1.2 情報システムの概要<\/h4>\n<p>対象の情報システムは、B社の生産・在庫管理システムである。PCのクライアントとデータベースサーバの2層構成で、サーバは本社工場に置き、第2・第3工場からは専用線で利用する。倉庫ではハンディ端末でロケーションと現品票のQRコードを読み取り、入出庫を記録する。<\/p>\n<h4>1.3 業務の課題<\/h4>\n<p>B社では4M変更が月平均4〜5件発生し、内製品の版が変わる。しかし倉庫では、作業者が品目コードだけを見て、取りやすい部品から出庫していた。そのため変更前の版の部品が棚の奥に残って長期滞留し、棚卸のたびに廃棄の対象になっていた。B社は廃棄物の削減を環境目標に掲げている。期末棚卸の廃棄記録と紙の4M変更申請書を照合すると、旧版の廃棄は部品の廃棄の主な要因であった。<\/p>\n<p>また、4M変更ごとに決まる切替方法も守られていなかった。旧版を即日止めるべき変更は月に1件あるかないかだが、その場合でも旧版が出庫されることがあった。品質問題に直結する誤りである。<\/p>\n<p>そこでB社は、4M変更に伴う旧版部品の廃棄金額を前年度の3割減とすること、4M変更の切替方法を確実に守ることを業務の課題とした。対応の方向として、出庫を先入れ先出しに統一することを決めた。私はシステム開発会社A社のシステムアーキテクトとして、この課題に対応する機能の変更と追加の要件定義から方式設計までを担当した。<\/p>", "i": "<h3>第2章 必要となった業務機能の変更と追加<\/h3>\n<h4>2.1 課題の原因の分析<\/h4>\n<p>私はまず、在庫管理担当者と倉庫作業者に聞き取り、課題の原因を整理した。原因は3つあった。第一に、ロケーションが品目コード単位で、同じ棚に新旧の版が混在していた。第二に、出庫の順序を判断する情報が、作業者の手元に無かった。システムは生産ロットの管理番号を持っていたが、現品票のQRコードには版も生産ロットも含まれていなかった。第三に、4M変更は紙の申請書で管理され、在庫の側は切替方法や時期を知る手段が無かった。<\/p>\n<h4>2.2 ロケーション管理機能の変更<\/h4>\n<p>一つ目の原因に対して、ロケーションを品目コードと版の単位に分け、出庫停止日時を持たせた。置き場所で版が分かれれば、作業者が取り違えることを物理的に防げる。また、旧版を即日止める場合も、棚単位で出庫を止められる。これで、切替方法を守れない状態を解消できると考えた。出庫停止は版ごとに分かれた棚でしか効かないので、棚の再配置が済む前に即日停止が出た品目は、その品目だけ先に棚を分ける。<\/p>\n<p>棚は品目コード単位のまま、出庫時にシステムが古いものを指示する案も検討した。棚の再配置が要らず移行は軽いが、同じ棚に新旧の版が混在する限り、取り違えは防げない。品質上は切替方法を確実に守ることが最も重要と考え、棚を分ける案を選んだ。<\/p>\n<h4>2.3 出庫引当機能と現品票発行機能の変更<\/h4>\n<p>二つ目の原因に対して、出庫引当機能を変更した。出庫を止めていないロケーションから、版、生産ロットの順に古いものを候補として示す。版は4M変更のたびに番号が上がるので番号の小さい版を古いとし、同じ版の中は生産ロットの製造日の順とした。版の分からない古い在庫は「版不明」として最も古く扱う。古いものから使い切れば、旧版が棚の奥に残らず、廃棄が減ると考えた。<\/p>\n<p>現品票は変えず、出すべき在庫の棚だけを端末に指示する案も検討した。しかし、同じ棚に複数のロットがあると、作業者が指示どおりの現品を取ったかをシステムで確かめられない。そこで現品票を変える案を選んだ。<\/p>\n<p>現品票発行機能では、QRコードに版と生産ロットの管理番号を加えた。読み取った現品票より古い在庫がある場合は、警告とともに古い在庫の場所をハンディ端末に表示する。<\/p>\n<h4>2.4 変更申請機能の追加<\/h4>\n<p>三つ目の原因に対して、紙の4M変更申請を電子化する変更申請機能を追加した。申請者は切替方法と時期を入力し、在庫管理担当者が在庫への影響を確かめて新版の棚を指定する。<\/p>\n<p>品質保証部の管理者が承認すると、新版のロケーションを適用開始日時付きで登録し、旧版のロケーションには切替方法に応じて出庫停止日時を設定する。こうすれば、切替方法と時期が在庫の側に確実に伝わり、切替の当日に担当者がマスタを更新する必要も無くなる。<\/p>\n<p>申請書は紙のまま、承認後に在庫管理担当者が登録する案も検討した。しかし、切替違反の元は紙の回覧と当日の手作業にあり、それが残る案では課題に対応できないと考えた。<\/p>\n<h4>2.5 課題に対応できると考えた理由<\/h4>\n<p>この3つの変更と追加により、課題の3つの原因をそれぞれ取り除ける。切替方法は、日時で出庫が止まるので人に頼らず守れる。<\/p>\n<p>廃棄は、前年度の内訳から判断した。期末棚卸の廃棄記録と申請書を照合すると、旧版の廃棄金額の約5割は、新しい版から先に出庫して棚の奥に旧版が取り残されたものであった。約3割は、出庫の少ない品目で、旧版を使い切る前に切替時期が来たものであった。前者は古い順の出庫で減らせる。後者は古い順に出しても残る。そこで、承認の前に旧版の在庫数と出庫予定を画面に示し、使い切れる時期に切替を合わせられるようにした。前者を半分に減らし、後者も一部減らせば、3割減の目標に届くと判断した。<\/p>", "u": "<h3>第3章 既存機能の活用と、既存システムへの影響を最小化する工夫<\/h3>\n<h4>3.1 出庫引当の既存の処理をそのまま使った<\/h4>\n<p>出庫引当には、在庫の数量を引き当てる既存の処理がデータベースサーバのストアドプロシージャとしてあり、出庫指示の画面とハンディ端末の両方から呼ばれていた。この処理を作り直すと、両方の呼出し元のテストが必要になる。そこで、数量を引き当てる部分はそのまま使い、その前に「有効なロケーションへの絞り込み」と「古い順への並べ替え」を加えるだけにした。呼出し元から見た使い方は変わらないので、出庫指示の画面は修正しなかった。ハンディ端末は、返ってきた候補と読み取った現品票を比べて警告を出す部分だけを追加した。<\/p>\n<h4>3.2 新しい処理は独立した部品にした<\/h4>\n<p>ロケーションの登録や出庫停止の処理は、既存の在庫管理の画面に書き加えるのではなく、ロケーション管理の部品として新たに作った。変更申請機能は、承認時にこの部品を呼び出す。在庫管理の画面からも同じ部品を呼べるので、同じ処理を2か所に作らずに済む。既存の画面への変更は、部品を呼び出す1か所だけにとどめた。<\/p>\n<h4>3.3 既存のデータと帳票への影響を抑えた<\/h4>\n<p>ロケーションマスタには項目を追加したが、既存の項目は残した。棚卸表などの既存の帳票は、品目コード単位で在庫を集計している。そこで、版を区別せずに品目コード単位で集計する見せ方を用意し、会計向けの集計などの既存の帳票はそれを使うようにした。ただし棚卸表だけは、旧版の滞留を棚卸で確かめられるよう、版を区別して出すように直した。これで、作り直す帳票を棚卸表の1つに絞れた。<\/p>\n<p>一方、所要量計算は、影響を避けずにあえて修正した。出庫を止めた版の在庫を除いた数量を見るようにし、適用開始前の新版は適用開始日以降の所要にだけ引き当てる。止めた在庫を使える在庫として数えると、発注が遅れて欠品するからである。ただし修正は、使える在庫の数量を求める1か所に限った。会計向けの集計は、廃棄するまで止めた在庫も含めたままである。<\/p>\n<h4>3.4 既存のQRコードの読取りを壊さなかった<\/h4>\n<p>QRコードに版とロットを加える際、既存の項目の並びは変えず、末尾に追加した。受入など、既存の読取りの処理は、先頭からの並びで品目コードを読んでいる。末尾に追加すれば、既存の処理は修正せずにそのまま使える。<\/p>\n<p>これらの工夫で、出庫指示の画面と既存の読取りの処理は修正せず、作り直す帳票は棚卸表の1つ、既存の画面の変更は部品を呼び出す1か所にとどめた。一方、品目コード単位の見せ方を使う帳票では、版の違いが見えない。品質保証部は版別の出荷の追跡を求めている。しかし、廃棄の削減と切替方法の順守という今回の課題には直結しない。品質保証部と合意のうえ、期初の範囲からは外した。要件として記録しており、今後は帳票ごとに見直していきたい。<\/p>"}, {"id": "h28q1", "group": "骨子を読む", "label": "平成28 問1", "theme": "業務要件の優先順位付け", "n": {"a": 531, "i": 1387, "u": 1138}, "q": "<h3>問1 業務要件の優先順位付けについて<\/h3><p>情報システムの開発における要件定義において、システムアーキテクトは利用者などとともに、提示された業務要件を精査する。その際、提示された業務要件の全てをシステム化すると、コストが増大したり、開発期間が延びたりするおそれがある。そのため、システムアーキテクトは、業務要件のシステム化によって得られる効果と必要なコストや開発期間などから、例えば次のような手順で、提示された業務要件に優先順位を付ける。<\/p><p>1. 業務の特性や情報システムの開発の目的などを踏まえて、組織の整備や教育訓練などの準備の負荷、業務コスト削減の効果及び業務スピードアップの度合いといった業務面での評価項目を設定する。また、適用する技術の検証の必要性、影響する他の情報システムの修正を含む開発コスト及び開発期間といったシステム面での評価項目を設定する。<\/p><p>2. 業務の特性や情報システムの開発の目的などを踏まえて、評価項目ごとに重み付けをする。<\/p><p>3. 業務面、システム面でのそれぞれの評価項目について、業務要件ごとに定量的に評価する。このとき、定性的な評価項目についても、定量化した上で評価する。<\/p><p>4. 評価項目ごとに付与された重みを加味して総合的に評価し、実現すべき業務要件の優先順位を付ける。<\/p><p>あなたの経験と考えに基づいて、設問ア〜ウに従って論述せよ。<\/p><div class=\"ask\"><b>設問ア<\/b>設問ア あなたが要件定義に携わった情報システムについて、その概要を、情報システムの開発の目的、対象の業務の概要を含めて、800字以内で述べよ。<\/div><div class=\"ask\"><b>設問イ<\/b>設問イ 設問アで述べた情報システムの要件定義で、業務要件をどのような手順で評価したか。その際、どのような評価項目を設定し、どのような考えで重み付けをしたか。800字以上1,600字以内で具体的に述べよ。<\/div><div class=\"ask\"><b>設問ウ<\/b>設問ウ 設問イで述べた評価手順に沿って、どのような業務要件をどのように評価したか。また、その結果それらの業務要件にどのような優先順位を付けたか。幾つかの業務要件について、600字以上1,200字以内で具体的に述べよ。<\/div>", "k": "<p class=\"lead\">この問題は、問題文の手順1〜4(評価項目→重み→定量化→総合評価)を、そのまま設問イの骨格にします。設問ウは「幾つかの業務要件」を、点数の理由とともに書きます。添付論文の3つの業務要件に、他の部門からの要望を加えて並べています。<\/p><ul class=\"pts\"><li>設問ア:「開発の目的」を必ず書きます。イの重み付けの理由になります。適用開始日が動かせないこともここで書きます。<\/li><li>設問イ:手順、評価項目(業務面とシステム面)、重みの考え方の3つ。定性的な項目を点数にする基準も書きます。<\/li><li>設問ウ:5つの要件の点数と合計を全て示します(数値を出さない方針の例外)。表は使えないので文章で並べます。高い順位と低い順位の両方を書き、見送った要件には「再検討の条件」を添えます。<\/li><\/ul><h3>骨子<\/h3><ul class=\"ol\"><li class=\"ch\">第1章 情報システムの概要と開発の目的、対象の業務<\/li><li class=\"sub\">1.1 業務 / 1.2 システム → 共通の文<\/li><li class=\"sub\">1.3 目的 → 廃棄の削減と切替の順守。適用開始日は動かせない。立場<\/li><li class=\"ch\">第2章 評価手順、評価項目と重み付け<\/li><li class=\"sub\">2.1 要件と手順 → 5部門の5要件。枠は20人月、前提の3つ(申請の電子化・QR・品目+版のロケーション)に8人月 → 残り12人月。4つの手順。項目と重みは要件を見る前に合意<\/li><li class=\"sub\">2.2 項目 → 業務面(目的への寄与、準備の負荷) システム面(開発期間、影響、検証)。寄与の基準(直接3・見える化2・薄い1)、期間の基準(2人月以下で調整なし3・余裕小2・おそれ1)<\/li><li class=\"sub\">2.3 重み → 寄与3、期間2、他1。全項目同じ重みの案は採らない。同点は寄与で決める<\/li><li class=\"ch\">第3章 業務要件の評価と優先順位<\/li><li class=\"sub\">3.1 結果 → 即日停止24/古い順17/場所の案内17/滞留一覧15/輸送中の版管理13<\/li><li class=\"sub\">3.2 上位 → 即日停止(寄与3・期間3・準備3・影響3・検証3)。古い順(3・2・1・1・2:約300品目の再配置と全員の教育)。場所の案内(2・2・3・2・2)。同点 → 寄与で古い順が2位<\/li><li class=\"sub\">3.3 下位 → 滞留一覧(1・2・3・2・3:評価損の計上用で原因分析に使えない)4位。輸送中の版管理(2・1・2・1・2)5位<\/li><li class=\"sub\">3.4 決定と合意 → 見積り2・7・3人月で残り12人月が埋まる → 上位3つ。棚の図の表示は遅れたら後へ。重みを変えても上位3つは同じ。見送りに再検討の条件。結果と残課題(準備の負荷を作業時間で評価したい)<\/li><\/ul>", "a": "<h3>第1章 情報システムの概要と開発の目的、対象の業務<\/h3>\n<h4>1.1 対象の業務の概要<\/h4>\n<p>B社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。第2・第3工場で製造したユニットを本社工場で組み立てて出荷している。対象の業務は、3工場の倉庫での部品の保管と出庫、工場間の移動、及び部品の作り方を変える4M変更の管理である。<\/p>\n<h4>1.2 情報システムの概要<\/h4>\n<p>対象の情報システムは、B社の生産・在庫管理システムである。PCのクライアントとデータベースサーバの2層構成で、サーバは本社工場に置き、第2・第3工場からは専用線で利用する。倉庫ではハンディ端末でロケーションと現品票のQRコードを読み取り、入出庫を記録する。<\/p>\n<h4>1.3 開発の目的<\/h4>\n<p>B社では4M変更が月平均4〜5件発生し、変更前の版の部品が棚の奥に滞留して、棚卸のたびに廃棄されていた。また、4M変更ごとに決まる切替方法が守られず、旧版が出庫されることがあった。B社は業務改善指針で出庫を先入れ先出しに統一し、翌年度の期初から3工場一斉に適用することを決めた。開発の目的は、旧版の滞留による廃棄を減らすことと、切替方法を確実に守ることである。適用開始日は指針で決まっており、動かせない。<\/p>\n<p>私はシステム開発会社A社のシステムアーキテクトとして、この機能追加の要件定義を担当した。<\/p>", "i": "<h3>第2章 業務要件の評価手順、評価項目と重み付け<\/h3>\n<h4>2.1 提示された業務要件と評価の手順<\/h4>\n<p>要件定義では、関係部門から多くの業務要件が提示された。例えば、在庫管理課からは古い順の出庫、品質保証部からは旧版の即日停止、倉庫からは古い在庫の場所の案内、経理部からは滞留在庫の一覧、生産管理部からは工場間で輸送中の在庫の版管理である。しかし、期初までの開発の枠は20人月であり、全てを作ることはできなかった。<\/p>\n<p>なお、4M変更の申請の電子化、現品票のQRコードの変更、ロケーションを品目と版の単位にする変更は、どの要件にも前提となる。そこで先に期初の範囲に入れ、点数による評価の対象から外した。これらに8人月を要し、残りの枠は12人月であった。<\/p>\n<p>そこで私は、次の手順で評価した。第一に、業務面とシステム面の評価項目を決める。第二に、開発の目的と業務の特性から、評価項目に重みを付ける。第三に、業務要件ごとに、各評価項目を3段階の点数で評価する。第四に、重みを掛けて合計し、順位を付ける。評価項目と重みは、要件を評価する前に関係部門と合意した。要件を見てから重みを決めると、声の大きい部門の要件に有利な重みになりやすいからである。<\/p>\n<h4>2.2 評価項目<\/h4>\n<p>業務面の評価項目は2つである。一つは、開発の目的への寄与である。廃棄の削減と切替方法の順守に、どれだけ直接効くかを見る。もう一つは、業務の準備の負荷である。棚の再配置や作業者の教育がどれだけ必要かを見る。この負荷は、倉庫の班長と一緒に、再配置する棚の範囲と教育の対象者から見積もった。業務コストの削減と業務のスピードアップは、今回の要件の多くが出庫の時間を変えないため差が付かず、項目にしなかった。<\/p>\n<p>システム面の評価項目は3つである。期初までに開発できるかという開発期間、既存の機能や他のシステムへの影響、適用する技術の検証の必要性である。開発コストは、今回は開発期間とほぼ比例するため、開発期間の項目にまとめた。ただし、枠に収まるかどうかは、順位を付けた後に見積りの人月で確かめることにした。<\/p>\n<p>どの項目も3点を最も良い点とした。開発の目的への寄与は定性的な項目なので、点数にする基準を決めた。廃棄や切替違反の原因を直接取り除くものを3点、原因を見える化して間接的に効くものを2点、関係が薄いものを1点とした。開発期間は、見積りが2人月以下で他のシステムとの調整が要らないものを3点、期初に間に合うが余裕が小さいものを2点、間に合わないおそれがあるものを1点とした。準備の負荷、他への影響、技術の検証は、負荷や影響が小さいものほど高い点にした。<\/p>\n<h4>2.3 重み付けの考え方<\/h4>\n<p>開発の目的への寄与に、最も大きい重み3を付けた。今回の開発は廃棄の削減と切替の順守のためであり、これに効かない要件は後回しにしてよいと考えたからである。次に、開発期間に重み2を付けた。適用開始日は指針で決まっていて動かせず、間に合わない要件は期初の業務に使えないからである。業務の準備の負荷、他への影響、技術の検証には、重み1を付けた。特に技術の検証は、今回の要件の多くが既存の技術の範囲で作れるため、要件の間で差が付きにくいと考えた。<\/p>\n<p>全ての項目を同じ重みにする案も検討した。しかし、それでは作りやすい要件ほど上位になり、目的に効く要件が後回しになる。また、合計点が同じになった場合は、寄与の点が高い要件を上位にすると、あわせて合意した。<\/p>", "u": "<h3>第3章 業務要件の評価と優先順位<\/h3>\n<h4>3.1 評価の結果<\/h4>\n<p>5つの業務要件を、合意した手順と重みで評価した。合計は、旧版の即日停止が24点、古い順の出庫と古い在庫の場所の案内が17点、滞留在庫の一覧が15点、輸送中の在庫の版管理が13点となった。<\/p>\n<h4>3.2 上位の業務要件<\/h4>\n<p>品質保証部の「旧版を即日止めたい」という要件は、寄与3、期間3、準備3、影響3、検証3である。切替違反の原因を直接取り除くので、寄与は3点とした。前提としたロケーションの出庫停止日時を使えば実現でき、見積りは2人月である。準備も3点である。即日停止は月に1件あるかないかで、その都度1品目の旧版を別の棚に分ければ済む。<\/p>\n<p>在庫管理課の「古い順の出庫」は、寄与3、期間2、準備1、影響1、検証2である。寄与は3点だが、約300品目の棚の再配置と作業者全員の教育が要るので準備は1点、出庫引当を変えるので影響も1点とした。<\/p>\n<p>倉庫の「古い在庫の場所の案内」は、寄与2、期間2、準備3、影響2、検証2である。古い順の出庫を作業者が守るための手段なので寄与は2点、端末の画面の変更だけなので準備は3点とした。同点のため、合意した規則で、寄与の高い古い順の出庫を第2位、場所の案内を第3位とした。<\/p>\n<h4>3.3 下位の業務要件<\/h4>\n<p>経理部の「滞留在庫の一覧」は、寄与1、期間2、準備3、影響2、検証3で第4位である。経理部が求めたのは、期末の評価損を計上するための金額の一覧である。品目と版ごとの滞留は示さず、廃棄の原因の分析には使えないので、寄与は1点とした。見積りは2人月だが、会計システムから単価を受け取る調整が要るので、期間は2点とした。<\/p>\n<p>生産管理部の「輸送中の在庫の版管理」は、寄与2、期間1、準備2、影響1、検証2で第5位である。工場間の移動と出荷の両方の機能を直す必要があり、期初に間に合わないおそれがあった。<\/p>\n<h4>3.4 優先順位の決定と合意<\/h4>\n<p>次に、順位を開発の枠と照らした。見積りは、即日停止が2人月、古い順の出庫が7人月、場所の案内が3人月で、上位3つで残りの枠の12人月が埋まった。第4位を加えると枠を超えるので、上位3つを期初の範囲とした。枠に余裕が無いので、場所の案内のうち棚の図の表示は、遅れたら後へ回す部分と決めた。<\/p>\n<p>重みの影響も確かめた。開発期間の重みを1に下げても、準備の負荷の重みを2に上げても、同点の規則を含めて上位3つは変わらなかった。<\/p>\n<p>見送った要件には、再検討の条件を添えた。例えば輸送中の在庫の版管理は、工場間の移動で版の取り違えが起きたら再検討する。点数と条件を示したので、見送りの部門も納得した。<\/p>\n<p>その結果、期初に上位3つを3工場で使い始められた。一方、寄与の点数で順位がほぼ決まり、準備の負荷の差は表れにくかった。今後は、準備の負荷を作業時間で評価したい。<\/p>"}, {"id": "h29q2", "group": "骨子を読む", "label": "平成29 問2", "theme": "柔軟性をもたせた機能の設計", "n": {"a": 647, "i": 1417, "u": 1088}, "q": "<h3>問2 柔軟性をもたせた機能の設計について<\/h3><p>販売管理システムにおける販売方法の追加、生産管理システムにおける生産方式の変更など、業務ルールが度々変化する情報システムや業務ソフトウェアパッケージの開発では、様々な変化や要望に対して、迅速かつ低コストでの対応を可能にする設計、言い換えると柔軟性をもたせた機能の設計が求められる。<\/p><p>システムアーキテクトは、情報システムの機能に柔軟性をもたせるために、例えば、次のような設計をする。<\/p><p>・“商品ごとに保管する倉庫が一つ決まっている”という多対1の業務ルールを、“商品はどの倉庫でも保管できる”という多対多の業務ルールに変更できるように、商品と倉庫の対応を関係テーブルにしておく。<\/p><p>・多様な見積ロジックに対応できるように、複数の見積ロジックをあらかじめ用意しておき、外部パラメタの設定で選択できるようにしておく。<\/p><p>また、このような柔軟性をもたせた機能の設計では、処理が複雑化する傾向があり、開発コストが増加してしまうことが多い。開発コストの増加を抑えるためには、例えば、次のように対象とする機能や項目を絞り込むことも重要である。<\/p><p>・過去の実績、事業環境の変化、今後の計画などから変更の可能性を見極め、柔軟性をもたせる機能を絞り込む。<\/p><p>・業務の特性などから、変更可能な項目を絞り込むことで、ロジックを簡略化する。<\/p><p>あなたの経験と考えに基づいて、設問ア〜ウに従って論述せよ。<\/p><div class=\"ask\"><b>設問ア<\/b>設問ア あなたが設計に携わった情報システムについて、対象業務の概要、情報システムの概要、柔軟性をもたせた機能の設計が必要になった背景を、800字以内で述べよ。<\/div><div class=\"ask\"><b>設問イ<\/b>設問イ 設問アで述べた情報システムで、機能に柔軟性をもたせるために、どのような機能に、どのような設計をしたか。柔軟性の対象にした業務ルールを含めて、800字以上1,600字以内で具体的に述べよ。<\/div><div class=\"ask\"><b>設問ウ<\/b>設問ウ 設問イで述べた設計において、開発コストの増加を抑えるために実施した機能や項目の絞り込みについて、その絞り込みが適切であると考えた理由を、600字以上1,200字以内で具体的に述べよ。<\/div>", "k": "<p class=\"lead\">この問題の主役は「業務ルール」と「それを変えられるようにした設計」です。設問イでは、先に柔軟性の対象にした業務ルールを「」で言葉にしてから、設計を書きます。設問ウは「絞り込んだ内容」と「適切と考えた理由」を対にし、理由には過去の実績や指針などB社の事実を使います。<\/p><ul class=\"pts\"><li>設問ア:背景は「4M変更が月4〜5件、切替方法が3通り → 変更のたびにプログラム修正では間に合わない」の順。<\/li><li>設問イ:業務ルール2つ → それぞれの設計。切替方法3通りを日時の組合せで表す部分が見せ場です。<\/li><li>設問ウ:「こういう案もあったが、実績から絞った」を2つ。最後に絞り込みの結果と、将来見直す条件を書きます。<\/li><li>添付論文から使う材料:2.2の関係テーブル化(案B)、3.1の適用開始日時と出庫停止日時。<\/li><\/ul><h3>骨子<\/h3><ul class=\"ol\"><li class=\"ch\">第1章 対象業務と情報システムの概要、設計が必要になった背景<\/li><li class=\"sub\">1.1 業務 / 1.2 システム → 共通の文<\/li><li class=\"sub\">1.3 背景 → 先入れ先出し。4M変更月4〜5件、切替方法3通り。方法ごとに処理を作ると修正とテストが追い付かない → 設定で対応できる設計。立場<\/li><li class=\"ch\">第2章 柔軟性をもたせた機能と設計<\/li><li class=\"sub\">2.1 業務ルール → ①どの版をいつからいつまで出庫してよいか ②「1品目1置き場所」→「版の数だけ置き場所」。品目マスタは対象外<\/li><li class=\"sub\">2.2 出庫可否 → 2つの日時。3通りを日時の組合せで表す。版不明は最優先、即日停止では版不明にも出庫停止日時。承認時に自動登録。3案比較(方法ごとに処理/種類をパラメタ/日時)を「対応の手間・表せる範囲・テストの量」で → 日時(数量条件は表せないと認めた上で)<\/li><li class=\"sub\">2.3 置き場所 → 2案比較(品目マスタに項目/ロケーションのキーを品目+版に)→ 後者。解除と再利用、解除候補の条件(在庫も入庫予定も無く、適用開始日時を過ぎた)<\/li><li class=\"ch\">第3章 開発コストを抑えるための絞り込み<\/li><li class=\"sub\">3.1 出庫の順序はパラメタにしない → テスト6通りが12通り、約2人月増。過去3年・約160件の申請書で順序は一度も変わっていない、指針<\/li><li class=\"sub\">3.2 項目は2つの日時だけ → 数量条件は160件に1件も無い。工場別日時は不要(ロケーションが工場別)<\/li><li class=\"sub\">3.3 理由のまとめ → 実績と指針。稼働後半年で約30件、修正0件。4つ目の切替方法(1か月併用)にも設定だけで対応。見直す条件(使用期限)と、並べ替えを1か所にまとめた備え<\/li><\/ul>", "a": "<h3>第1章 対象業務と情報システムの概要、設計が必要になった背景<\/h3>\n<h4>1.1 対象業務の概要<\/h4>\n<p>B社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。第2・第3工場で製造したユニットを本社工場で組み立てて出荷している。対象の業務は、3工場をまたがる生産計画、部品の所要量計算と発注、受入と検査、倉庫での保管と出庫、工場間の移動、組立、出荷までの生産管理業務と在庫管理業務である。<\/p>\n<h4>1.2 情報システムの概要<\/h4>\n<p>対象の情報システムは、B社の生産・在庫管理システムである。PCのクライアントとデータベースサーバの2層構成で、サーバは本社工場に置き、第2・第3工場からは専用線で利用する。倉庫ではハンディ端末でロケーションと現品票のQRコードを読み取り、入出庫を記録する。<\/p>\n<h4>1.3 柔軟性をもたせた設計が必要になった背景<\/h4>\n<p>B社では4M変更で旧版の部品が棚に滞留し、廃棄の原因になっていた。そこでB社は出庫を先入れ先出しに統一し、本システムに版と生産ロットの古い順に出庫させる機能を追加した。<\/p>\n<p>4M変更は月平均4〜5件発生し、変更ごとに旧版から新版への切替方法が決まる。切替方法は、旧版を使い切ってから切り替える、旧版を処分して即日切り替える、指定した時期に切り替える、の3通りである。切替方法ごとに処理を作ると、新しい切替方法が出るたびに引当の修正とテストが要り、月4〜5件の変更に追い付かない。そのため、切替のルールの変化に、設定だけで対応できる設計が必要になった。<\/p>\n<p>私はシステム開発会社A社のシステムアーキテクトとして、本機能追加の要件定義から方式設計までを担当した。<\/p>", "i": "<h3>第2章 柔軟性をもたせた機能と設計<\/h3>\n<h4>2.1 柔軟性の対象にした業務ルール<\/h4>\n<p>私は、4M変更で変わる業務ルールを洗い出し、柔軟性の対象を次の2つにした。<\/p>\n<p>第一に、「どの版の在庫を、いつから、いつまで出庫してよいか」というルールである。これは4M変更のたびに、切替方法と時期によって変わる。<\/p>\n<p>第二に、「1つの品目は1つの置き場所に置く」というルールである。現行は同じ棚に新旧の版が混在していた。新旧の版を取り違えないためには、このルールを「1つの品目は版の数だけ置き場所を持つ」に変える必要がある。置き場所の数は、版が変わるたびに増減する。<\/p>\n<p>一方、4M変更では品目コードは変わらない。そのため、品目マスタの構造は柔軟性の対象にしなかった。<\/p>\n<h4>2.2 出庫の可否を判定する機能の設計<\/h4>\n<p>一つ目のルールに対して、出庫引当の機能を次のように設計した。ロケーションマスタに、適用開始日時と出庫停止日時の2つの項目を持たせる。出庫引当は、処理した日時に有効なロケーションだけを候補にする。<\/p>\n<p>3通りの切替方法は、プログラムの分岐ではなく日時の組合せで表せる。使い切ってから切り替える場合は、新版の適用開始日時だけを設定する。旧版の在庫がある間は、版の古い順で旧版が先に候補になるので、新版は旧版が尽きてから引き当たる。即日切り替える場合は、旧版の出庫停止日時を承認の時点にする。時期を指定する場合は、新版の適用開始日時と旧版の出庫停止日時を、その時期にそろえる。<\/p>\n<p>版の古さは版の番号で、同じ版の中は生産ロットの製造日で決める。版の分からない在庫は「版不明」として最も古く扱い、最優先で出す。ただし、即日停止の品目では、版不明の在庫に旧版が混じりうる。そこで、版不明のロケーションにも同じ出庫停止日時を設定し、現品を調べて版を確定してから解除する。<\/p>\n<p>日時は、変更申請機能で申請が承認された時点に自動で登録する。切替の当日に担当者がマスタを手作業で更新する必要がない。<\/p>\n<p>設計は3案を、新しい切替方法への対応の手間、表せる条件の範囲、テストの量で比べた。切替方法ごとに処理を分ける案は、どんな条件も表せるが、方法が増えるたびにプログラムの修正が要る。切替方法の種類をパラメタで持つ案は、種類ごとの分岐が引当に残り、種類が増えるとテストも増える。<\/p>\n<p>日時で表す案は、数量のような日時以外の条件を表せない。しかし、引当は日時を見るだけなので、方法が増えても処理は変わらない。申請画面で選ぶ切替方法は、2つの日時をどう決めるかを示す入力の型にすぎない。私は、対応の手間とテストの量を重く見て、この案を選んだ。<\/p>\n<h4>2.3 品目と置き場所の対応の設計<\/h4>\n<p>二つ目のルールに対しては、2案を比べた。品目マスタに版と置き場所の項目を持たせる案は、変更が小さい。しかし、新旧の版が並ぶ間、1つの品目に置き場所を2つ持てない。そこで、ロケーションマスタのキーを、品目コードから品目コードと版の組に変えた。1つの品目が、版ごとに複数のロケーションを持てる。<\/p>\n<p>版ごとに置き場所を分けると、棚が不足するおそれがある。そこで、旧版の在庫がなくなったロケーションは解除して、新版に再利用できるようにした。解除と再利用は、在庫管理担当者がマスタの画面から行う。解除の候補には、旧版の在庫も入庫の予定も無く、新版の適用開始日時を過ぎたロケーションだけを表示する。仕掛中の旧版が後から入る棚を、誤って解除しないためである。置き場所の増減のたびに、プログラムを直す必要はない。<\/p>", "u": "<h3>第3章 開発コストを抑えるための絞り込み<\/h3>\n<h4>3.1 柔軟にする範囲を、切替の時期と出庫の可否に絞った<\/h4>\n<p>出庫の順序そのものも、パラメタで変えられるようにする案があった。例えば、古い順ではなく、使用期限の近い順に出庫する、といった並べ方を選べるようにする案である。しかし、並べ方を選べるようにすると、引当の処理が複雑になる。並べ方を2種類にするだけで、引当のテストの組合せは倍になる。切替方法の3通りと版不明の有無の2通りに掛け合わさり、6通りが12通りになるからである。引当の改修とテストで、約2人月増えると見積もった。<\/p>\n<p>私は、過去3年分、約160件の4M変更の申請書を、在庫管理担当者と一緒に見直した。その結果、変更ごとに違っていたのは切替方法と時期、そして版ごとに増減する置き場所だけであった。出庫の順序は業務改善指針が先入れ先出しと定めており、指針を変えた記録も無い。環境目標が続く限り、変わる見込みは低い。そこで、出庫の順序は「版不明、版、生産ロットの古い順」に固定し、パラメタにしなかった。<\/p>\n<h4>3.2 持たせる項目を、2つの日時に絞った<\/h4>\n<p>切替の条件として、残数が一定以下になったら切り替える、といった数量の条件を持たせる案もあった。しかし、約160件の申請書に、数量で切り替えた例は1件も無かった。使い切ってから切り替える場合は、引当の順序だけで実現できる。そこで、条件として持たせる項目を、適用開始日時と出庫停止日時の2つに絞った。<\/p>\n<p>また、工場ごとに切替の時期をずらしたいという要望に備えて、工場別の日時を持たせる案もあった。しかし、ロケーションはもともと工場ごとに登録されている。ロケーションごとの日時を工場ごとに変えれば、項目を増やさずに同じことができる。そのため、工場別の項目は追加しなかった。<\/p>\n<h4>3.3 絞り込みが適切であると考えた理由<\/h4>\n<p>この絞り込みは、過去の実績と指針の方向という、B社の業務の事実に基づいている。柔軟性は、実際に変わってきた部分にだけ持たせ、変わってこなかった部分は単純に作った。過去に変わっていない部分に、約2人月を払う理由は無いと判断した。<\/p>\n<p>稼働後の半年で4M変更は約30件あったが、全て設定だけで対応でき、プログラムの修正は0件であった。この間に、新旧の版を1か月併用してから旧版を止めるという、3通りに無い切替方法も出た。これも、新版の適用開始日時と旧版の出庫停止日時を1か月ずらすだけで対応できた。<\/p>\n<p>一方、将来、使用期限のある部品を扱うことになれば、出庫の順序の見直しが必要になる。そのときに直す箇所を限るため、引当の並べ替えの処理は1か所にまとめてある。範囲は、その時点の実績を見て改めて判断する。<\/p>"}, {"id": "h30q1", "group": "骨子を読む", "label": "平成30 問1", "theme": "データを活用した情報の提供", "n": {"a": 640, "i": 1255, "u": 1106}, "q": "<h3>問1 業務からのニーズに応えるためのデータを活用した情報の提供について<\/h3><p>近年、顧客の行動記録に基づき受注可能性が高い顧客像を絞り込む、宣伝方法と効果の関係を可視化するなどの業務からのニーズに応えるために、データを活用して情報を提供する動きが加速している。<\/p><p>このような場合、システムアーキテクトは、業務からのニーズを分析した上で、どのような情報を提供するかを検討する必要がある。<\/p><p>例えば、スーパマーケットのチェーンで、“宣伝効果を最大にしたい”というニーズから、宣伝媒体をより効果的なものに絞り込むための情報の提供が必要であると分析した場合に、次のような検討をする。<\/p><p>・対象にしている顧客層に宣伝が届いている度合いを測定するための情報はどのようなものか<\/p><p>・宣伝の効果が表れるタイミングと期間を測定するための情報はどのようなものか<\/p><p>検討の結果から、“男女別／年齢層別の、来店者数のうち購入者数の占める割合が、特定の宣伝を実施した後の時間の経過に伴い、どのように推移したか”を情報として提供することにする。<\/p><p>また、このような情報の提供では、来店者数のデータがない、年齢層の入力がされていないケースがあるなどの課題があることも多い。そのため、発行したレシート数に一定の数値を乗じた値を来店者数とみなす、年齢層が未入力のデータは年齢層不明として分類するなど、課題に対応するための工夫をすることも重要である。<\/p><p>あなたの経験と考えに基づいて、設問ア〜ウに従って論述せよ。<\/p><div class=\"ask\"><b>設問ア<\/b>設問ア あなたが携わった、業務からのニーズに応えるためのデータを活用した情報の提供は、どのようなものであったか。ニーズのあった業務の概要及びニーズの内容、関連する情報システムの概要とともに、800字以内で述べよ。<\/div><div class=\"ask\"><b>設問イ<\/b>設問イ 設問アで述べた情報の提供では、ニーズをどのように分析し、どのような情報の提供を検討したか。800字以上1,600字以内で具体的に述べよ。<\/div><div class=\"ask\"><b>設問ウ<\/b>設問ウ 設問イで述べた検討で、情報の提供においてどのような課題があったか。また、その課題に対応するためにどのような工夫をしたか。600字以上1,200字以内で具体的に述べよ。<\/div>", "k": "<p class=\"lead\">先入れ先出しの稼働後に出た、「廃棄をもっと減らしたい」という要望を題材にします。平成28 問1で見送った「滞留在庫の一覧」の続きです。漠然とした要望を「誰がどの場面で何を判断するか」に分解するのが、この問題の芯です。<\/p><ul class=\"pts\"><li>設問ア:業務、ニーズ、関連するシステムの3つ。ニーズは要望した人の言葉を「」で入れると具体的になります。<\/li><li>設問イ:分析(廃棄の経路 → 判断の場面)と、場面ごとの情報。提供しなかった情報も書くと判断が伝わります。<\/li><li>設問ウ:問題文の例(みなし処理、不明として分類)をそのまま自分の事例に当てはめています。版不明は添付論文の材料です。<\/li><\/ul><h3>骨子<\/h3><ul class=\"ol\"><li class=\"ch\">第1章 データを活用した情報の提供の概要<\/li><li class=\"sub\">1.1 業務 → 在庫管理課の在庫管理と4M変更の切替<\/li><li class=\"sub\">1.2 システム → 2層、先入れ先出しを追加済み<\/li><li class=\"sub\">1.3 ニーズ → 「廃棄をもっと減らしたい」。承認画面に在庫数と出庫予定はあるが、使い切れるかは頭の中の計算。立場<\/li><li class=\"ch\">第2章 ニーズの分析と、提供した情報<\/li><li class=\"sub\">2.1 分析 → 前年度の廃棄の経路(取り残し約5割=先入れ先出しで減る/使い切り前約3割=残る/他は破損など)→ 対象は使い切り前の経路 → 判断の3つの場面(承認、月次の見直し、効果の確認)<\/li><li class=\"sub\">2.2 情報 → ①使い切り見込み(旧版+版不明の在庫÷1日の出庫見込み)と廃棄の見込み金額 ②版別の滞留の一覧(月次)③見込み金額の推移と期末棚卸の実績。全品目のグラフは提供しない<\/li><li class=\"ch\">第3章 情報の提供における課題と工夫<\/li><li class=\"sub\">3.1 版不明 → 区分を設けて別に表示(除くと滞留の長い在庫ほど消える)<\/li><li class=\"sub\">3.2 棚入れ日がない → 現品票の発行日でみなす(差はほとんど3日以内)、印を付ける<\/li><li class=\"sub\">3.3 出庫の見込みがない → 過去3か月の実績でみなす、無ければ「算出不可」<\/li><li class=\"sub\">3.4 単価が別システム → 月次の締め後に受け取る<\/li><li class=\"sub\">3.5 評価 → 切替時期を見直す申請が月1〜2件。廃棄金額は前年度の約3割減(約6割は先入れ先出し、約3割が情報の提供の効果)。残課題(みなしを減らす)<\/li><\/ul>", "a": "<h3>第1章 データを活用した情報の提供の概要<\/h3>\n<h4>1.1 ニーズのあった業務の概要<\/h4>\n<p>B社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。ニーズのあった業務は、在庫管理課が行う在庫の管理と、部品の作り方を変える4M変更の切替の管理である。4M変更は月平均4〜5件あり、変更ごとに旧版から新版への切替方法と時期を決める。<\/p>\n<h4>1.2 関連する情報システムの概要<\/h4>\n<p>関連する情報システムは、B社の生産・在庫管理システムである。PCのクライアントとデータベースサーバの2層構成で、倉庫ではハンディ端末で現品票のQRコードを読み取り、入出庫を記録する。B社では旧版の部品の滞留と廃棄が問題になっており、このシステムに先入れ先出しの機能を追加し、版と生産ロットごとに在庫を持つようにした。<\/p>\n<h4>1.3 ニーズの内容<\/h4>\n<p>先入れ先出しの機能を使い始めた後、在庫管理課長から「廃棄をもっと減らしたい。そのための情報が欲しい」という要望が出た。先入れ先出しで古い在庫から使うようにはなったが、4M変更の時点で旧版が多く残っていると、使い切る前に切替時期が来て、結局廃棄になる場合があったからである。申請の承認画面には、旧版の在庫数と出庫予定を表示していた。しかし、使い切れるかどうかは担当者が頭の中で計算しており、判断がぶれていた。<\/p>\n<p>そこで、承認画面での旧版の使い切り見込み、月次の版別の滞留の一覧、工場別の廃棄見込み金額の推移の3つの情報を提供した。<\/p>\n<p>私はシステム開発会社A社のシステムアーキテクトとして、このニーズの分析と、提供する情報の検討を担当した。<\/p>", "i": "<h3>第2章 ニーズの分析と、提供した情報<\/h3>\n<h4>2.1 ニーズの分析<\/h4>\n<p>「廃棄を減らしたい」という要望は漠然としていた。そこで私は、誰が、どの場面で、何を判断するために情報を使うのかを、在庫管理課長と担当者に聞き取った。課長は当初、全品目の在庫の一覧を求めていた。しかし聞き取りを進めると、課長が本当に知りたいのは、どの品目の旧版が廃棄になりそうかであった。<\/p>\n<p>まず、前年度の期末棚卸の廃棄記録のうち理由欄が「旧版」のものを、紙の4M変更申請書の切替時期と突き合わせ、廃棄に至った経路を整理した。廃棄金額の約5割は、新しい版から先に出庫して、棚の奥に旧版が取り残されたものであった。この経路は先入れ先出しで減る。約3割は、出庫の少ない品目で、旧版を使い切る前に切替の時期が来たものであった。この経路は、古い順に出庫しても残る。残りは破損などである。<\/p>\n<p>そこで私は、情報の提供で減らす対象を、使い切る前に切替時期が来る経路と定めた。この経路から、情報を使う場面は3つあると分かった。第一に、4M変更の申請を承認する場面である。在庫管理担当者が、切替方法と時期が妥当かを判断する。第二に、月に一度、滞留しそうな在庫を見直す場面である。在庫管理課長が、発注を減らす品目や、他の工場に回す品目を判断する。第三に、課長が、対策を続けるか見直すかを判断するために、効果を確かめる場面である。<\/p>\n<h4>2.2 提供を検討した情報<\/h4>\n<p>第一の場面に対しては、申請の承認画面に「旧版の使い切り見込み」を表示することにした。まず、旧版の在庫数に、先に出庫される版不明の在庫数を足す。次に、その品目の1日当たりの出庫の見込みで割る。これで使い切るまでの日数が分かる。出庫の見込みは生産計画の所要量から求め、毎晩更新する。所要量の無い品目の扱いは3.3で述べる。<\/p>\n<p>これを切替時期と並べて示せば、切替時期までに旧版を使い切れるかを、承認の前に判断できる。使い切れない場合は、申請者に切替時期の見直しを依頼できる。あわせて、使い切れずに残る数量に単価を掛けた金額を、「廃棄の見込み金額」として表示する。旧版を即日止める申請では、その時点で残る旧版の全てが廃棄の見込みになる。<\/p>\n<p>第二の場面に対しては、「版別の滞留の一覧」を月次で提供することにした。品目と版ごとに、棚に入れてからの日数と、使い切り見込みの日数を並べる。使い切り見込みが長い順に並べ、上位の品目から対策を考えられるようにした。月次にしたのは、発注の見直しが月に一度の会議で行われるからである。<\/p>\n<p>第三の場面に対しては、廃棄の見込み金額の合計の推移を工場別に示すことにした。課長が、先入れ先出しと切替時期の見直しの効果を、月ごとに確かめられる。ただし、見込みは計算の結果であり、実際の廃棄とは限らない。そこで、期末棚卸で確定した実際の廃棄金額も並べ、見込みと実績の差を確かめられるようにした。<\/p>\n<p>一方、全品目の在庫の推移をグラフで見たいという要望もあった。しかし、判断の場面に結び付かない情報は、見るだけで使われないと考えた。そこで、3つの場面で使う3つの情報に絞った。<\/p>", "u": "<h3>第3章 情報の提供における課題と工夫<\/h3>\n<h4>3.1 版の分からない在庫がある<\/h4>\n<p>版の運用を始める前の在庫には、版の情報が無いものがあった。古い在庫ほど版の情報が無く、これらを除いて集計すると、滞留の長い在庫ほど一覧から消えてしまう。そこで、版の分からない在庫は「版不明」という区分で集計し、一覧の中で別に表示した。版不明の在庫は先に使い切る方針なので、その減り方も月ごとに確かめられるようにした。<\/p>\n<h4>3.2 棚に入れた日が分からない在庫がある<\/h4>\n<p>入出庫の履歴は一定の期間しか残していないため、古い在庫の中には、棚に入れた日の記録が無いものがあった。そこで、現品票の発行日を棚に入れた日とみなして計算した。生産ロットの製造日は内製品にしか無く、購入品と同じ基準で比べられないので使わなかった。記録の残る直近の在庫で確かめると、発行日と棚に入れた日の差は、ほとんどが3日以内であった。滞留は月の単位で比べるので、十分な精度だと判断した。<\/p>\n<p>移行で現品票を貼り替えた在庫は、貼り替えの際に元の現品票の発行日を引き継いである。ただし、古い在庫でも差が3日以内とは限らない。そこで、みなした値で計算した行には印を付け、課長が区別できるようにした。<\/p>\n<h4>3.3 出庫の見込みが無い品目がある<\/h4>\n<p>使い切り見込みの計算には、出庫の見込みが必要である。しかし、補修用の部品などは生産計画に載らず、見込みの数が無かった。そこで、過去3か月の出庫の実績の平均を、見込みとみなして使うことにした。実績も無い品目は、使い切り見込みを「算出不可」と表示し、担当者が個別に判断するようにした。誤った見込みを出すより、出せないことを示す方が判断を誤らせないと考えた。<\/p>\n<h4>3.4 金額のデータが別のシステムにある<\/h4>\n<p>廃棄の見込み金額に必要な部品の単価は、会計システムにある。生産・在庫管理システムからは直接参照できない。そこで、月次の締めの後に会計システムから単価を受け取り、集計に使うことにした。月の途中の単価の変更は反映されないが、月次で推移を見る目的には足りる。<\/p>\n<h4>3.5 評価と今後の課題<\/h4>\n<p>承認の場面では、使い切れない見込みを見て切替時期を見直す申請が、月に1〜2件出るようになった。月次の見直しの場面では、課長が滞留の上位の品目の発注を減らし、他の工場に回すようになった。その結果、次の期末棚卸では、4M変更に伴う旧版部品の廃棄金額が、前年度より約3割減った。減った分の約6割は、棚の奥に取り残される経路で、先入れ先出しの効果である。約3割が、使い切る前に切替時期が来る経路で、情報の提供の効果と判断した。<\/p>\n<p>一方、みなした値の多い品目では、見込みと実績の差が大きかった。今後は、棚に入れた日を確実に記録し、みなしを減らしていきたい。<\/p>"}, {"id": "r1q1", "group": "骨子を読む", "label": "令和元 問1", "theme": "ユーザビリティを重視したUIの設計", "n": {"a": 601, "i": 1177, "u": 940}, "q": "<h3>問1 ユーザビリティを重視したユーザインタフェースの設計について<\/h3><p>近年、情報システムとの接点としてスマートフォンやタブレットなど多様なデバイスが使われてきており、様々な特性の利用者が情報システムを利用するようになった。それに伴い、ユーザビリティの善しあしが企業の競争優位を左右する要素として注目されている。ユーザビリティとは、特定の目的を達成するために特定の利用者が特定の利用状況下で情報システムの機能を用いる際の、有効性、効率、及び満足度の度合いのことである。<\/p><p>優れたユーザビリティを実現するためには、利用者がストレスを感じないユーザインタフェース（以下、UIという）を設計することが重要である。例えば、次のように、利用者の特性及び利用シーンを想定して、重視するユーザビリティを明確にした上で設計することが望ましい。<\/p><p>・操作に慣れていない利用者のために、操作の全体の流れが分かるようにナビゲーション機能を用意することで、有効性を高める。<\/p><p>・操作に精通した利用者のために、利用頻度の高い機能にショートカットを用意することで、効率を高める。<\/p><p>また、ユーザビリティを高めるために、UIを設計する際には、想定した利用者に近い特性を持った協力者に操作を体感してもらい、仮説検証を繰り返しながら改良する、といった設計プロセスの工夫も必要である。<\/p><p>あなたの経験と考えに基づいて、設問ア〜ウに従って論述せよ。<\/p><div class=\"ask\"><b>設問ア<\/b>設問ア あなたがUIの設計に携わった情報システムについて、対象業務と提供する機能の概要、想定した利用者の特性及び利用シーンを、800字以内で述べよ。<\/div><div class=\"ask\"><b>設問イ<\/b>設問イ 設問アで述べた利用者の特性及び利用シーンから、どのようなユーザビリティを重視して、どのようなUIを設計したか。800字以上1,600字以内で具体的に述べよ。<\/div><div class=\"ask\"><b>設問ウ<\/b>設問ウ 設問イで述べたUIの設計において、ユーザビリティを高めるために、設計プロセスにおいて、どのような工夫をしたか。600字以上1,200字以内で具体的に述べよ。<\/div>", "k": "<p class=\"lead\">この問題の主役は、倉庫作業者が使うハンディ端末の画面です。添付論文3.3の「警告と古い在庫の場所の表示、理由の選択」を、UIの話として膨らませます。<\/p><ul class=\"pts\"><li>設問ア:利用者の特性(手袋、立ち作業、ベテランと応援者)と利用シーン(急ぎ、暗い棚、騒音)を、イのUIにつながるように具体的に書きます。<\/li><li>設問イ:問題文の定義(有効性・効率・満足度)のどれを重視したかを先に宣言し、UIごとに「アのどの特性・シーンからそうしたか」を書きます。<\/li><li>設問ウ:UIの内容ではなく、設計の「進め方」の工夫です。誰に、どこで、何回試して、何が分かり、どう直したかを書きます。<\/li><\/ul><h3>骨子<\/h3><ul class=\"ol\"><li class=\"ch\">第1章 対象業務と提供する機能、利用者の特性と利用シーン<\/li><li class=\"sub\">1.1 業務と機能 → 倉庫の出庫。古い在庫があれば知らせる機能。立場<\/li><li class=\"sub\">1.2 特性 → 手袋・立ち作業・片手。ベテランと応援者<\/li><li class=\"sub\">1.3 シーン → ラインが待つ。暗い棚、フォークリフトの音<\/li><li class=\"ch\">第2章 重視したユーザビリティと設計したUI<\/li><li class=\"sub\">2.1 有効性を最重視、次に効率。満足度は「現行と同じ読取り2回のまま」<\/li><li class=\"sub\">2.2 有効性 → ①色・文字・振動 ②古い在庫の場所を同じ画面に ③警告は古い在庫があるときだけ<\/li><li class=\"sub\">2.3 効率 → 通常は読取りとトリガーキーだけ(数量は入数が初期値)。例外だけ数字キーで3つの理由(止めた旧版は不可)。応援者に次の手順を1行。ベテランは連続出庫で棚の読取りを省略(毎回読ませる案と比較)<\/li><li class=\"ch\">第3章 設計プロセスでの工夫<\/li><li class=\"sub\">3.1 実際の倉庫で、協力者4名(ベテラン2、配属1か月以内2)に操作してもらう<\/li><li class=\"sub\">3.2 条件の悪い棚で観察・記録 → 1回目:色と音の仮説が崩れる→文字と振動 / 2回目:選択肢6つで手が止まる→3つに<\/li><li class=\"sub\">3.3 合格基準を先に決める(有効性・効率・満足度)→ 3回繰り返す。手止まり9回→0回。稼働後の理由の記録。残課題(他工場で未評価)<\/li><\/ul>", "a": "<h3>第1章 対象業務と提供する機能、利用者の特性と利用シーン<\/h3>\n<h4>1.1 対象業務と提供する機能の概要<\/h4>\n<p>B社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。対象の業務は、3工場の倉庫での部品の出庫業務である。B社では4M変更で旧版の部品が棚に滞留し、廃棄の原因になっていたため、出庫を先入れ先出しに統一することになった。<\/p>\n<p>対象の情報システムは、B社の生産・在庫管理システムである。PCのクライアントとデータベースサーバの2層構成で、倉庫ではハンディ端末でロケーションと現品票のQRコードを読み取り、入出庫を記録する。今回、出庫時に版と生産ロットの順序を判定し、読み取った現品票より古い在庫があれば知らせる機能を追加した。私はシステム開発会社A社のシステムアーキテクトとして、この機能の要件定義からUIの設計までを担当した。<\/p>\n<h4>1.2 想定した利用者の特性<\/h4>\n<p>利用者は倉庫作業者である。作業者は手袋をして立ったまま作業し、片手にハンディ端末、もう片方の手で部品を扱う。作業者には、長年同じ倉庫で働くベテランと、繁忙期に他の職場から来る応援者がいる。応援者は、棚の配置にも端末の操作にも慣れていない。<\/p>\n<h4>1.3 想定した利用シーン<\/h4>\n<p>出庫は、生産ラインが部品を待っている状態で行われることが多く、作業者は急いでいる。倉庫には照明の届きにくい棚があり、フォークリフトの音で周りが騒がしい。作業者は出庫指示に示された棚の前で、端末を見ながら、どの現品を取るかをその場で判断する。<\/p>", "i": "<h3>第2章 重視したユーザビリティと設計したUI<\/h3>\n<h4>2.1 重視したユーザビリティ<\/h4>\n<p>私は、有効性を最も重視した。この機能の目的は、作業者が古い版の在庫から確実に出庫することである。誤った版を出庫すると、旧版が滞留して廃棄につながり、切替方法に違反すれば品質問題にもなる。次に、効率を重視した。生産ラインが部品を待っているので、作業を止めてはならない。満足度については、作業者が順序を守ることを負担と感じないことを目標とした。古い在庫が無いときの操作を、現行と同じ棚と現品票の読取り2回のままにしたのは、この目標のためである。<\/p>\n<h4>2.2 有効性を高めるUI<\/h4>\n<p>次に述べるUIは、3章で述べる試作と観察を経て、最終的に決めたものである。<\/p>\n<p>第一に、判定の結果を、色と文字と振動で伝えることにした。古い在庫が無ければ緑の画面と短い音で知らせ、作業者はそのまま次へ進める。古い在庫がある場合は、黄色の画面に「古い在庫あり」と大きな文字で表示し、端末を振動させる。騒がしい倉庫では音が聞こえず、暗い棚の前では色だけでは見分けにくいことが、試作で分かったからである。<\/p>\n<p>第二に、古い在庫のロケーションを、警告と同じ画面に大きく表示した。作業者が警告を見ても、古い在庫の場所を知らなければ順序は守れない。特に応援者は棚の配置を知らないので、場所を示すことが欠かせないと考えた。<\/p>\n<p>第三に、警告は古い在庫がある場合だけに出すことにした。全ての出庫で確認を求めると、作業者は警告に慣れて読まずに進めるようになる。警告の意味を保つには、本当に必要な場面に絞ることが大切だと考えた。<\/p>\n<h4>2.3 効率を高めるUI<\/h4>\n<p>手袋をしたままでは、画面のキーで文字を入力するのは難しい。そこで、通常の出庫は読取りと、端末側面のトリガーキーだけで完結するようにした。数量は現品票の入数を初期値とし、端数のときだけ数字キーで直す。<\/p>\n<p>古い在庫が奥にあって取り出せないなど、やむを得ない場合もある。このときだけ、画面に番号付きで表示した「奥にあり取り出せない」「荷役の機器が必要」「現品に不良がある」の3つの理由から、数字キー1つで選んで出庫できる。ただし、出庫を止めた旧版は、理由を選んでも出庫できない。品質に関わる切替を、現場の判断で破らせないためである。<\/p>\n<p>応援者向けには、画面の上部に「棚を読む」「現品票を読む」といった次の手順を1行で表示した。<\/p>\n<p>一方、ベテランは同じ棚から続けて出庫することが多い。そこで、端末が直前に読んだ棚を覚えておき、続けて出庫するときは棚の読取りを省略できるようにした。毎回読ませる案とも比べた。省略すると、別の棚の同じ品目を取る誤りを、棚の読取りでは検知できない。しかし、品目と版は現品票で確認でき、古い在庫を飛ばせば警告が出る。有効性は損なわないと判断し、連続する出庫に限って省略とした。読み取った現品票の置き場所が直前の棚と違うときは、必ず棚を読ませる。<\/p>", "u": "<h3>第3章 設計プロセスでの工夫<\/h3>\n<h4>3.1 実際の倉庫で、想定した利用者に操作してもらった<\/h4>\n<p>UIの設計では、会議室で画面の案を見せるだけでは足りないと考えた。手袋、騒音、暗い棚といった条件は、倉庫でなければ再現できないからである。そこで、試作した画面を実際のハンディ端末に入れ、本社工場の倉庫で作業者に操作してもらった。協力者は4名で、ベテラン2名と、別の職場から配属されて1か月以内の作業者2名である。後の2名は、応援者に近い特性を持つ人として選んだ。<\/p>\n<h4>3.2 条件の悪い場所で観察し、迷った場面を記録した<\/h4>\n<p>私は、作業者に操作の感想を聞くだけでなく、作業者の後ろから操作の様子を観察した。どこで手が止まったか、どこで画面を見直したかを記録した。試す場所には、照明の届きにくい棚と、フォークリフトの通路沿いの棚を選んだ。利用シーンのうち最も条件の悪い場所で、仮説が崩れないかを見るためである。<\/p>\n<p>1回目は、「色と音で結果を伝えれば迷わない」という仮説を試した。しかし、暗い棚では黄色と緑を見分けられず、フォークリフトが通ると警告音に気付かない場面を記録した。そこで、文字と振動を加える案に改めた。<\/p>\n<p>2回目は、「理由を選べれば例外でも手が止まらない」という仮説を試した。しかし、理由の選択肢を6つ並べたため、選ぶ場面で手が止まった。聞き取りでは、実際に起きる場面は3つに偏っていた。そこで、選択肢を3つに絞った。<\/p>\n<h4>3.3 合格の基準を決めて、仮説と検証を繰り返した<\/h4>\n<p>試作は3回繰り返した。合格の基準は、重視したユーザビリティに合わせて先に決めた。有効性は、説明を受けずに出庫を最後まで終え、途中で手が止まる場面が無いこと。効率は、1件の出庫に掛かる時間が従来の手順と変わらないこと。満足度は、順序を守る操作を負担と答える人がいないことである。<\/p>\n<p>手が止まった回数は、1回目は4名の合計で9回だったが、3回目には0回になった。時間も従来と変わらず、負担と答えた人もいなかった。応援者に近い2名も基準を満たした。<\/p>\n<p>稼働後は、作業者が選んだ理由の記録を在庫管理担当者と確認している。理由の多くは古い在庫が奥にある場合で、操作の迷いによるものは少なかった。一方、第2・第3工場では試作の評価を行っていない。今後は、棚の形が違う工場でも同じ観察を行いたい。<\/p>"}, {"id": "r4q2", "group": "骨子を読む", "label": "令和4 問2", "theme": "業務のデジタル化", "n": {"a": 591, "i": 1481, "u": 1074}, "q": "<h3>問2 業務のデジタル化について<\/h3><p>近年，紙媒体の管理コストの削減及び業務の効率化を目的とした，情報システムを活用したデジタル化が加速している。デジタル化の実現によって，情報が検索しやすくなったり，モノの動きがリアルタイムに把握できたりすることで業務改善が図れる。<\/p><p>システムアーキテクトは，現行の業務において改善の余地がある業務プロセスを見極めてデジタル化することが求められる。一方，現行の業務をデジタル化した場合に生じる課題を想定し，対応策を検討しておくことも必要である。例えば，りん議業務をリモートワーク環境でも実施できるようにするために，ワークフローシステムを用いて業務をデジタル化する場合，次のように検討する。<\/p><p>・従来の印鑑の代替とするために，承認欄にログインユーザの氏名，所属，職位及びタイムスタンプを記録するようにする。<\/p><p>・決裁ルートに長期の不在者がいた場合でも，緊急で決裁が必要な案件を円滑に処理するために，代理決裁者を設ける仕組みにする。<\/p><p>・情報漏えいや決裁者のなりすましなどのセキュリティリスクに対処するために，アクセス権限管理の強化やログの監視ができるようにする。<\/p><p>また，紙媒体などで運用していた業務をデジタル化すると，業務手順が従来と変わるので，利用者が新しい業務に習熟するまでに時間が掛かることがある。そこで，例えばどの業務で作成されたか判別できるように業務の頭文字で電子文書をアイコン化する，情報システムへのガイド機能を組み込むなど，利用支援の仕組みを工夫する。<\/p><p>あなたの経験と考えに基づいて，設問ア～ウに従って論述せよ。<\/p><div class=\"ask\"><b>設問ア<\/b>設問ア　あなたが携わった業務のデジタル化について，対象業務，情報システムの概要，デジタル化を通じて実現を期待した業務改善の内容を，800字以内で述べよ。<\/div><div class=\"ask\"><b>設問イ<\/b>設問イ　設問アで述べた業務改善を実現するために，どのような業務プロセスを，どのようにデジタル化することを検討したか。また，どのような課題があり，どのような対応策を検討したか。800字以上1,600字以内で具体的に述べよ。<\/div><div class=\"ask\"><b>設問ウ<\/b>設問ウ　設問イで検討した内容について，利用者がデジタル化した業務に習熟できるよう，どのように工夫したか。情報システムに組み込んだ利用支援の仕組みを含めて，600字以上1,200字以内で具体的に述べよ。<\/div>", "k": "<p class=\"lead\">この問題の主役は「紙の4M変更申請」をどうデジタル化したかです。先入れ先出しの話は背景に下がります。添付論文の「紙の4M変更申請を電子化する変更申請機能」を主役に引き上げると考えます。<\/p><ul class=\"pts\"><li>設問ア:対象業務は「4M変更の申請から出庫まで」。紙で何が起きていたかを書き、期待した改善を3つにします。<\/li><li>設問イ:「どのプロセスを」には、デジタル化しなかった部分(承認の判断)も書くと、見極めたことが伝わります。範囲は2案で比べます。課題は「デジタル化したせいで新たに起きること」を書き、問題文の例にある押印の代わりとなりすまし対策を必ず入れます。<\/li><li>設問ウ:利用者ごと(申請者、在庫管理担当者、倉庫作業者)に工夫を分けます。「情報システムに組み込んだ」仕組みを必ず含めます。<\/li><\/ul><h3>骨子<\/h3><ul class=\"ol\"><li class=\"ch\">第1章 対象業務、情報システムの概要、期待した業務改善<\/li><li class=\"sub\">1.1 業務 → 4M変更の申請〜出庫。紙、回覧に2〜3日、当日の手作業→更新漏れ・滞留<\/li><li class=\"sub\">1.2 システム → 共通の文<\/li><li class=\"sub\">1.3 改善 → ①切替を守る ②検索できる ③手作業を無くす。立場<\/li><li class=\"ch\">第2章 デジタル化した業務プロセスと、課題への対応策<\/li><li class=\"sub\">2.1 見極め → 誤りと遅れは回覧と当日の更新の2か所。承認の判断は人に残す。案A承認まで電子化/案B反映まで自動 → B(弱点は2.3)<\/li><li class=\"sub\">2.2 内容 → 変更申請機能。担当者が影響を確かめ新版の棚を指定 → 承認で2つの日時を自動登録。検索できる一覧。QRに版とロット<\/li><li class=\"sub\">2.3 課題 → ①入力の誤り→承認前の影響確認(絞る案と比べ全件、1件10分・月1時間未満) ②承認後の誤り→取消を起票し同じ経路で戻す。誤った出庫停止だけは品質保証部の管理者1名で即時 ③承認の遅れ→代理承認者に同時通知 ④承認の確かさ→氏名と日時の記録、自己承認の禁止<\/li><li class=\"ch\">第3章 利用者が習熟するための工夫<\/li><li class=\"sub\">3.1 申請者 → 選んだ結果を1行の文で表示(稼働時から)。差戻し3件 → 図のガイドを追加 → 0件<\/li><li class=\"sub\">3.2 状況一覧 →「次に誰が何をするか」を表示、切替が近い未承認は色分け<\/li><li class=\"sub\">3.3 倉庫作業者 → 端末上部に次の手順を1行、警告の理由と場所を文字で<\/li><li class=\"sub\">3.4 稼働直後 → 質問と回答の一覧を申請画面から。結果(アの3つの改善を実現)と残課題(担当者不在で申請が止まる)<\/li><\/ul>", "a": "<h3>第1章 対象業務、情報システムの概要、期待した業務改善<\/h3>\n<h4>1.1 対象業務<\/h4>\n<p>B社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。対象の業務は、部品の作り方を変える4M変更の申請と承認、それを受けた在庫の切替、倉庫での出庫までの一連の業務である。4M変更は月平均4〜5件発生し、変更ごとに旧版から新版への切替方法と時期が決まる。<\/p>\n<p>従来、4M変更は紙の申請書で管理していた。承認された申請書は回覧で2〜3日掛けて在庫管理担当者に届き、担当者が切替の当日に在庫のマスタを手作業で更新していた。そのため、更新漏れや時刻のずれで旧版が出庫されたり、旧版が棚に滞留して廃棄されたりしていた。<\/p>\n<h4>1.2 情報システムの概要<\/h4>\n<p>対象の情報システムは、B社の生産・在庫管理システムである。PCのクライアントとデータベースサーバの2層構成で、サーバは本社工場に置き、第2・第3工場からは専用線で利用する。倉庫ではハンディ端末でロケーションと現品票のQRコードを読み取り、入出庫を記録する。<\/p>\n<h4>1.3 実現を期待した業務改善<\/h4>\n<p>期待した業務改善は3つである。第一に、切替方法と時期を確実に守り、旧版の誤った出庫を無くすこと。第二に、どの品目がいつ切り替わるかを、関係者が誰でも検索できるようにすること。第三に、切替当日のマスタ更新の手作業を無くすことである。<\/p>\n<p>私はシステム開発会社A社のシステムアーキテクトとして、このデジタル化の要件定義から方式設計までを担当した。<\/p>", "i": "<h3>第2章 デジタル化した業務プロセスと、課題への対応策<\/h3>\n<h4>2.1 デジタル化する業務プロセスの見極め<\/h4>\n<p>私はまず、申請から出庫までの業務の流れを、申請部門、在庫管理担当者、倉庫作業者に聞き取って整理した。その結果、誤りと遅れが生まれていたのは2か所だった。一つは、承認された申請書が回覧で届くまでの間である。もう一つは、切替当日に担当者がマスタを手で更新する作業である。一方、申請の内容を技術的に判断する承認は、人が判断すべきものである。そこで、承認の判断は人に残し、その記録だけを画面で行うことにした。<\/p>\n<p>デジタル化の範囲は2案を比べた。案Aは、承認までを電子化し、マスタへの反映は従来どおり在庫管理担当者が行う案である。変更は小さいが、誤りの元である当日の手作業が残る。案Bは、承認から切替の反映までを自動でつなぐ案である。私は、誤りと遅れの元を断つため案Bを選んだ。ただし案Bには、申請の誤りがそのまま切替に反映されるという弱点がある。これは2.3で対策した。<\/p>\n<h4>2.2 デジタル化の内容<\/h4>\n<p>紙の申請書の代わりに、変更申請機能を追加した。申請者は、品目、新しい版、切替方法、切替時期を画面で入力する。切替方法は、使い切ってから切り替える、即日切り替える、指定した時期に切り替える、の3つから選ぶ。<\/p>\n<p>在庫管理担当者は、承認の前に在庫への影響を確かめ、新版を置く棚を指定する。申請が承認されると、新版のロケーションが適用開始日時付きで登録され、旧版のロケーションには切替方法に応じた出庫停止日時が設定される。出庫引当は、その日時に有効なロケーションだけを候補にする。こうして、承認の後は切替までを人手を介さずにつないだ。<\/p>\n<p>申請の一覧は品目や切替日で検索でき、関係者がいつ何が切り替わるかを自分で確かめられる。あわせて、現品票のQRコードに版と生産ロットを加え、出庫時に版を記録できるようにした。<\/p>\n<h4>2.3 課題と対応策<\/h4>\n<p>第一の課題は、申請の入力の誤りである。紙のときは在庫管理担当者が受け取った時点で気付けたが、デジタル化すると誤った日時がそのまま切替に使われる。例えば即日切替を誤って選ぶと、使える旧版の在庫まで出庫が止まる。そこで、承認の前に、在庫管理担当者が在庫への影響を確認する手順を加えた。画面には、切替時点で残る旧版の在庫数と、それまでの出庫予定を表示する。旧版が大量に残る場合は、申請者に見直しを依頼する。<\/p>\n<p>確認は、旧版の残りが多い申請だけに絞る案もあった。しかし、4M変更は月平均4〜5件で、確認は1件10分ほどと見積もった。負担は月に1時間に満たない。見逃しを防ぐことを優先し、当面は全件を確認することにした。<\/p>\n<p>第二の課題は、承認後に誤りが分かった場合である。承認と同時に日時が登録されるので、紙のように申請書を差し替えるだけでは戻らない。そこで、変更申請機能で取消を起票し、同じ承認経路で承認されると、登録した日時を元に戻すことにした。マスタを直接直す道は作らず、取消も記録に残す。ただし、誤った出庫停止は、取消を待つ間ラインに部品を出せない。この取消に限り、品質保証部の管理者1名の承認で即時に反映し、事後に回覧する。<\/p>\n<p>第三の課題は、承認の遅れである。即日切替の申請は、承認が遅れた分だけ旧版が出庫され続ける。そこで、承認者ごとに代理承認者を登録し、即日切替の申請は代理承認者にも同時に通知する。通知は社内のメールで送る。<\/p>\n<p>第四の課題は、承認の確かさである。承認がそのまま出庫停止になるので、なりすましや自己承認を防ぐ必要がある。そこで、押印の代わりにログインした承認者の氏名と日時を記録し、申請者が自分の申請を承認できないようにした。<\/p>", "u": "<h3>第3章 利用者が習熟するための工夫<\/h3>\n<h4>3.1 申請者が切替方法を選び間違えない画面<\/h4>\n<p>申請者にとって、3つの切替方法の違いは文字の選択肢だけでは分かりにくい。そこで、申請画面で切替方法と時期を選ぶと、その下に「旧版は○月○日まで出庫可、新版は同日から出庫」のように、結果を1行で表示する仕組みを組み込んだ。申請者は、選んだ方法で在庫がどう動くかを確かめてから申請できる。この表示は稼働時から提供した。<\/p>\n<p>稼働後の3か月で、切替方法の選び間違いによる差戻しが3件あった。いずれも、使い切りと時期指定の取り違えであった。文の表示だけでは、新旧の版が重なる期間が伝わりにくいと分かった。そこで、旧版と新版の出庫できる期間を、時間の流れに沿った図で表示するガイド機能を追加した。追加の後は、差戻しは0件が続いている。<\/p>\n<h4>3.2 申請の状況を自分で確かめられる一覧<\/h4>\n<p>紙のときは、申請書がどこにあるかを電話で確かめていた。そこで、申請の状況を一覧で見られる画面を用意した。一覧には、申請ごとに「次に誰が何をするか」を表示した。申請者は、新しい承認の流れを覚えていなくても、自分の申請がどこで止まっているかが分かる。在庫管理担当者は、切替が近い品目を日付順に確認できる。切替日が近いのに承認されていない申請は、色を変えて表示した。<\/p>\n<h4>3.3 倉庫作業者が新しい手順に慣れるための表示<\/h4>\n<p>倉庫作業者は、申請の画面を使わない。作業者にとっての変化は、版ごとに分かれた棚から、古い順に出庫する手順である。そこで、ハンディ端末の画面の上部に、「棚を読む」「現品票を読む」といった次の手順を1行で表示した。古い在庫がある場合は、警告の理由とそのロケーションを文字で表示する。作業者は、手順書を見なくても、端末の表示に従えば新しい手順で出庫できる。<\/p>\n<h4>3.4 稼働直後の支援<\/h4>\n<p>稼働から最初の1か月は、在庫管理担当者が申請者からの質問を受け、誤りやすい箇所を記録した。よくある誤りは質問と回答の一覧にまとめ、申請画面から開けるようにした。利用者は、迷ったときに担当者に聞かずに確かめられる。一覧は毎週見直し、新しく出た質問を加えていった。<\/p>\n<p>これらの工夫の結果、稼働後の半年間、旧版の誤った出庫は起きていない。回覧に2〜3日掛かっていた承認の結果は、承認と同時に在庫へ反映され、切替当日のマスタの手更新は無くなった。切替の予定は誰でも一覧で検索できている。期待した3つの業務改善は実現できた。<\/p>\n<p>一方、承認の前の影響確認は、負担は見積りどおり月に1時間ほどだが、担当者が不在の日は申請が止まる。今後は、旧版の残りが少ない申請は確認を省略できる基準を決めたい。<\/p>"}, {"id": "r7q1", "group": "骨子を読む", "label": "令和7 問1", "theme": "複数の情報システムのデータを収集する指標の提供", "n": {"a": 558, "i": 1240, "u": 1127}, "q": "<h3>問1 複数の情報システムのデータを収集する必要がある指標の提供について<\/h3><p>近年，業務改善や収益向上などの業務目標達成のために，複数の情報システムのデータを活用した指標の提供を求められることが多い。例えば次のようなものがある。<\/p><p>・製造業で，製品品質の改善状況を可視化するために，生産管理システムの製品製造時のデータと保守システムの製品出荷後の故障データを活用し，製品の故障率などの品質状況を指標として設計部門に提供する。<\/p><p>・流通業で，売上拡大のために，物販システムの高額商品の販売履歴と旅行販売システムのクルーズパッケージ販売履歴を活用し，クロスセルの販売確率を指標として営業部門に提供する。<\/p><p>このような場合，システムアーキテクトは，業務目標と求められた指標の関係を理解した上で，指標の算出に必要なデータなどを分析し，データを収集し指標を提供する機能を設計する。設計に当たっては，例えば次のような事項を検討する。<\/p><p>・指標を算出する手順<\/p><p>・収集元データのコード体系や単位などの，データ定義の差を吸収する方法<\/p><p>また，このような指標の提供では，データの欠落が多いので利用に向いていなかったり，算出に必要なデータが企業内に存在していなかったりするといった，データの内容の問題が発生することも多い。そのため，必要なデータを社外から取得する，新たなデータ取得の仕組みを構築する，企業内の何らかのデータからみなし処理をするなどの工夫をすることも重要である。<\/p><p>あなたの経験と考えに基づいて，設問ア～ウに従って論述せよ。<\/p><div class=\"ask\"><b>設問ア<\/b>設問ア　あなたは，どのような業務目標達成のためにどのような指標を提供したか。また，その指標はどのような複数の情報システムからどのようなデータを収集して算出したか。400字以上800字以内で述べよ。<\/div><div class=\"ask\"><b>設問イ<\/b>設問イ　設問アで述べた指標を提供する機能の設計では，どのような事項を，どのように検討したか。800字以上1,600字以内で具体的に述べよ。<\/div><div class=\"ask\"><b>設問ウ<\/b>設問ウ　設問イで述べた設計において，データの内容の問題にはどのようなものがあったか。また，それにどのように対応したか。600字以上1,200字以内で具体的に述べよ。<\/div>", "k": "<p class=\"lead\">添付論文の「エコアクション21の環境目標」を業務目標に使います。採点講評は、「業務目標と指標の関係が不明確」な論述を指摘しています。設問イの最初に、目標と指標の関係を書きます。平成30 問1と題材が近いですが、こちらは「複数システム」と「経営の指標」が主役です。<\/p><ul class=\"pts\"><li>設問ア:業務目標、指標、収集元のシステムとデータの3つを、問われた順に書きます。収集元は3つのシステムを名前で示します。<\/li><li>設問イ:問題文の例(算出する手順、コード体系と単位の差の吸収)をそのまま見出しに使います。<\/li><li>設問ウ:問題文の3つの工夫(新たなデータ取得の仕組み、みなし処理、社外から取得)のうち2つを、自分の事例で使っています。<\/li><\/ul><h3>骨子<\/h3><ul class=\"ol\"><li class=\"ch\">第1章 業務目標と提供した指標、収集したデータ<\/li><li class=\"sub\">1.1 業務目標 → 環境目標。4M変更に伴う旧版部品の廃棄金額を前年度の3割減<\/li><li class=\"sub\">1.2 指標 → ①工場別の廃棄量・金額 ②4M変更ごとの旧版廃棄率。委員会が月次の会議で使う<\/li><li class=\"sub\">1.3 データ → 生産・在庫管理、会計、廃棄物管理の3システム。立場<\/li><li class=\"ch\">第2章 指標を提供する機能の設計で検討した事項<\/li><li class=\"sub\">2.1 目標と指標の関係 → 結果の指標と原因の指標を組にする。達成の判定は廃棄金額、廃棄率は稼働後の変更どうしの比較<\/li><li class=\"sub\">2.2 算出手順 → 分母は新版の適用開始日時の旧版在庫、分子はその後の廃棄。最初の期末棚卸で確定、それまでは「集計中」<\/li><li class=\"sub\">2.3 差の吸収 → 工場コードと部門コードの対応表。個数・金額・重量(単位重量を持たせる)<\/li><li class=\"sub\">2.4 収集方式 → 月次のファイル(日次連携は相手の改修と費用)。月次の会議に足りる鮮度<\/li><li class=\"ch\">第3章 データの内容の問題と対応<\/li><li class=\"sub\">3.1 廃棄の理由がない → 端末で理由を選ばせる(4つ)。前年度は棚卸の用紙の理由欄「旧版」を申請書と照合してみなす。課長が抜き取りで確認、印を付ける<\/li><li class=\"sub\">3.2 単位重量がない → 主要品目は図面から、他は区分の平均。実重量と照合し差が2割超なら量り直す<\/li><li class=\"sub\">3.3 版不明 → 別に集計、廃棄率からは除く<\/li><li class=\"sub\">3.4 評価 → 廃棄金額は前年度の約3割減で目標に届く。即日切替の廃棄率が高い → 基準超は課長の承認も必須に。残課題(「その他」が多い→選択肢を見直す)<\/li><\/ul>", "a": "<h3>第1章 業務目標と提供した指標、収集したデータ<\/h3>\n<h4>1.1 業務目標<\/h4>\n<p>B社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。B社は環境方針として廃棄物の削減を環境目標に掲げており、部品の廃棄はその主な要因であった。部品の作り方を変える4M変更が月平均4〜5件あり、旧版の部品が棚に滞留して廃棄されていたからである。そこでB社は出庫を先入れ先出しに統一し、業務目標を「4M変更に伴う旧版部品の廃棄金額を、前年度の3割減とすること」とした。<\/p>\n<h4>1.2 提供した指標<\/h4>\n<p>私は、2つの指標を工場長と環境推進委員会に提供した。委員会が月次の会議で、廃棄の削減策を決めるために使う指標である。一つは、工場別の部品の廃棄量と廃棄金額である。もう一つは、4M変更ごとの旧版の廃棄率である。切替の時点で残っていた旧版の在庫のうち、使われずに廃棄された割合を示す。<\/p>\n<h4>1.3 収集したデータ<\/h4>\n<p>指標の算出には、3つの情報システムのデータを収集した。生産・在庫管理システムからは、版ごとの在庫、出庫と廃棄の実績、4M変更の申請と切替の日時を収集した。会計システムからは、部品の単価と部門のコードを収集した。総務部の廃棄物管理システムからは、工場ごとに処分した廃棄物の重量を収集した。<\/p>\n<p>私はシステム開発会社A社のシステムアーキテクトとして、この指標を提供する機能の要件定義から設計までを担当した。<\/p>", "i": "<h3>第2章 指標を提供する機能の設計で検討した事項<\/h3>\n<h4>2.1 業務目標と指標の関係<\/h4>\n<p>最初に、業務目標と指標の関係を検討した。工場長からは当初、廃棄金額だけを見たいという要望があった。環境目標は廃棄物の量で管理されるので、工場別の廃棄量は欠かせない。しかし、廃棄量だけでは、減った理由も増えた理由も分からない。そこで、結果を示す指標として廃棄量と廃棄金額を、原因を示す指標として4M変更ごとの旧版の廃棄率を、組にして提供することにした。廃棄率が高い変更を見れば、どの切替の決め方が廃棄を生んでいるかが分かり、次の申請の判断に生かせる。<\/p>\n<p>2つの指標は使い分けた。目標の達成は、前年度と比べた廃棄金額で判定する。廃棄率は、稼働後の4M変更どうしを比べるために使う。前年度の廃棄には版の記録が無く、変更ごとの廃棄率を同じ精度で求められないからである。<\/p>\n<h4>2.2 指標を算出する手順<\/h4>\n<p>旧版の廃棄率は、切替の時点で残っていた旧版の在庫数を分母、その後に廃棄された旧版の数を分子として求める。切替の時点は、新版の適用開始日時とした。旧版を使い切ってから切り替える変更でも、この時点の旧版の在庫を分母にできるからである。<\/p>\n<p>問題は、いつまでの廃棄を数えるかである。旧版の廃棄は、多くが年末年始の期末棚卸のときにまとめて判断される。そのため、切替から棚卸までの期間は変更ごとに異なり、そのまま比べると、棚卸の直前に切り替えた変更ほど廃棄率が低く見えてしまう。そこで、廃棄率は切替の後の最初の期末棚卸を終えた時点で確定させ、確定前の変更は「集計中」と表示することにした。確定までの間も、切替の時点の旧版在庫の残りは毎月表示し、廃棄が見込まれる変更を早めに把握できるようにした。<\/p>\n<h4>2.3 コード体
