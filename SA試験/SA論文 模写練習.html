<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SA論文 模写練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
/* 左に見本(原稿)、右に入力。上にタイマーと操作、下に実績。試験の答案用紙の静けさに、青インクの差し色。 */
:root{
  --paper:#f4f5f7; --sheet:#ffffff; --ink:#1d2330; --muted:#5d6676; --line:#d9dde5;
  --accent:#2747a8; --accent-soft:#e6ebf8;
  --good:#1f7a4d; --good-soft:#e2f2e9; --warn:#a36200; --warn-soft:#fbf0dc; --bad:#b3261e; --bad-soft:#fbe7e5;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-text:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14171d; --sheet:#1c2028; --ink:#e7eaf0; --muted:#9aa3b2; --line:#2e3440;
    --accent:#8ea6ff; --accent-soft:#232b45;
    --good:#5fcf95; --good-soft:#173326; --warn:#f0b65a; --warn-soft:#3a2c14; --bad:#ff8a80; --bad-soft:#3d1f1d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14171d; --sheet:#1c2028; --ink:#e7eaf0; --muted:#9aa3b2; --line:#2e3440;
  --accent:#8ea6ff; --accent-soft:#232b45;
  --good:#5fcf95; --good-soft:#173326; --warn:#f0b65a; --warn-soft:#3a2c14; --bad:#ff8a80; --bad-soft:#3d1f1d;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
button,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:16px;display:grid;gap:14px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
h1{font-size:20px;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px}
.controls{display:grid;grid-template-columns:minmax(220px,1.4fr) auto auto;gap:12px;align-items:end}
@media (max-width:900px){.controls{grid-template-columns:1fr}}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted)}
select{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font-size:14px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#10142a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#10142a}}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.timer{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.clock{font-family:var(--f-num);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em;min-width:5.2ch}
.clock.over{color:var(--bad)}
.target{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
:root[data-theme="dark"] .btn.primary{color:#10142a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#10142a}}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat{display:grid;line-height:1.25}
.stat b{font-family:var(--f-num);font-size:20px;font-variant-numeric:tabular-nums;font-weight:600}
.stat span{font-size:12px;color:var(--muted)}
.meter{height:6px;background:var(--line);border-radius:3px;position:relative;overflow:hidden;margin-top:6px}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.meter .min{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--warn)}
.work{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:62vh}
@media (max-width:900px){.work{grid-template-columns:1fr}}
.pane{display:flex;flex-direction:column;min-height:0}
.pane-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.pane-head h2{font-size:14px;margin:0;color:var(--muted);font-weight:500}
.model{flex:1;overflow:auto;font-family:var(--f-text);font-size:16px;line-height:1.95;padding:4px 6px;max-height:70vh;position:relative}
.model p{margin:0 0 .9em}
.model p.h{font-family:var(--f-body);font-weight:700;margin-top:.6em}
.model .cue{color:var(--muted)}
.model .cue em{font-style:normal;color:var(--ink)}
.model mark.miss{background:var(--bad-soft);color:var(--bad);border-radius:2px}
.blindcover{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);background:repeating-linear-gradient(135deg,var(--sheet) 0 12px,var(--paper) 12px 24px);border-radius:6px;padding:20px}
.blindcover strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
textarea#typed{flex:1;width:100%;min-height:52vh;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper);font-family:var(--f-text);font-size:16px;line-height:1.95;color:var(--ink)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.note{font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper)}
.tile b{display:block;font-family:var(--f-num);font-size:22px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.cover{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.cv{display:flex;justify-content:space-between;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;background:var(--sheet)}
.cv .dots{display:flex;gap:4px}
.dot{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:11px;border:1px solid var(--line);color:var(--muted)}
.dot.l1{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot.l2{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.dot.l3{background:var(--good-soft);color:var(--good);border-color:transparent}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
th.n{text-align:right}
.del{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:2px 6px}
.del:hover{color:var(--bad)}
section h2{font-size:16px;margin:0 0 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.kbd{font-family:var(--f-num);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>SA論文 模写練習</h1>
    <span class="sub">見本を写す → 頭出しで写す → 目隠しで再現する、の3段階で覚える</span>
  </header>

  <div class="panel controls">
    <label class="f" for="pid">問題
      <select id="pid"></select>
    </label>
    <div class="f" style="display:grid;gap:4px;font-size:12px;color:var(--muted)">設問
      <div class="seg" id="secSeg" role="group" aria-label="設問">
        <button type="button" data-v="a">設問ア</button><button type="button" data-v="i">設問イ</button><button type="button" data-v="u">設問ウ</button><button type="button" data-v="all">通し</button>
      </div>
    </div>
    <div class="f" style="display:grid;gap:4px;font-size:12px;color:var(--muted)">見本の見せ方
      <div class="seg" id="modeSeg" role="group" aria-label="見本の見せ方">
        <button type="button" data-v="show">見て写す</button><button type="button" data-v="cue">頭出し</button><button type="button" data-v="blind">目隠し</button>
      </div>
    </div>
  </div>

  <div class="panel bar">
    <div class="timer">
      <div class="clock" id="clock" aria-live="off">00:00</div>
      <div>
        <div class="target" id="targetTxt">目安 40分</div>
        <div class="row" style="margin-top:4px">
          <button class="btn primary" id="startBtn" type="button">開始</button>
          <button class="btn" id="resetBtn" type="button">リセット</button>
        </div>
      </div>
    </div>
    <div style="min-width:280px;flex:1;max-width:520px">
      <div class="stats">
        <div class="stat"><b id="sChars">0</b><span>入力字数(空白除く)</span></div>
        <div class="stat"><b id="sModel">0</b><span>見本の字数</span></div>
        <div class="stat"><b id="sCpm">–</b><span>字/分</span></div>
        <div class="stat"><b id="sPeek">0</b><span>チラ見</span></div>
      </div>
      <div class="meter" title="字数の進み具合"><i id="mFill" style="width:0"></i><span class="min" id="mMin" style="left:50%"></span></div>
      <div class="note" id="limitTxt" style="margin-top:4px"></div>
    </div>
    <div class="row">
      <button class="btn" id="checkBtn" type="button">照合する</button>
      <button class="btn primary" id="saveBtn" type="button">記録して終了</button>
    </div>
  </div>

  <div class="work">
    <div class="panel pane">
      <div class="pane-head">
        <h2 id="modelTitle">見本</h2>
        <div class="row">
          <span class="chip" id="matchChip" hidden></span>
          <button class="btn" id="peekBtn" type="button" hidden>チラ見(3秒)</button>
        </div>
      </div>
      <div class="model" id="model"></div>
    </div>
    <div class="panel pane">
      <div class="pane-head">
        <h2>入力(下書きはこのブラウザに自動保存)</h2>
        <button class="btn" id="clearBtn" type="button">入力を消す</button>
      </div>
      <textarea id="typed" spellcheck="false" placeholder="ここにタイピングで写します。入力を始めるとタイマーが自動で動きます。"></textarea>
    </div>
  </div>

  <section class="panel">
    <div class="bar" style="margin-bottom:10px">
      <h2 style="margin:0">実績</h2>
      <div class="row">
        <span class="chip" id="storeChip">保存先を確認中</span>
        <button class="btn" id="csvBtn" type="button">CSVをコピー</button>
      </div>
    </div>
    <div class="tiles" style="margin-bottom:12px">
      <div class="tile"><b id="tToday">0分</b><span>今日の練習時間</span></div>
      <div class="tile"><b id="tCount">0回</b><span>記録の回数</span></div>
      <div class="tile"><b id="tCpm">–</b><span>直近5回の平均 字/分</span></div>
      <div class="tile"><b id="tBlind">–</b><span>目隠しの平均一致率</span></div>
    </div>
    <div class="note" style="margin-bottom:6px">問題ごとの到達段階(ア・イ・ウ)。色が濃いほど先の段階:<span class="dot l1" style="display:inline-grid;width:auto;padding:0 6px">見</span> 見て写した <span class="dot l2" style="display:inline-grid;width:auto;padding:0 6px">頭</span> 頭出しで写した <span class="dot l3" style="display:inline-grid;width:auto;padding:0 6px">隠</span> 目隠しで一致率70%以上</div>
    <div class="cover" id="cover" style="margin-bottom:14px"></div>
    <div class="row" style="margin-bottom:6px">
      <label class="note" for="onlyCur"><input type="checkbox" id="onlyCur"> 選択中の問題だけ表示</label>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>日時</th><th>問題</th><th>設問</th><th>見せ方</th><th class="n">時間</th><th class="n">字数</th><th class="n">字/分</th><th class="n">一致率</th><th class="n">チラ見</th><th></th></tr></thead>
        <tbody id="hist"></tbody>
      </table>
    </div>
    <p class="note" id="emptyHist">まだ記録がありません。写し終えたら「記録して終了」を押してください。</p>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const DATA = [{"id": "r7q2", "label": "令和7 問2", "theme": "現行システムと新システム間の差異を踏まえたデータ移行", "a": "第1章 対象の業務と情報システム、データ移行の背景\n\n1.1 対象の業務と情報システムの概要\n\nB社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。第2・第3工場で製造したユニットを本社工場で組み立てて出荷している。対象の業務は、3工場をまたがる生産計画、部品の所要量計算と発注、受入と検査、倉庫での保管と出庫、工場間の移動、組立、出荷までの生産管理業務と在庫管理業務である。\n\n対象の情報システムは、B社の生産・在庫管理システムである。PCのクライアントとデータベースサーバの2層構成で、サーバは本社工場に置き、第2・第3工場からは専用線で利用する。倉庫ではハンディ端末でロケーションと現品票のQRコードを読み取り、入出庫を記録する。\n\n1.2 データ移行が必要となった背景\n\nB社では4M変更が月平均4〜5件発生し、変更前の版の部品が棚の奥に残って、棚卸のたびに廃棄の対象になっていた。B社は廃棄物の削減を環境目標に掲げており、業務改善指針で出庫を先入れ先出しに統一し、翌年度の期初から3工場一斉に適用することを決めた。\n\nこれを実現するため、在庫を品目コードだけでなく版と生産ロットで管理する機能を追加した。そのため、品目コード単位で持っていた現行のロケーションと在庫のデータ、紙で管理していた4M変更の情報を、新しい持ち方に移行する必要があった。\n\n私はシステム開発会社A社のシステムアーキテクトとして、本機能追加の要件定義から移行設計までを担当した。", "i": "第2章 現新システムの差異と移行方法\n\n2.1 現新システムの差異\n\n私はまず、現行のデータの項目の意味と、実際に入っている値を調べた。その結果、次の3つの差異があった。\n\n第一に、ロケーションマスタである。現行は品目コード単位で、同じロケーションに異なる版が混在していた。新システムは品目コードと版の単位でロケーションを持ち、出庫停止区分と、適用開始日時と出庫停止日時を加える。\n\n第二に、在庫データである。現行も生産ロットの管理番号は持つが、版の運用を始める前の在庫には版の情報が無いものが多数あった。新システムは全ての在庫に版を必須とする。\n\n第三に、4M変更の情報である。現行は紙の申請書で管理し、切替方法と時期はシステムに無かった。新システムは変更申請機能でこれらを持ち、ロケーションの日時に反映する。\n\n2.2 ロケーションマスタの移行方法\n\nシステム面では、4M変更の対象になったことがない品目は、現行のロケーション1件を「品目コードと現在の版」の1件にそのまま変換した。これが大半を占める。4M変更の対象になった品目だけ、版ごとに区画を分けた新しいロケーションを登録した。\n\n業務面では、対象品目の棚の再配置を、倉庫作業者が棚卸に合わせて行う。版ごとに区画を分けると棚が不足するおそれがあるため、旧版の在庫がなくなったロケーションは解除して、新版に再利用できるようにした。\n\n2.3 在庫の版の移行方法\n\n最も悩んだのは、版の情報が無い在庫の扱いである。私は3つの案を比較した。案Aは、全ての在庫の版を現品で調べてから移行する案である。確実だが、調査に時間が掛かり期初に間に合わない。案Bは、申請書の変更時期と棚入れの時期から、全ての在庫の版を推定する案である。早いが、推定を誤ると旧版を新版として出庫するおそれがある。案Cは、版の項目に「版不明」のコード値を追加して移行し、出庫引当で最優先にする案である。\n\n私は案Cを選んだ。版不明の在庫を先に使い切れば、版が分かる在庫だけが残る状態に自然に移れるからである。システム面では、版不明のコード値を追加し、出庫引当で最優先にした。現品票はロケーション単位で一括発行し、棚卸の際に貼り替えるだけで済むようにした。\n\nただし、旧版を即日止める品目や切替時期を指定した品目を版不明のまま出庫すると、切替方法に違反するおそれがある。業務面では、これらの品目に限って案Bの推定を行い、在庫管理担当者と協議して版を確定させた。\n\n2.4 4M変更の情報の移行方法\n\nシステム面では、承認済みで切替が終わっていない申請だけを、決まった様式から変更申請機能に一括で取り込む仕組みを用意した。切替時期が過去日になっているなどの誤りは、取込時に理由付きの一覧に出す。業務面では、在庫管理担当者が紙の申請書から様式に転記し、申請した部門が切替方法と時期を確認してから取り込んだ。", "u": "第3章 データの移行タイミングと実施方法\n\n3.1 移行計画を検討した観点\n\n私は、作業時間と作業品質の2つの観点で移行計画を検討した。作業時間は、生産を止めずに、指針の適用開始日である期初までに3工場の移行を終えられるかである。作業品質は、版とロケーションを誤りなく移せるかである。版を誤ると、旧版の部品が出庫されて品質問題につながるからである。\n\n3.2 移行のタイミング\n\n棚の再配置と現品票の貼り替えは現品を動かすので、生産と並行すると出庫の妨げになる。生産ラインが止まるのは年末年始の棚卸だけだが、全品目をそこで行うと連休中に終わらない。そこで、入出庫の実績から主要品目を選び、主要品目は年末年始の棚卸で、それ以外は事前の循環棚卸に合わせて前倒しで行うことにした。出庫引当の順序の切替は、期初の適用開始日時に3工場一斉に行う。\n\n3.3 実施方法\n\nデータの種類ごとに実施方法を分けた。ロケーションマスタは、新しく持たせた適用開始日時を使い、期初の日時を付けて事前に登録した。こうすれば、事前に登録しても現行の出庫には影響しない。在庫の版の付与と現品票の貼り替えは、棚卸で再配置した分から順に行った。その間も、出庫引当は従来の順序で動かした。また、4M変更の情報を取り込んだ後は紙の申請を廃止し、変更申請機能で受け付けた。こうして、事前に移行した後の差分が紙に残らないようにした。\n\n作業品質を確保するため、次の3つを行った。第一に、切替の判定条件を、3工場の在庫数とロケーションの登録内容に差異がないこととした。棚卸で数えた現品と、新しいロケーションの在庫を照合して確かめる。第二に、版不明の在庫の件数を工場ごとに集計し、減っていくことを確認した。第三に、出庫引当の順序を設定で従来に戻せるようにし、戻す基準と判定者を事前に在庫管理担当者と合意した。\n\nその結果、期初の適用開始日時に、生産を止めずに3工場で新しい出庫引当へ切り替えられた。一方、版不明の在庫は使い切るまで残る。今後は、版の情報が無い在庫を移行の前に洗い出す期間を計画に入れたい。"}, {"id": "h28q2", "label": "平成28 問2", "theme": "情報システムの移行方法", "a": "第1章 対象業務と現システム、新システムへの変更の概要\n\n1.1 対象業務の概要\n\nB社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。第2・第3工場で製造したユニットを本社工場で組み立てて出荷している。対象の業務は、3工場をまたがる生産計画、部品の所要量計算と発注、受入と検査、倉庫での保管と出庫、工場間の移動、組立、出荷までの生産管理業務と在庫管理業務である。\n\n1.2 現システムの概要\n\n現システムは、B社の生産・在庫管理システムである。PCのクライアントとデータベースサーバの2層構成で、サーバは本社工場に置き、第2・第3工場からは専用線で利用する。倉庫ではハンディ端末でロケーションと現品票のQRコードを読み取り、入出庫を記録する。ロケーションは品目コード単位で管理し、出庫は作業者が品目コードだけを見て、取りやすいものから行っていた。4M変更は紙の申請書で管理していた。\n\n1.3 新システムへの変更の概要\n\nB社では4M変更で旧版の部品が棚に滞留し、棚卸のたびに廃棄されていた。そこでB社は出庫を先入れ先出しに統一し、翌年度の期初から3工場一斉に適用することを決めた。新システムでは、ロケーションを品目コードと版の単位に分け、出庫引当で版と生産ロットの古いものを候補にする。また、紙の4M変更申請を電子化し、現品票のQRコードに版と生産ロットを加える。\n\n私はシステム開発会社A社のシステムアーキテクトとして、本機能追加の要件定義から方式設計、移行設計までを担当した。", "i": "第2章 制約条件と選択した移行方法\n\n2.1 対象業務の特性による制約条件\n\n私は、対象業務の特性から、移行の制約条件を次の3つに整理した。\n\n第一に、3工場で同時に切り替える必要がある。3工場は1つの製品を分担して作り、部品やユニットが毎日工場の間を移動する。一部の工場だけ新しい順序で出庫すると、移動してきた在庫の扱いが工場によって食い違う。業務改善指針も3工場一斉の適用を定めていた。\n\n第二に、生産を止められない。3工場の生産ラインが止まるのは、年末年始の棚卸の期間だけである。\n\n第三に、現品を動かす作業に時間が掛かる。新システムでは版ごとに置き場所を分けるため、棚の再配置と現品票の貼り替えが必要になる。全品目を年末年始の棚卸だけで行うと、連休中に終わらない。\n\n2.2 移行方法の比較と選択\n\n私は3つの案を比較した。案Aは、年末年始の連休に、棚の再配置から出庫引当の切替までを一度に行う一斉移行である。切替の時点はそろうが、第三の制約から作業が連休中に終わらない。案Bは、工場ごとに順に切り替える段階移行である。一度に扱う作業量は減るが、第一の制約に反する。案Cは、移行を2段階に分ける案である。現品の準備は前倒しで段階的に行い、出庫引当の切替だけを期初に3工場一斉に行う。\n\n私は案Cを選んだ。現品を動かす作業と、出庫のルールを切り替える作業は、分けて行えると考えたからである。現品の準備が終わっていれば、切替そのものはシステムの設定の変更で済む。\n\n新旧の順序を並行して動かす並行稼働も検討した。しかし、同じ倉庫で2つの出庫順序が混在すると作業者が迷い、取り違えの原因になる。そのため採らなかった。\n\n2.3 2段階の移行の内容\n\n第1段階は、棚の再配置と現品票の貼り替えである。入出庫の実績から主要品目を選び、主要品目は生産ラインが止まる年末年始の棚卸で再配置する。それ以外の品目は、事前の循環棚卸に合わせて前倒しで再配置する。この間も、出庫引当は従来の順序で動かす。\n\n第2段階は、出庫引当の切替である。3工場の在庫数とロケーションの登録内容に差異がないことを判定条件とし、期初の適用開始日時に3工場一斉に新しい出庫引当へ切り替える。新しいロケーションは適用開始日時を付けて事前に登録しておくので、切替の当日に作業者がマスタを更新する必要はない。", "u": "第3章 移行作業後の業務に支障を出さない工夫\n\n3.1 移行期間中の4M変更による旧版の出庫\n\n想定した支障の一つ目は、移行期間中に起きた4M変更の切替が漏れ、旧版が出庫されることである。4M変更は月平均4〜5件あり、移行期間中も止まらない。現システムでは、切替当日に担当者がマスタを手作業で更新するため、更新漏れや時刻のずれが起きやすい。\n\nそこで、紙の申請を電子化する変更申請機能を、出庫引当の切替より先に稼働させた。申請の承認時点で、新版のロケーションを適用開始日時付きで、旧版のロケーションを出庫停止日時付きで登録する。切替の時期になると、人手を介さずに旧版の出庫が止まる。\n\n3.2 切替直後の出庫の滞り\n\n二つ目は、切替直後に作業者が新しい順序に戸惑い、出庫が滞ることである。古い在庫の場所を知らなければ、順序を指示されても守れない。そこで、読み取った現品票より古い在庫がある場合は、警告とともに古い在庫のロケーションをハンディ端末に表示した。また、古い在庫が奥にあって取り出せない場合などは、理由を選択すれば出庫できるようにした。作業を止めずに、順序を外れた出庫を後から確認できる。\n\n3.3 移行データの誤りによる引当の失敗\n\n三つ目は、ロケーションの登録内容と現品が食い違い、引当の候補に実在しない在庫が出ることである。そこで、切替の前に、棚卸で数えた現品と新しいロケーションの在庫を3工場分照合し、差異を一覧に出す仕組みを用意した。さらに、出庫引当の順序を設定で従来に戻せるようにし、戻す手順のリハーサルで所要時間を測った。切替日の朝に差異が解消できなければ従来の順序に戻す、という基準を在庫管理担当者と事前に合意した。\n\nその結果、期初の切替日も出庫は滞らず、生産を止めずに3工場で先入れ先出しを始められた。一方、理由を選択して順序を外れた出庫は、奥の棚に古い在庫が残る品目に偏っていた。今後は、記録された理由を在庫管理担当者と分析し、棚の配置を見直していきたい。"}, {"id": "h29q2", "label": "平成29 問2", "theme": "柔軟性をもたせた機能の設計", "a": "第1章 対象業務と情報システムの概要、設計が必要になった背景\n\n1.1 対象業務の概要\n\nB社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。第2・第3工場で製造したユニットを本社工場で組み立てて出荷している。対象の業務は、3工場をまたがる生産計画、部品の所要量計算と発注、受入と検査、倉庫での保管と出庫、工場間の移動、組立、出荷までの生産管理業務と在庫管理業務である。\n\n1.2 情報システムの概要\n\n対象の情報システムは、B社の生産・在庫管理システムである。PCのクライアントとデータベースサーバの2層構成で、サーバは本社工場に置き、第2・第3工場からは専用線で利用する。倉庫ではハンディ端末でロケーションと現品票のQRコードを読み取り、入出庫を記録する。\n\n1.3 柔軟性をもたせた設計が必要になった背景\n\nB社では4M変更で旧版の部品が棚に滞留し、廃棄の原因になっていた。そこでB社は出庫を先入れ先出しに統一し、本システムに版と生産ロットの古い順に出庫させる機能を追加した。\n\n4M変更は月平均4〜5件発生し、変更ごとに旧版から新版への切替方法が決まる。切替方法は、旧版を使い切ってから切り替える、旧版を処分して即日切り替える、指定した時期に切り替える、の3通りである。変更のたびにプログラムを直していては、切替に間に合わない。そのため、切替のルールの変化に、設定だけで対応できる設計が必要になった。\n\n私はシステム開発会社A社のシステムアーキテクトとして、本機能追加の要件定義から方式設計までを担当した。", "i": "第2章 柔軟性をもたせた機能と設計\n\n2.1 柔軟性の対象にした業務ルール\n\n私は、4M変更で変わる業務ルールを洗い出し、柔軟性の対象を次の2つにした。\n\n第一に、「どの版の在庫を、いつから、いつまで出庫してよいか」というルールである。これは4M変更のたびに、切替方法と時期によって変わる。\n\n第二に、「1つの品目は1つの置き場所に置く」というルールである。現行は品目コードと置き場所が多対1で、同じ棚に新旧の版が混在していた。新旧の版を取り違えないためには、品目と版ごとに置き場所を分け、版が変わるたびに置き場所を増やしたり解除したりする必要がある。\n\n一方、4M変更では品目コードは変わらない。そのため、品目マスタの構造は柔軟性の対象にしなかった。\n\n2.2 出庫の可否を判定する機能の設計\n\n一つ目のルールに対して、出庫引当の機能を次のように設計した。ロケーションマスタに、適用開始日時と出庫停止日時の2つの項目を持たせる。出庫引当は、処理した日時に有効なロケーションだけを候補にする。\n\nこの設計では、3通りの切替方法を、プログラムの分岐ではなく日時の組合せで表せる。使い切ってから切り替える場合は、新版の適用開始日時だけを設定する。引当は古い版を優先するので、旧版を使い切ると自然に新版に移る。即日切り替える場合は、旧版の出庫停止日時を承認の時点にする。時期を指定する場合は、新版の適用開始日時と旧版の出庫停止日時を、その時期にそろえる。\n\n日時は、変更申請機能で申請が承認された時点に自動で登録する。そのため、切替の当日に担当者がマスタを手作業で更新する必要がない。新しい切替方法が求められても、日時の組合せで表せる限り、プログラムを変えずに対応できる。\n\n2.3 品目と置き場所の対応の設計\n\n二つ目のルールに対しては、品目と置き場所の対応を関係テーブルにした。ロケーションを品目コードと版の組で登録し、1つの品目が版ごとに複数のロケーションを持てるようにした。\n\n版ごとに置き場所を分けると、棚が不足するおそれがある。そこで、旧版の在庫がなくなったロケーションは解除して、新版に再利用できるようにした。解除と再利用は、在庫管理担当者がマスタの画面から行う。解除の候補には、旧版の在庫が無くなり、出庫停止日時を過ぎたロケーションだけを表示する。誤って在庫の残るロケーションを解除しないためである。置き場所の増減のたびに、プログラムを直す必要はない。", "u": "第3章 開発コストを抑えるための絞り込み\n\n3.1 柔軟にする範囲を、切替の時期と出庫の可否に絞った\n\n出庫の順序そのものも、パラメタで変えられるようにする案があった。例えば、古い順ではなく、使用期限の近い順に出庫する、といった並べ方を選べるようにする案である。しかし、並べ方を選べるようにすると、引当の処理が複雑になり、テストの組合せも大きく増える。\n\n私は、過去の4M変更の申請書を在庫管理担当者と一緒に見直した。その結果、変更ごとに違っていたのは切替方法と時期だけで、古いものから出庫するという順序は一度も変わっていなかった。また、業務改善指針は先入れ先出しを全社の方針として定めており、環境目標が続く限り変わる見込みは低い。そこで、出庫の順序は「版不明、版、生産ロットの古い順」に固定し、パラメタにしなかった。\n\n3.2 持たせる項目を、2つの日時に絞った\n\n切替の条件として、残数が一定以下になったら切り替える、といった数量の条件を持たせる案もあった。しかし、過去の申請書に数量で切り替えた例は無かった。使い切ってから切り替える場合は、引当の順序だけで実現できる。そこで、条件として持たせる項目を、適用開始日時と出庫停止日時の2つに絞った。\n\nまた、工場ごとに切替の時期をずらしたいという要望に備えて、工場別の日時を持たせる案もあった。しかし、ロケーションはもともと工場ごとに登録されている。ロケーションごとの日時を工場ごとに変えれば、項目を増やさずに同じことができる。そのため、工場別の項目は追加しなかった。\n\n3.3 絞り込みが適切であると考えた理由\n\nこの絞り込みは、過去の実績と指針の方向という、B社の業務の事実に基づいている。柔軟性は、実際に変わってきた部分にだけ持たせ、変わってこなかった部分は単純に作った。稼働後も4M変更は月平均4〜5件続いたが、全て設定だけで対応でき、プログラムの修正は発生しなかった。一方、将来、使用期限のある部品を扱うことになれば、出庫の順序の見直しが必要になる。その時点で改めて範囲を判断する。"}, {"id": "h27q1", "label": "平成27 問1", "theme": "システム方式設計", "a": "第1章 対象の業務と情報システムの概要\n\n1.1 対象の業務の概要と特徴\n\nB社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。第2・第3工場で製造したユニットを本社工場で組み立てて出荷している。対象の業務は、3工場をまたがる生産計画、部品の所要量計算と発注、受入と検査、倉庫での保管と出庫、工場間の移動、組立、出荷までの生産管理業務と在庫管理業務である。\n\n業務の特徴は2つある。一つは、部品の作り方を変える4M変更が月平均4〜5件あり、内製品の版が頻繁に変わることである。もう一つは、倉庫の作業者が品目コードだけを見て、取りやすい部品から出庫していたことである。そのため旧版の部品が棚の奥に滞留し、棚卸のたびに廃棄されていた。\n\n1.2 情報システムの概要と特徴\n\n対象の情報システムは、B社の生産・在庫管理システムである。PCのクライアントとデータベースサーバの2層構成で、サーバは本社工場に置き、第2・第3工場からは専用線で利用する。倉庫ではハンディ端末でロケーションと現品票のQRコードを読み取り、入出庫を記録する。3工場の在庫を1つのデータベースで持つことが特徴である。\n\nB社は廃棄を減らすため、出庫を先入れ先出しに統一することを決めた。私はシステム開発会社A社のシステムアーキテクトとして、そのための機能追加の要件定義から方式設計までを担当した。", "i": "第2章 システム要件と設計したシステム方式\n\n2.1 実現するシステム要件\n\n実現するシステム要件は次の3つである。第一に、同じ品目は版と生産ロットの古い順に出庫すること。第二に、4M変更で指定された切替方法を守って新しい版に切り替えること。第三に、倉庫の出庫作業を止めないことである。私は、これらをハードウェア、ソフトウェア、人手の作業にどう分担させるかを検討した。\n\n2.2 版の取り違えを防ぐ方式\n\n第一と第二の要件に対して、2つの方式を比較した。案Aは、棚は品目コード単位のままで、出庫時にソフトウェアが古い版とロットを指示する方式である。棚の再配置が要らず、開発も小さい。しかし、同じ棚に新旧の版が混在するため、取り違えを物理的には防げない。旧版を即日止める切替方法にも対応できない。\n\n案Bは、棚を品目コードと版の単位に分け、置き場所で版を分ける方式である。棚の再配置という人手の作業が必要になるが、取り違えを防げ、旧版を棚単位で出庫停止できる。\n\n私は案Bを選んだ。業務プロセスへの効果として、品質上は切替方法を確実に守ることが最も重要だと考えたからである。実現可能性については、再配置が必要なのは4M変更の対象になった品目だけで、棚卸に合わせれば期初までに終えられると見積もった。棚の不足には、旧版の在庫がなくなった置き場所を新版に再利用することで対応した。同じ版の中のロットの順序は、案Aと同じくソフトウェアの判定で補った。\n\n2.3 順序を判定する場所\n\n順序の判定を、ハンディ端末で行うか、データベースサーバで行うかも比較した。端末で行うと、端末の種類ごとに同じ判定を作ることになり、保守性が悪い。そこで、判定はサーバで行い、引当の候補を古い順に並べて返す方式とした。3工場の在庫を1つのデータベースで持つので、工場が違っても同じ規則で判定できる。専用線を通っても1回の問合せで済むよう、索引を見直した。\n\n2.4 人手に残した作業と、ハードウェア\n\n古い在庫が奥にあって取り出せないなど、現場にはやむを得ない例外がある。システムで出庫を完全に禁止すると、作業が止まってしまう。そこで、例外の判断は人手に残した。作業者は理由を選んで出庫でき、在庫管理担当者が後で理由を分析する。\n\nハードウェアは、既存のハンディ端末とラベルプリンタをそのまま使った。現品票のQRコードに版と生産ロットを加えても、既存の機器で印字と読取りができることを確かめた。新たな機器の購入が要らないため、開発コストと期間を抑えられた。", "u": "第3章 利用者の理解度を高める工夫\n\n3.1 稼働後の業務の全体像と役割分担を1枚で示した\n\nこの方式では、4M変更の申請から出庫停止までに、申請部門、在庫管理担当者、倉庫作業者の3者が関わる。説明の当初、在庫管理担当者は「切替日のマスタ更新は誰がするのか」を心配していた。そこで私は、申請、承認、置き場所の登録、出庫停止、出庫までを1枚の業務フローにし、システムが自動で行う部分と人が行う部分を色で分けて示した。承認の時点で切替の日時が登録され、当日の手作業が無くなることが一目で分かるようにした。その結果、在庫管理担当者は切替日の管理をシステムに任せることに同意した。\n\n3.2 方式の違いを、実際の棚で示した\n\n倉庫の班長からは、棚の再配置の負担に不満が出た。そこで、新旧の版が混在している実際の棚の写真を使い、案Aでは作業者がこの棚から旧版を取れてしまうことを示した。写真は、班長が担当する棚から選んだ。自分の職場の棚であれば、危険を具体的に想像できると考えたからである。案Bの再配置は対象の品目に限られることも、品目の一覧で示した。班長は、取り違えの危険を現場の目で確かめ、再配置の計画づくりに協力してくれた。\n\n3.3 試作の画面で、作業者に実際に操作してもらった\n\n倉庫作業者には、文書ではなく、試作したハンディ端末の画面で説明した。実際の棚の前で、古い在庫があるときの警告、古い在庫の置き場所の表示、理由を選んで出庫する流れを操作してもらった。その場で、作業者から「奥の在庫はフォークリフトが無いと出せない」という意見が出た。そこで、理由の選択肢に「荷役の機器が必要」を加えた。\n\nこれらの工夫により、利用者は方式の決定理由を自分の業務の言葉で理解し、稼働前に合意できた。一方、説明は本社工場で先に行い、第2・第3工場には資料で伝えたため、質問が稼働後に集中した。今後は、各工場で同じ実演を行う時間を計画に入れたい。"}, {"id": "r4q2", "label": "令和4 問2", "theme": "業務のデジタル化", "a": "第1章 対象業務、情報システムの概要、期待した業務改善\n\n1.1 対象業務\n\nB社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。対象の業務は、部品の作り方を変える4M変更の申請と承認、それを受けた在庫の切替、倉庫での出庫までの一連の業務である。4M変更は月平均4〜5件発生し、変更ごとに旧版から新版への切替方法と時期が決まる。\n\n従来、4M変更は紙の申請書で管理していた。承認された申請書は回覧で在庫管理担当者に届き、担当者が切替の当日に在庫のマスタを手作業で更新していた。そのため、更新漏れや時刻のずれで旧版が出庫されたり、旧版が棚に滞留して廃棄されたりしていた。\n\n1.2 情報システムの概要\n\n対象の情報システムは、B社の生産・在庫管理システムである。PCのクライアントとデータベースサーバの2層構成で、サーバは本社工場に置き、第2・第3工場からは専用線で利用する。倉庫ではハンディ端末でロケーションと現品票のQRコードを読み取り、入出庫を記録する。\n\n1.3 実現を期待した業務改善\n\n期待した業務改善は3つである。第一に、切替方法と時期を確実に守り、旧版の誤った出庫を無くすこと。第二に、どの品目がいつ切り替わるかを、関係者が誰でも検索できるようにすること。第三に、切替当日のマスタ更新の手作業を無くすことである。\n\n私はシステム開発会社A社のシステムアーキテクトとして、このデジタル化の要件定義から方式設計までを担当した。", "i": "第2章 デジタル化した業務プロセスと、課題への対応策\n\n2.1 デジタル化する業務プロセスの見極め\n\n私はまず、申請から出庫までの業務の流れを、申請部門、在庫管理担当者、倉庫作業者に聞き取って整理した。その結果、誤りと遅れが生まれていたのは2か所だった。一つは、承認された申請書が回覧で届くまでの間である。もう一つは、切替当日に担当者がマスタを手で更新する作業である。一方、申請の内容を技術的に判断する承認の作業は、人が判断すべきもので、紙でも問題は起きていなかった。そこで、この2か所を中心にデジタル化することにした。\n\n2.2 デジタル化の内容\n\n紙の申請書の代わりに、変更申請機能を追加した。申請者は、品目、新しい版、切替方法、切替時期を画面で入力する。切替方法は、使い切ってから切り替える、即日切り替える、指定した時期に切り替える、の3つから選ぶ。\n\n申請が承認されると、変更申請機能が在庫管理の機能を呼び出し、新版のロケーションを適用開始日時付きで登録する。旧版のロケーションには出庫停止日時を設定する。出庫引当は、その日時に有効なロケーションだけを候補にする。こうして、承認から切替までを人手を介さずにつないだ。あわせて、現品票のQRコードに版と生産ロットを加え、出庫時に版を記録できるようにした。\n\n2.3 課題と対応策\n\n第一の課題は、申請の入力の誤りである。紙のときは在庫管理担当者が受け取った時点で気付けたが、デジタル化すると誤った日時がそのまま切替に使われる。例えば即日切替を誤って選ぶと、使える旧版の在庫まで出庫が止まってしまう。そこで、承認の前に、在庫管理担当者が在庫への影響を確認する手順を加えた。画面には、切替時点で残る旧版の在庫数と、その間の出庫予定を表示する。旧版が大量に残る場合は、申請者に切替時期の見直しを依頼してから承認する。\n\n第二の課題は、承認者が不在のときの遅れである。紙のときは別の管理者が代わりに押印していたが、システムでは決まった承認者しか承認できない。そこで、承認者ごとに代理承認者を登録できるようにし、承認の期限が近づくと代理承認者にも通知するようにした。\n\n第三の課題は、版の情報が無い過去の在庫である。版の運用を始める前の在庫は、システム上で切替の対象にできない。そこで、版不明のコード値を設けて出庫引当で最優先とし、先に使い切ることにした。", "u": "第3章 利用者が習熟するための工夫\n\n3.1 申請者が切替方法を選び間違えない画面\n\n申請者にとって、3つの切替方法の違いは文字だけでは分かりにくい。そこで、申請画面で切替方法を選ぶと、旧版と新版がいつからいつまで出庫されるかを、時間の流れに沿った図で表示するガイド機能を組み込んだ。選んだ方法の結果を目で見て確かめてから申請できる。導入の後、切替方法の選び間違いによる差戻しは、ほとんど無くなった。\n\n3.2 申請の状況を自分で確かめられる一覧\n\n紙のときは、申請書がどこにあるかを電話で確かめていた。そこで、申請の状況を一覧で見られる画面を用意した。申請者は自分の申請がどの段階にあるかを確かめられ、在庫管理担当者は切替が近い品目を日付順に確認できる。切替日が近いのに承認されていない申請は、色を変えて表示した。\n\n3.3 倉庫作業者への出庫時の案内\n\n倉庫作業者は、申請の画面を使わない。作業者にとっての変化は、出庫の順序を守ることである。そこで、読み取った現品票より古い在庫がある場合は、警告とともに古い在庫のロケーションをハンディ端末に表示した。作業者は、どこから取ればよいかをその場で知ることができる。古い在庫が奥にあって取り出せない場合は、理由を選択すれば出庫できるようにし、作業を止めないようにした。\n\n3.4 稼働直後の支援\n\n稼働から最初の1か月は、在庫管理担当者が全ての申請の内容を承認前に確かめた。よくある誤りは質問と回答の一覧にまとめ、申請画面から開けるようにした。利用者は、迷ったときに担当者に聞かずに確かめられる。一覧は毎週見直し、新しく出た質問を加えていった。\n\n一方、承認の前の影響確認は、在庫管理担当者の負担になった。今後は、影響が小さい申請は確認を省略できる基準を決め、負担を減らしたい。"}, {"id": "r1q1", "label": "令和元 問1", "theme": "ユーザビリティを重視したUIの設計", "a": "第1章 対象業務と提供する機能、利用者の特性と利用シーン\n\n1.1 対象業務と提供する機能の概要\n\nB社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。対象の業務は、3工場の倉庫での部品の出庫業務である。B社では4M変更で旧版の部品が棚に滞留し、廃棄の原因になっていたため、出庫を先入れ先出しに統一することになった。\n\n対象の情報システムは、B社の生産・在庫管理システムである。PCのクライアントとデータベースサーバの2層構成で、倉庫ではハンディ端末でロケーションと現品票のQRコードを読み取り、入出庫を記録する。今回、出庫時に版と生産ロットの順序を判定し、読み取った現品票より古い在庫があれば知らせる機能を追加した。私はシステム開発会社A社のシステムアーキテクトとして、この機能の要件定義からUIの設計までを担当した。\n\n1.2 想定した利用者の特性\n\n利用者は倉庫作業者である。作業者は手袋をして立ったまま作業し、片手にハンディ端末、もう片方の手で部品を扱う。作業者には、長年同じ倉庫で働くベテランと、繁忙期に他の職場から来る応援者がいる。応援者は、棚の配置にも端末の操作にも慣れていない。\n\n1.3 想定した利用シーン\n\n出庫は、生産ラインが部品を待っている状態で行われることが多く、作業者は急いでいる。倉庫には照明の届きにくい棚があり、フォークリフトの音で周りが騒がしい。作業者は棚の前で端末を見ながら、どの部品を取るかをその場で判断する。", "i": "第2章 重視したユーザビリティと設計したUI\n\n2.1 重視したユーザビリティ\n\n私は、有効性を最も重視した。この機能の目的は、作業者が古い版の在庫から確実に出庫することである。誤った版を出庫すると、旧版が滞留して廃棄につながり、切替方法に違反すれば品質問題にもなる。次に、効率を重視した。生産ラインが部品を待っているので、作業を止めてはならない。満足度については、作業者が順序を守ることを負担と感じないことを目標とした。\n\n2.2 有効性を高めるUI\n\n第一に、判定の結果を、色と文字と振動で伝えることにした。古い在庫が無ければ緑の画面と短い音で知らせ、作業者はそのまま次へ進める。古い在庫がある場合は、黄色の画面に「古い在庫あり」と大きな文字で表示し、端末を振動させる。騒がしい倉庫では音が聞こえないことがあり、暗い棚の前では色だけでは見分けにくいと考えたからである。\n\n第二に、古い在庫のロケーションを、警告と同じ画面に大きく表示した。作業者が警告を見ても、古い在庫の場所を知らなければ順序は守れない。特に応援者は棚の配置を知らないので、場所を示すことが欠かせないと考えた。\n\n第三に、警告は古い在庫がある場合だけに出すことにした。全ての出庫で確認を求めると、作業者は警告に慣れて読まずに進めるようになる。警告の意味を保つには、本当に必要な場面に絞ることが大切だと考えた。\n\n2.3 効率を高めるUI\n\n手袋をしたままでは、画面のキーで文字を入力するのは難しい。そこで、操作は読取りと、端末側面のトリガーキーだけで完結するようにした。品目や数量を手で入力する場面は作らなかった。\n\n古い在庫が奥にあって取り出せないなど、やむを得ない場合もある。このときは、画面に番号付きで表示した3つの理由から、数字キー1つで選んで出庫できる。理由の選択肢は、過去に作業者が順序を守れなかった場面を聞き取って絞り込んだ。\n\n応援者向けには、画面の上部に「棚を読む」「現品票を読む」といった次の手順を1行で表示した。一方、ベテランは連続して出庫することが多い。そこで、同じ棚から続けて出庫するときは、棚の読取りを省略できるようにした。棚の読取りを省略しても、現品票の読取りで品目と版を確認できるので、有効性は損なわないと判断した。", "u": "第3章 設計プロセスでの工夫\n\n3.1 実際の倉庫で、想定した利用者に操作してもらった\n\nUIの設計では、会議室で画面の案を見せるだけでは足りないと考えた。手袋、騒音、暗い棚といった条件は、倉庫でなければ再現できないからである。そこで、試作した画面を実際のハンディ端末に入れ、本社工場の倉庫で作業者に操作してもらった。協力者には、ベテランと、別の職場から来て間もない作業者の両方を選んだ。応援者に近い特性を持つ人に操作してもらうためである。\n\n3.2 操作の様子を観察し、迷った場面を記録した\n\n私は、作業者に操作の感想を聞くだけでなく、作業者の後ろから操作の様子を観察した。どこで手が止まったか、どこで画面を見直したかを記録した。\n\n1回目の試作では、2つの問題が見つかった。一つは、暗い棚の前では、黄色と緑の画面の区別がつきにくいことである。そこで、色に加えて「古い在庫あり」の文字を大きく表示した。もう一つは、フォークリフトが近くを通ると警告音が聞こえないことである。そこで、端末の振動を加えた。\n\n2回目の試作では、理由の選択肢が多すぎて迷う作業者がいた。そこで、選択肢を3つに絞り、数字キーで選べるようにした。\n\n3.3 仮説と検証を繰り返した\n\n試作は3回繰り返した。毎回、「この変更で迷う場面が減るはずだ」という仮説を決めてから試し、観察の記録で確かめた。3回目には、応援者に近い作業者も、説明を受けずに最後まで操作できた。\n\n稼働後は、作業者が選んだ理由の記録を在庫管理担当者と確認している。理由の多くは古い在庫が奥にある場合で、操作の迷いによるものは少なかった。一方、第2・第3工場では試作の評価を行っていない。今後は、棚の形が違う工場でも同じ観察を行いたい。"}, {"id": "r3q1", "label": "令和3 問1", "theme": "アジャイル開発における要件定義の進め方", "a": "第1章 対象の業務と情報システム、アジャイル開発を選択した理由\n\n1.1 対象の業務と情報システムの概要\n\nB社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。対象の業務は、3工場の倉庫での保管と出庫、及び部品の作り方を変える4M変更の申請と切替の業務である。B社では4M変更で旧版の部品が棚に滞留し、廃棄の原因になっていた。そこで出庫を先入れ先出しに統一し、翌年度の期初から3工場一斉に適用することを決めた。\n\n対象の情報システムは、B社の生産・在庫管理システムである。PCのクライアントとデータベースサーバの2層構成で、倉庫ではハンディ端末で現品票のQRコードを読み取る。今回、版と生産ロットの古い順に出庫させる機能と、4M変更の申請を電子化する機能を追加した。\n\n1.2 アジャイル開発を選択した理由\n\n出庫の順序を守らせる画面や例外の扱いは、作業者が実際に使ってみないと、正しい形が決められなかった。また、4M変更の申請の運用は、B社の中でも開発と並行して決まっていく部分があった。最初に全ての要件を固めるより、短い期間で動くものを見せて確かめる方が、手戻りが少ないと考えた。一方、ロケーションを品目と版の単位で持つデータ構造は、最初に決めて変えないことにした。そこで、データ構造を先に設計し、画面と運用の部分をスクラムで開発した。\n\n私はシステム開発会社A社のシステムアーキテクトとして、スクラムマスタを担当した。プロダクトオーナはB社の在庫管理課長である。", "i": "第2章 USの分類と、規模や難易度の調整\n\n2.1 USの分類方法と、選択した理由\n\n私は、USを「誰が」と「業務のどの場面で」の2つの軸で分類した。誰がは、申請者、在庫管理担当者、倉庫作業者の3つである。場面は、申請と承認、マスタの管理、出庫の3つである。\n\nこの分類を選んだ理由は2つある。第一に、利用者ごとに、スプリントレビューで確かめてもらう相手が違う。利用者で分ければ、同じスプリントのUSを同じ人に見てもらえる。第二に、場面が違えば使う端末が違い、難易度も違う。申請と承認はPCの画面だが、出庫はハンディ端末で、倉庫での確認が必要になる。場面で分ければ、難易度の高いUSを見分けやすいと考えた。\n\n時間や操作頻度で分ける方法も検討した。しかし、出庫は毎日、申請は月に数回と、頻度の違いは利用者の違いとほぼ重なっていた。そこで、軸を増やさずに2つに絞った。\n\n2.2 規模が大き過ぎるUSの分割\n\n例えば「倉庫作業者が、古い版を先に使うために、出庫時に古い在庫から取り出す」というUSは、1回のスプリントには大き過ぎた。そこで、操作の切れ目で3つに分割した。「読み取った現品票より古い在庫があれば知る」「古い在庫の置き場所を知る」「取り出せないときに理由を選んで出庫する」である。分割した3つは、それぞれ1回のスプリントで完了できる規模になった。見積りは、開発メンバ3名で相対的な大きさを比べて行った。\n\n2.3 難易度が高過ぎるUSの調整\n\n「申請者が、切替を確実にするために、承認と同時に切替の日時が登録される」というUSは、既存の在庫管理の機能を呼び出すため、難易度が高かった。既存の出庫引当にどう影響するかが、見積りの時点では分からなかった。そこで、影響を調べる小さな検証のUSを先に置き、その結果を見てから本体のUSを見積もった。\n\n2.4 規模が小さ過ぎるUSの統合と、抜け漏れの追加\n\n「在庫管理担当者が、空いた置き場所を解除する」と「新しい版の置き場所を登録する」は、それぞれでは小さ過ぎた。どちらも同じマスタの画面なので、1つのUSに統合した。\n\nまた、スプリントレビューで倉庫の班長から「版が分からない古い在庫はどう出すのか」と質問があり、USの抜け漏れが分かった。そこで、「在庫管理担当者が、版の分からない在庫を先に使い切るために、版不明として登録する」というUSを追加した。", "u": "第3章 着目した価値と、USの優先順位\n\n3.1 着目した価値\n\n私は、業務改善指針の目的に立ち返って価値を考えた。目的は、旧版の滞留による廃棄を減らすことと、4M変更の切替方法を守って品質を確保することである。そのうえで、期初の適用開始日に間に合わせる必要がある。そこで、誤った版の出庫を防ぐ価値を最も高く置き、次に作業を止めない価値を置いた。\n\n3.2 USの優先順位の例\n\n最優先にしたのは、「倉庫作業者が、品質問題を起こさないために、即日停止された旧版を出庫できないようにする」というUSである。旧版を即日止める切替方法に違反すると、品質問題に直結するからである。\n\n次に、2.2で分割した「古い在庫があれば知る」と「取り出せないときに理由を選んで出庫する」を、同じスプリントに置いた。前者だけを先に使い始めると、取り出せない場面で作業が止まってしまう。現場で使える単位で価値を考え、2つをそろえて提供した。\n\n一方、「申請者が、切替方法を間違えないために、切替の流れを図で確かめる」というUSは、後のスプリントに回した。申請の数は月平均4〜5件と少なく、当面は在庫管理担当者が申請の内容を確かめれば補えるからである。\n\n3.3 プロダクトオーナとの合意\n\nプロダクトオーナの在庫管理課長は、アジャイル開発に慣れていなかった。そこで私は、USごとに、着目した価値と規模を並べた案を作って示した。ただし、最終的な順位は課長に決めてもらい、私は案を出すところまでにとどめた。順位を決めるのはプロダクトオーナの役割であり、私が決めると業務の判断が抜け落ちると考えたからである。\n\nその結果、期初の適用開始日までに、出庫に関わるUSを全て提供できた。後半のスプリントでは、課長が自ら倉庫の意見を集めて順位を決めるようになった。一方、申請画面の改善は稼働後に持ち越した。今後のスプリントで扱う予定である。"}, {"id": "r1q2", "label": "令和元 問2", "theme": "システム適格性確認テストの計画", "a": "第1章 対象業務と情報システムの概要\n\n1.1 対象業務の概要\n\nB社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。第2・第3工場で製造したユニットを本社工場で組み立てて出荷している。対象の業務は、3工場をまたがる生産計画、部品の所要量計算と発注、受入と検査、倉庫での保管と出庫、工場間の移動、組立、出荷までの生産管理業務と在庫管理業務である。\n\nB社では、部品の作り方を変える4M変更が月平均4〜5件あり、旧版の部品が棚に滞留して廃棄の原因になっていた。そこで出庫を先入れ先出しに統一し、翌年度の期初から3工場一斉に適用することを決めた。\n\n1.2 情報システムの概要\n\n対象の情報システムは、B社の生産・在庫管理システムである。PCのクライアントとデータベースサーバの2層構成で、サーバは本社工場に置き、第2・第3工場からは専用線で利用する。倉庫ではハンディ端末でロケーションと現品票のQRコードを読み取り、入出庫を記録する。\n\n今回、次の機能を追加した。ロケーションを品目コードと版の単位に分け、適用開始日時と出庫停止日時を持たせる。出庫引当は、その時点で有効なロケーションから、版と生産ロットの古い順に候補を出す。また、紙の4M変更申請を電子化し、承認と同時に切替の日時を登録する。\n\n私はシステム開発会社A社のシステムアーキテクトとして、本機能追加の要件定義から方式設計、システムテストの計画までを担当した。", "i": "第2章 テストの区分けと配慮\n\n2.1 業務の時点による区分け\n\n私は、システムテストを業務の時点で4つに区分けした。毎日の出庫、4M変更の申請から切替まで、期初の一斉切替、年末年始の棚卸である。\n\nこのように分けた理由は、今回の機能が日時によって動きを変えるからである。例えば、指定した時期に切り替える4M変更は、切替の日時を過ぎて初めて旧版の出庫が止まる。そこで、テスト環境のシステム日付を進めながら、申請、承認、切替前の出庫、切替後の出庫を1つの流れとして確かめるシナリオを作った。各シナリオには、在庫管理担当者の業務の手順の名前を付け、業務の流れと結び付けた。業務の時点ごとにまとめれば、日付を何度も行き来せずに済み、テストを効率的に進められると考えた。\n\n2.2 組合せの絞り込み\n\n出庫引当の結果は、切替方法の3通り、版不明の在庫の有無、ロットの数などの組合せで変わる。全ての組合せを試すと件数が膨らむ。そこで、過去の4M変更の申請書を見直し、実際に起きた組合せを優先した。例えば、即日切替と版不明の在庫が同じ品目で重なる組合せは、過去に実際に起きていたので必ず含めた。実際に起きていない組合せは、代表的なものだけを残した。\n\n2.3 工場では区分けしなかった\n\n一方、工場ごとにテストを分けることはしなかった。3工場は同じデータベースと同じ引当の処理を使い、工場ごとの違いは棚の配置だけで、棚の配置はデータとして持つだけなので処理には影響しない。工場ごとに同じテストを3回行っても、見つかる不具合は増えないと考えた。そこで機能の確認は本社工場のデータで行い、第2・第3工場では専用線を通した応答の確認だけを行った。\n\n2.4 非機能要件と、関連する作業への配慮\n\n非機能要件では、ハンディ端末の応答を重視した。引当の判定を毎回サーバで行うため、専用線を通る第3工場の応答が最も厳しい。もし応答が足りなければ、判定の方式を見直すことになり、手戻りが大きい。そこで応答の確認は最後に回さず、システムテストの最初の週に、第3工場の端末から行った。\n\nまた、システムテストの期間は、事前の循環棚卸による棚の再配置と重なっていた。再配置した結果をテスト環境に取り込めば、本番に近いロケーションでテストできる。そこで、再配置の予定に合わせてテストデータを更新する日を決めた。", "u": "第3章 テスト結果を効率的に確認する方法\n\n3.1 引当の順序を自動で照合するツール\n\n出庫引当の結果は、在庫の版、ロット、ロケーションの日時、処理した日時によって変わる。人が画面を見て正しい順序かを判断すると、組合せが多いので見落としが出る。そこで、テストデータと処理した日時から、正しい候補の順序を求めるツールを作り、実行結果と自動で照合した。照合の規則は、引当の処理とは別の担当者が要件定義書から作った。同じ人が作ると、同じ思い込みで誤るおそれがあるからである。照合の結果は不一致だけを一覧に出し、確認の手間を減らした。\n\n3.2 本番データを使った新旧の比較\n\n本番の在庫データを写したテスト環境で、従来の引当と新しい引当を同じ出庫指示で実行し、結果を並べた。違いが出た品目を一覧にし、在庫管理担当者に確認してもらった。違いの多くは、古い版が優先されたという想定どおりのものである。そこで、想定どおりの違いを規則で自動的に仕分け、残った違いだけを人が見るようにした。この方法を採用したのは、本番の在庫には、テストデータでは思い付かない偏りがあるからである。実際に、版不明の在庫が多い品目で、想定と違う順序になる不具合が見つかった。\n\n3.3 人が見るべき確認は、倉庫で行った\n\n警告の表示や、古い在庫の場所の分かりやすさは、ツールでは確かめられない。そこで、これらは本社工場の倉庫で、作業者に実際の端末で確かめてもらった。私は作業者の後ろから操作の様子を観察し、迷った場面を記録して画面の修正につなげた。\n\n人が見るべき所だけを人が見ることで、限られた期間でテストを終えられた。一方、照合ツールの規則は、要件が変わるたびに直す必要がある。今後の4M変更の運用の変更に合わせて、規則を保守する担当を決めておきたい。"}, {"id": "h27q2", "label": "平成27 問2", "theme": "業務の課題に対応するための業務機能の変更又は追加", "a": "第1章 業務の課題と、情報システム及び業務の概要\n\n1.1 業務の概要\n\nB社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。第2・第3工場で製造したユニットを本社工場で組み立てて出荷している。対象の業務は、3工場の倉庫での部品の保管と出庫、及び部品の作り方を変える4M変更の管理である。\n\n1.2 情報システムの概要\n\n対象の情報システムは、B社の生産・在庫管理システムである。PCのクライアントとデータベースサーバの2層構成で、サーバは本社工場に置き、第2・第3工場からは専用線で利用する。倉庫ではハンディ端末でロケーションと現品票のQRコードを読み取り、入出庫を記録する。\n\n1.3 業務の課題\n\nB社では4M変更が月平均4〜5件発生し、内製品の版が変わる。しかし倉庫では、作業者が品目コードだけを見て、取りやすい部品から出庫していた。そのため変更前の版の部品が棚の奥に残って長期滞留し、棚卸のたびに廃棄の対象になっていた。B社は廃棄物の削減を環境目標に掲げており、部品の廃棄はその主な要因であった。\n\nまた、4M変更ごとに決まる切替方法も守られていなかった。旧版を即日止めるべき変更でも、旧版が出庫されることがあった。\n\nそこでB社は、出庫を先入れ先出しに統一し、4M変更の切替方法を確実に守ることを業務の課題とした。私はシステム開発会社A社のシステムアーキテクトとして、この課題に対応する機能の変更と追加の要件定義から方式設計までを担当した。", "i": "第2章 必要となった業務機能の変更と追加\n\n2.1 課題の原因の分析\n\n私はまず、在庫管理担当者と倉庫作業者に聞き取り、課題の原因を整理した。原因は3つあった。第一に、ロケーションが品目コード単位で、同じ棚に新旧の版が混在していた。第二に、出庫の順序を判断する情報が、作業者の手元に無かった。現品票のQRコードには、版も生産ロットも含まれていなかった。第三に、4M変更は紙の申請書で管理され、在庫の側は切替方法や時期を知る手段が無かった。\n\n2.2 ロケーション管理機能の変更\n\n一つ目の原因に対して、ロケーションを品目コードと版の単位に分け、出庫を止める区分を持たせた。置き場所で版が分かれれば、作業者が取り違えることを物理的に防げる。また、旧版を即日止める場合も、棚単位で出庫を止められる。これで、切替方法を守れない状態を解消できると考えた。\n\n棚は品目コード単位のまま、出庫時にシステムが古いものを指示する案も検討した。棚の再配置が要らず移行は軽いが、同じ棚に新旧の版が混在する限り、取り違えは防げない。品質上は切替方法を確実に守ることが最も重要と考え、棚を分ける案を選んだ。\n\n2.3 出庫引当機能と現品票発行機能の変更\n\n二つ目の原因に対して、出庫引当機能を変更した。出庫を止めていないロケーションから、版、生産ロットの順に古いものを候補として示す。古いものから使い切れば、旧版が棚の奥に残らず、廃棄が減ると考えた。\n\nあわせて、現品票発行機能を変更し、QRコードに版と生産ロットの管理番号を加えた。出庫時に読み取った現品票から版とロットが分からなければ、順序を判定できないからである。読み取った現品票より古い在庫がある場合は、警告とともに古い在庫の場所をハンディ端末に表示する。\n\n2.4 変更申請機能の追加\n\n三つ目の原因に対して、紙の4M変更申請を電子化する変更申請機能を追加した。申請者は切替方法と時期を入力する。申請が承認されると、新版のロケーションを適用開始日時付きで登録し、旧版のロケーションに出庫停止日時を設定する。こうすれば、切替方法と時期が在庫の側に確実に伝わり、切替の当日に担当者がマスタを更新する必要も無くなる。\n\nこの3つの変更と追加により、課題の3つの原因をそれぞれ取り除ける。原因と機能を1対1で対応させたことで、課題に対応できると判断した。", "u": "第3章 既存機能の活用と、既存システムへの影響を最小化する工夫\n\n3.1 出庫引当の既存の処理をそのまま使った\n\n出庫引当には、在庫の数量を引き当てる既存の処理があり、出庫指示の画面とハンディ端末の両方から呼ばれていた。この処理を作り直すと、両方の呼出し元のテストが必要になる。そこで、数量を引き当てる部分はそのまま使い、その前に「有効なロケーションへの絞り込み」と「古い順への並べ替え」を加えるだけにした。呼出し元から見た使い方は変わらないので、呼出し元の画面は修正しなかった。\n\n3.2 新しい処理は独立した部品にした\n\nロケーションの登録や出庫停止の処理は、既存の在庫管理の画面に書き加えるのではなく、ロケーション管理の部品として新たに作った。変更申請機能は、承認時にこの部品を呼び出す。在庫管理の画面からも同じ部品を呼べるので、同じ処理を2か所に作らずに済む。既存の画面への変更は、部品を呼び出す1か所だけにとどめた。\n\n3.3 既存のデータと帳票への影響を抑えた\n\nロケーションマスタには項目を追加したが、既存の項目は残した。棚卸表などの既存の帳票は、品目コード単位で在庫を集計している。そこで、版を区別せずに品目コード単位で集計する見せ方を用意し、既存の帳票はそれを使うようにした。これで、帳票の作り直しが不要になった。\n\n3.4 既存のQRコードの読取りを壊さなかった\n\nQRコードに版とロットを加える際、既存の項目の並びは変えず、末尾に追加した。受入など、既存の読取りの処理は、先頭からの並びで品目コードを読んでいる。末尾に追加すれば、既存の処理は修正せずにそのまま使える。\n\nこれらの工夫で、既存の画面、帳票、読取りの処理の修正を最小限にとどめた。一方、品目コード単位の見せ方を使う帳票では、版の違いが見えない。今後は、品質保証の業務で版別の集計が必要になるため、帳票ごとに見直していきたい。"}, {"id": "h29q1", "label": "平成29 問1", "theme": "非機能要件を定義するプロセス", "a": "第1章 対象業務と情報システムの概要\n\n1.1 対象業務の概要\n\nB社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。第2・第3工場で製造したユニットを本社工場で組み立てて出荷している。対象の業務は、3工場の倉庫での部品の保管と出庫、及び部品の作り方を変える4M変更の管理である。\n\n倉庫からの出庫は、生産ラインへの部品の供給そのものである。出庫が止まれば、ラインの横に置いた部品を使い切った時点で生産が止まる。また、4M変更は月平均4〜5件あり、旧版の部品が棚に滞留して廃棄の原因になっていた。そこでB社は、出庫を先入れ先出しに統一することを決めた。\n\n1.2 情報システムの概要\n\n対象の情報システムは、B社の生産・在庫管理システムである。PCのクライアントとデータベースサーバの2層構成で、サーバは本社工場に置き、第2・第3工場からは専用線で利用する。倉庫ではハンディ端末で現品票のQRコードを読み取り、入出庫を記録する。\n\n今回、出庫の都度、サーバで版と生産ロットの順序を判定し、古い在庫があれば知らせる機能を追加した。あわせて、4M変更の申請を電子化し、承認時に切替の日時を登録する機能を追加した。\n\n私はシステム開発会社A社のシステムアーキテクトとして、本機能追加の要件定義を担当した。", "i": "第2章 非機能要件の検討の視点、プロセス、結果\n\n2.1 検討した非機能要件と視点\n\n私は、性能、信頼性、切替の時刻の正確さの3つの非機能要件を検討した。今回の機能は出庫のたびにサーバで判定するため、出庫という業務の流れに直接割り込む。利用者は機能の中身には関心が高いが、遅くなったり止まったりした場合のことは明確に意識していなかった。そのため、機能の議論の中では出てこず、私から問いかけて引き出す必要があった。\n\n検討には2つの視点を使った。業務の視点は、出庫が遅れたり止まったりしたとき、生産ラインと品質にどんな影響が出るかである。システムの視点は、2層構成で判定を毎回サーバで行い、第2・第3工場は専用線を通るという構成上の制約である。\n\n2.2 検討のプロセス\n\n第一に、倉庫作業者、在庫管理担当者、情報システム部の担当者に聞き取りを行った。作業者からは、ラインが部品を待っている場面が多いことを聞いた。情報システム部からは、専用線が過去に切れたことがあると聞いた。\n\n第二に、リスクを洗い出し、業務への影響を分析した。判定が遅ければ出庫が滞り、ラインを待たせる。サーバや専用線が止まれば出庫できず、ライン横の部品を使い切った時点で生産が止まる。切替の時刻がずれれば、止めるべき旧版が出庫され、品質問題につながる。\n\n第三に、業務の言葉で目標を決めた。性能は、作業者が現品票を読み取ってから次の部品に手を伸ばすまでに結果が出ることとした。信頼性は、ライン横の部品を使い切る前に出庫を再開できることとした。切替の時刻は、どの端末から出庫しても、同じ時刻で切り替わることとした。\n\n2.3 検討の結果\n\n性能については、判定に必要な候補を1回の問合せで返すよう索引を見直し、専用線を通る第3工場の端末で確かめることにした。\n\n信頼性については、判定ができないときに出庫を止めない方式とした。判定なしで従来どおり出庫を続け、出庫の実績を記録しておく。復旧後に、順序を外れた出庫をまとめて確認する。運用・操作の要件として、この確認は在庫管理担当者が翌朝までに行う、という手順も決めた。\n\n切替の時刻については、判定に端末の時刻を使わず、サーバの時刻だけを使うことにした。端末の時刻がずれていても、切替の時刻はそろう。", "u": "第3章 意思決定者に判断してもらうための工夫\n\n3.1 障害時の方式を3案で比べ、損失とコストを並べた\n\n信頼性の方式は、本社工場の工場長に判断してもらう必要があった。私は次の3案を示した。案Aは、判定ができない間は出庫を止める方式である。順序は必ず守れるが、ラインが止まる損失が出る。案Bは、判定なしで出庫を続け、復旧後に確認する方式である。ラインは止まらないが、一時的に順序を外れた出庫が起きうる。案Cは、サーバと回線を二重にする方式である。止まる時間は最も短いが、設備と運用の費用が大きく、今回の機能追加の範囲を超える。\n\n前提として、現行の2層構成とサーバ1台の構成は変えないという制約を最初に示した。そのうえで、案ごとに想定される損失と、必要な費用を1枚の表に並べた。損失は「ラインが止まる」「順序を外れた出庫が起きる」という業務の言葉で書いた。\n\n3.2 案Bの弱点と、その補い方を示した\n\n工場長は、案Bでは旧版を即日止めるべき部品まで出庫されることを心配した。そこで、障害の間だけ、即日停止の対象品目の一覧を倉庫に掲示する手順を加えることを示した。即日停止の対象は月に数件で、一覧は短い。判定ができない間も、品質に直結する部品だけは人の目で止められる。\n\n3.3 非機能要件どうしのトレードオフを示した\n\n在庫管理担当者からは、全ての出庫で確認画面を出してほしいという要望があった。私は、確認を増やすと順序は守りやすくなるが、出庫の速さが落ち、作業者が確認を読まずに進めるようになることを示した。そのうえで、古い在庫がある場合だけ警告を出す案を示した。\n\nその結果、工場長は案Bと掲示の手順を選び、警告の出し方も合意された。稼働後に専用線が短時間切れたことがあったが、出庫は止まらず、順序の確認も復旧後に終えられた。一方、掲示の一覧は人が作るため、更新が遅れるおそれがある。今後は、一覧を自動で印刷できるようにしたい。"}, {"id": "h28q1", "label": "平成28 問1", "theme": "業務要件の優先順位付け", "a": "第1章 情報システムの概要と開発の目的、対象の業務\n\n1.1 対象の業務の概要\n\nB社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。第2・第3工場で製造したユニットを本社工場で組み立てて出荷している。対象の業務は、3工場の倉庫での部品の保管と出庫、工場間の移動、及び部品の作り方を変える4M変更の管理である。\n\n1.2 情報システムの概要\n\n対象の情報システムは、B社の生産・在庫管理システムである。PCのクライアントとデータベースサーバの2層構成で、サーバは本社工場に置き、第2・第3工場からは専用線で利用する。倉庫ではハンディ端末でロケーションと現品票のQRコードを読み取り、入出庫を記録する。\n\n1.3 開発の目的\n\nB社では4M変更が月平均4〜5件発生し、変更前の版の部品が棚の奥に滞留して、棚卸のたびに廃棄されていた。また、4M変更ごとに決まる切替方法が守られず、旧版が出庫されることがあった。B社は業務改善指針で出庫を先入れ先出しに統一し、翌年度の期初から3工場一斉に適用することを決めた。開発の目的は、旧版の滞留による廃棄を減らすことと、切替方法を確実に守ることである。適用開始日は指針で決まっており、動かせない。\n\n私はシステム開発会社A社のシステムアーキテクトとして、この機能追加の要件定義を担当した。", "i": "第2章 業務要件の評価手順、評価項目と重み付け\n\n2.1 提示された業務要件と評価の手順\n\n要件定義では、関係部門から多くの業務要件が提示された。例えば、在庫管理課からは古い順の出庫、品質保証部からは旧版の即日停止、倉庫からは古い在庫の場所の案内、経理部からは滞留在庫の一覧、生産管理部からは工場間で輸送中の在庫の版管理である。全てを期初までに作ることはできなかった。\n\nそこで私は、次の手順で評価した。第一に、業務面とシステム面の評価項目を決める。第二に、開発の目的と業務の特性から、評価項目に重みを付ける。第三に、業務要件ごとに、各評価項目を3段階の点数で評価する。第四に、重みを掛けて合計し、順位を付ける。評価項目と重みは、要件を評価する前に関係部門と合意した。要件を見てから重みを決めると、声の大きい部門の要件に有利な重みになりやすいからである。\n\n2.2 評価項目\n\n業務面の評価項目は2つである。一つは、開発の目的への寄与である。廃棄の削減と切替方法の順守に、どれだけ直接効くかを見る。もう一つは、業務の準備の負荷である。棚の再配置や作業者の教育がどれだけ必要かを見る。この負荷は、倉庫の班長と一緒に、再配置する棚の範囲と教育の対象者から見積もった。\n\nシステム面の評価項目は3つである。期初までに開発できるかという開発期間、既存の機能や他のシステムへの影響、適用する技術の検証の必要性である。\n\n開発の目的への寄与は定性的な項目なので、点数にする基準を決めた。廃棄や切替違反の原因を直接取り除くものを3点、原因を見える化して間接的に効くものを2点、関係が薄いものを1点とした。\n\n2.3 重み付けの考え方\n\n開発の目的への寄与に、最も大きい重み3を付けた。今回の開発は廃棄の削減と切替の順守のためであり、これに効かない要件は後回しにしてよいと考えたからである。次に、開発期間に重み2を付けた。適用開始日は指針で決まっていて動かせず、間に合わない要件は期初の業務に使えないからである。業務の準備の負荷、他への影響、技術の検証には、重み1を付けた。特に技術の検証は、今回の要件の多くが既存の技術の範囲で作れるため、要件の間で差が付きにくいと考えた。", "u": "第3章 業務要件の評価と優先順位\n\n3.1 旧版の即日停止\n\n品質保証部の「旧版を即日止めたい」という要件は、切替違反の原因を直接取り除くので、目的への寄与は3点とした。ロケーションに出庫停止の区分を持たせれば実現でき、開発期間も短い。合計点は最も高く、第1位とした。\n\n3.2 版とロットの古い順の出庫と、古い在庫の場所の案内\n\n在庫管理課の「古い順の出庫」は、廃棄の原因である旧版の滞留を直接取り除くので、寄与は3点である。ただし出庫引当の変更は既存の機能への影響が大きく、影響の項目は1点とした。それでも重みの大きい寄与の点が効き、第2位となった。\n\n倉庫の「古い在庫の場所の案内」は、古い順の出庫を作業者が守るための手段であり、寄与は2点とした。準備の負荷は小さく、第3位とした。古い順の出庫と同じ時期に提供しないと、作業者が順序を守れないことも考えた。\n\n3.3 滞留在庫の一覧と、輸送中の在庫の版管理\n\n経理部の「滞留在庫の一覧」は、滞留を見える化するもので寄与は2点だが、廃棄を直接は減らさない。開発は小さいが、合計点は第4位以下だった。\n\n生産管理部の「輸送中の在庫の版管理」は、寄与は2点だが、工場間の移動の機能と出荷の機能の両方を直す必要があった。他への影響が大きく、期初には間に合わないと評価し、最下位とした。\n\n3.4 優先順位の決定と合意\n\n合計点の上位3つを期初の範囲とし、残りは見送った。見送った要件には、再検討の条件を添えた。滞留在庫の一覧は期初の切替後の滞留の状況を見て、輸送中の在庫の版管理は工場間の移動で版の取り違えが起きたら、再検討する。条件を添えたことで、見送りになった部門も納得した。その結果、期初の適用開始日に、上位3つの要件を3工場で使い始められた。一方、点数は3段階で差が付きにくく、同点の要件が出た。今後は、基準を細かくすることを検討したい。"}, {"id": "h30q1", "label": "平成30 問1", "theme": "データを活用した情報の提供", "a": "第1章 データを活用した情報の提供の概要\n\n1.1 ニーズのあった業務の概要\n\nB社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。ニーズのあった業務は、在庫管理課が行う在庫の管理と、部品の作り方を変える4M変更の切替の管理である。4M変更は月平均4〜5件あり、変更ごとに旧版から新版への切替方法と時期を決める。\n\n1.2 関連する情報システムの概要\n\n関連する情報システムは、B社の生産・在庫管理システムである。PCのクライアントとデータベースサーバの2層構成で、倉庫ではハンディ端末で現品票のQRコードを読み取り、入出庫を記録する。B社では旧版の部品の滞留と廃棄が問題になっており、このシステムに先入れ先出しの機能を追加し、版と生産ロットごとに在庫を持つようにした。\n\n1.3 ニーズの内容\n\n先入れ先出しの機能を使い始めた後、在庫管理課長から「廃棄をもっと減らしたい。そのための情報が欲しい」という要望が出た。先入れ先出しで古い在庫から使うようにはなったが、4M変更の時点で旧版が多く残っていると、使い切る前に切替時期が来て、結局廃棄になる場合があったからである。\n\n私はシステム開発会社A社のシステムアーキテクトとして、このニーズの分析と、提供する情報の検討を担当した。", "i": "第2章 ニーズの分析と、提供した情報\n\n2.1 ニーズの分析\n\n「廃棄を減らしたい」という要望は漠然としていた。そこで私は、誰が、どの場面で、何を判断するために情報を使うのかを、在庫管理課長と担当者に聞き取った。課長は当初、全品目の在庫の一覧を求めていた。しかし聞き取りを進めると、課長が本当に知りたいのは、どの品目の旧版が廃棄になりそうかであった。\n\nまず、過去1年の廃棄の記録を調べ、廃棄に至った経路を整理した。その結果、廃棄の多くは2つの経路から生まれていた。一つは、旧版を即日止める4M変更の時点で、旧版の在庫が多く残っていた場合である。もう一つは、出庫の少ない品目で、旧版を使い切る前に切替の時期が来た場合である。\n\nこの経路から、判断の場面は2つあると分かった。第一に、4M変更の申請を承認する場面である。在庫管理担当者が、切替方法と時期が妥当かを判断する。第二に、月に一度、滞留しそうな在庫を見直す場面である。在庫管理課長が、発注を減らす品目や、他の工場に回す品目を判断する。\n\n2.2 提供を検討した情報\n\n第一の場面に対しては、申請の承認画面に「旧版の使い切り見込み」を表示することにした。旧版の在庫数を、その品目の出庫の見込みで割り、使い切るまでの日数を求める。見込みは毎晩更新する。これを切替時期と並べて示せば、切替時期までに旧版を使い切れるかを、承認の前に判断できる。使い切れない場合は、申請者に切替時期の見直しを依頼できる。\n\n第二の場面に対しては、「版別の滞留の一覧」を月次で提供することにした。品目と版ごとに、棚に入れてからの日数と、使い切り見込みの日数を並べる。使い切り見込みが長い順に並べ、上位の品目から対策を考えられるようにした。\n\nさらに、対策の効果を確かめるため、廃棄の見込み金額の推移を工場別に示すことにした。課長が、先入れ先出しと切替時期の見直しの効果を、月ごとに確かめられる。\n\n一方、全品目の在庫の推移をグラフで見たいという要望もあった。しかし、判断の場面に結び付かない情報は、見るだけで使われないと考えた。そこで、判断に直接使う3つの情報に絞った。", "u": "第3章 情報の提供における課題と工夫\n\n3.1 版の分からない在庫がある\n\n版の運用を始める前の在庫には、版の情報が無いものがあった。これらを除いて集計すると、滞留の実態を小さく見せてしまう。そこで、版の分からない在庫は「版不明」という区分で集計し、一覧の中で別に表示した。版不明の在庫は先に使い切る方針なので、その減り方も月ごとに確かめられるようにした。\n\n3.2 棚に入れた日が分からない在庫がある\n\n古い在庫の中には、棚に入れた日の記録が無いものがあった。そこで、現品票の発行日を棚に入れた日とみなして計算した。発行日は入庫の数日前になることが多いが、滞留の長さを比べる目的には十分な精度だと判断した。みなした値で計算した行には印を付け、課長が区別できるようにした。\n\n3.3 出庫の見込みが無い品目がある\n\n使い切り見込みの計算には、出庫の見込みが必要である。しかし、補修用の部品などは生産計画に載らず、見込みの数が無かった。そこで、過去3か月の出庫の実績の平均を、見込みとみなして使うことにした。実績も無い品目は、使い切り見込みを「算出不可」と表示し、担当者が個別に判断するようにした。誤った見込みを出すより、出せないことを示す方が判断を誤らせないと考えた。\n\n3.4 金額のデータが別のシステムにある\n\n廃棄の見込み金額に必要な部品の単価は、会計システムにある。生産・在庫管理システムからは直接参照できない。そこで、月次の締めの後に会計システムから単価を受け取り、集計に使うことにした。月の途中の単価の変更は反映されないが、月次で推移を見る目的には足りる。\n\nその結果、承認の前に切替時期を見直す申請が出るようになり、廃棄の見込み金額は減っていった。一方、みなした値の多い品目では、見込みと実績の差が大きかった。今後は、棚に入れた日を確実に記録し、みなしを減らしていきたい。"}, {"id": "r7q1", "label": "令和7 問1", "theme": "複数の情報システムのデータを収集する指標の提供", "a": "第1章 業務目標と提供した指標、収集したデータ\n\n1.1 業務目標\n\nB社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。B社は環境方針として廃棄物の削減を環境目標に掲げており、部品の廃棄はその主な要因であった。部品の作り方を変える4M変更が月平均4〜5件あり、旧版の部品が棚に滞留して廃棄されていたからである。そこでB社は出庫を先入れ先出しに統一し、業務目標を「4M変更に伴う旧版部品の廃棄を、前年度より減らすこと」とした。\n\n1.2 提供した指標\n\n私は、2つの指標を工場長と環境推進委員会に提供した。一つは、工場別の部品の廃棄量と廃棄金額である。もう一つは、4M変更ごとの旧版の廃棄率である。切替の時点で残っていた旧版の在庫のうち、使われずに廃棄された割合を示す。\n\n1.3 収集したデータ\n\n指標の算出には、3つの情報システムのデータを収集した。生産・在庫管理システムからは、版ごとの在庫、出庫と廃棄の実績、4M変更の申請と切替の日時を収集した。会計システムからは、部品の単価と部門のコードを収集した。総務部の廃棄物管理システムからは、工場ごとに処分した廃棄物の重量を収集した。\n\n私はシステム開発会社A社のシステムアーキテクトとして、この指標を提供する機能の要件定義から設計までを担当した。", "i": "第2章 指標を提供する機能の設計で検討した事項\n\n2.1 業務目標と指標の関係\n\n最初に、業務目標と指標の関係を検討した。工場長からは当初、廃棄金額だけを見たいという要望があった。環境目標は廃棄物の量で管理されるので、工場別の廃棄量は欠かせない。しかし、廃棄量だけでは、減った理由も増えた理由も分からない。そこで、結果を示す指標として廃棄量と廃棄金額を、原因を示す指標として4M変更ごとの旧版の廃棄率を、組にして提供することにした。廃棄率が高い変更を見れば、どの切替の決め方が廃棄を生んでいるかが分かり、次の申請の判断に生かせる。\n\n2.2 指標を算出する手順\n\n旧版の廃棄率は、切替の時点で残っていた旧版の在庫数を分母、その後に廃棄された旧版の数を分子として求める。問題は、いつまでの廃棄を数えるかである。旧版の廃棄は、多くが期末の棚卸のときにまとめて判断される。そのため、切替から棚卸までの期間は変更ごとに異なり、そのまま比べると、棚卸の直前に切り替えた変更ほど廃棄率が低く見えてしまう。そこで、廃棄率は切替の後の最初の期末棚卸を終えた時点で確定させ、確定前の変更は「集計中」と表示することにした。確定までの間も、切替の時点の旧版在庫の残りは毎月表示し、廃棄が見込まれる変更を早めに把握できるようにした。\n\n2.3 コード体系と単位の差の吸収\n\n3つのシステムは、コード体系と単位が異なっていた。工場は、生産・在庫管理システムでは工場コード、会計システムでは部門コードで表されていた。そこで工場コードと部門コードの対応表を作り、集計の前に変換することにした。\n\n単位の差はより大きかった。在庫は個数、会計は金額、廃棄物管理システムは重量で持っている。金額は、個数に会計システムの単価を掛けて求める。重量は、品目ごとの単位重量を新たに持たせ、個数に掛けて求めることにした。こうして、部品の側から求めた重量と、廃棄物管理システムの実際の重量を、同じ単位で並べられるようにした。\n\n2.4 収集の方式\n\n会計システムと廃棄物管理システムは、他のシステムからデータベースを直接参照させない方針であった。そこで、それぞれが月次の締めの後に出力するファイルを受け取り、集計用のテーブルに取り込む方式にした。指標は環境推進委員会の月次の会議で使うので、月次の鮮度で足りると判断した。", "u": "第3章 データの内容の問題と対応\n\n3.1 廃棄の理由が記録されていない\n\n最も大きな問題は、廃棄の実績に理由が無いことであった。旧版になったための廃棄か、破損や劣化による廃棄かを区別できず、旧版の廃棄率を正しく求められない。\n\nそこで、新たなデータ取得の仕組みを作った。ハンディ端末で廃棄の出庫を記録するときに、理由を選択させることにした。選択肢は「版の切替」「破損」「劣化」「その他」の4つに絞り、作業者の負担を抑えた。一方、仕組みを作る前の過去の実績には理由が無い。そこで、切替の日時より後に廃棄された旧版は、版の切替による廃棄とみなすことにした。みなした実績には印を付け、指標の画面で区別できるようにした。\n\n3.2 単位重量が登録されていない品目が多い\n\n重量を求めるための単位重量は、多くの品目で登録されていなかった。全品目を量り直すと時間が掛かる。そこで、廃棄金額の大きい主要な品目は、設計部の図面の情報から単位重量を登録した。残りの品目は、同じ品目区分の平均の単位重量を使うことにした。部品の側から求めた重量は推計値と明記し、廃棄物管理システムの実際の重量と月次で照合した。両者の差が大きい月は、推計の方法を見直す材料にした。\n\n3.3 版の分からない在庫がある\n\n版の運用を始める前の在庫には、版の情報が無いものがあった。これらの廃棄は、どの4M変更によるものかを特定できない。そこで、「版不明」として別に集計し、廃棄率の計算からは除いて件数だけを示した。版不明の在庫は先に使い切る方針なので、その件数が減ることも確かめられる。\n\nこれらの対応により、環境推進委員会は、廃棄量の推移と、その原因になった4M変更を同じ画面で確かめられるようになった。一方、理由を選ぶ操作が定着するまでは「その他」が多かった。今後は、選ばれた理由を定期的に確かめ、選択肢を見直していきたい。"}, {"id": "r3q2", "label": "令和3 問2", "theme": "機能追加における業務要件の分析と設計(添付論文)", "a": "1.1 対象の業務と情報システムの概要\n\nB社は社員約1,000名の産業用ロボットメーカーであり、国内に3工場を持つ。第2・第3工場で製造したユニットを本社工場で組み立てて出荷している。対象の業務は、3工場をまたがる生産計画、部品の所要量計算と発注、受入と検査、倉庫での保管と出庫、工場間の移動、組立、出荷までの生産管理業務と在庫管理業務である。\n\n対象の情報システムは、B社の生産・在庫管理システムである。生産計画、所要量計算、発注を行う計画系と、受入、検査記録、入出庫、組立実績を記録する現場系から成る。PCのクライアントとデータベースサーバの2層構成で、サーバは本社工場に置き、第2・第3工場からは専用線で利用する。倉庫ではハンディ端末でロケーションと現品票のQRコードを読み取り、入出庫を記録する。\n\n私はシステム開発会社A社のシステムアーキテクトとして、本機能追加の要件定義から方式設計、移行設計までを担当した。\n\n1.2 機能追加が必要になった背景\n\nB社では製品改良に伴う4M変更が月平均4〜5件発生しており、変更前の版の部品が棚の奥に残って長期滞留し、棚卸のたびに廃棄の対象になっていた。一方でB社は、自社の環境方針としてエコアクション21の認証を取得し、廃棄物の削減を環境目標に掲げていた。部品の廃棄はその主な要因であったため、B社は業務改善指針で出庫を先入れ先出しに統一することを決め、翌年度の期初から3工場一斉に適用することとした。\n\n1.3 対応が求められた業務要件\n\n求められた業務要件は次の3点である。第一に、同じ品目は版と生産ロットが古い順に出庫すること。第二に、4M変更時に指定された切替方法を守って新しい版に切り替えること。第三に、適用開始日に生産を止めずに3工場で一斉に切り替えること。", "i": "2.1 分析の視点と方法\n\n私は業務要件を、業務プロセス、データ、関連する機能の三つの視点で分析した。\n\n(1)業務プロセスの視点\n\n在庫管理担当者と倉庫作業者へのヒアリングで、出庫と切替の流れを整理した。設計図面の変更では品目コードが変わり、4M変更では品目コードはそのままで版が更新される。切替方法は、①古いものを使い切ってから切り替える、②古いものを処分して即日切り替える、③指定した時期に切り替える、の3通りで、変更ごとに決まる。現状は品目コードだけを見て取りやすいものから出庫しており、版やロットの順序は守られていなかった。\n\n(2)データの視点\n\n品目は品目コードと版で、在庫は生産ロットの管理番号で一意に識別できる。しかしロケーションマスタと出庫実績は品目コードしか持たず、同じロケーションに異なる版が混在していた。また版の運用開始前の、版の情報を持たない在庫が多数残っていた。\n\n(3)関連する機能の視点\n\n4M変更は紙の申請書で管理され、在庫側は切替方法や時期を知る手段がなかった。また現品票のQRコードには版とロットが含まれていなかった。\n\n以上から、版とロットの順序のシステム判定と、切替方法と時期の在庫側への連携が必要だと判断した。変更対象は、ロケーション管理、出庫引当、現品票発行の各機能と、新たに追加する4M変更申請機能である。\n\n2.2 方式の比較\n\n出庫順序を守らせる方式として、2案を取り違えの防止、移行の負荷、日々の作業負荷の三つの軸で比較した。\n \n案Aは、ロケーションは品目コード単位のまま、出庫時に版とロットから古いものをシステムが指示する案である。再配置が不要で移行の負荷は小さいが、同じ棚に新旧の版が混在するため取り違えを物理的に防げず、切替方法②で旧版を即日止めることもできない。\n \n案Bは、ロケーションを品目コードと版の単位に分ける案である。棚の再配置が必要で移行の負荷は大きいが、置き場所で版が分かれるため取り違えを防げ、旧版を棚単位で出庫停止できる。\n \n私は、品質上は切替方法を確実に守ることが最も重要だと考えた。案Bの懸念は移行の負荷だが、再配置が必要なのは版の運用開始後に4M変更の対象となった品目のロケーションに限られる。4M変更は月平均4〜5件であり対象は一部にとどまるため、2.4の棚卸に合わせた再配置で期初までに終えられると見積もった。また、版ごとに区画を分けると棚が不足するおそれがあるため、旧版の在庫がなくなったロケーションは解除して新版に再利用できるようにしたうえで、案Bを採用した。同じ版の中のロット順は案Aの出庫時判定で補う。\n\n2.3 設計の内容\n\nロケーションマスタに版と出庫停止区分を追加し、品目コードと版でロケーションを一意に管理する。出庫停止のロケーションは引当の対象外とする。\n\n紙の4M変更申請を電子化する変更申請機能を追加し、切替方法と時期を入力させる。在庫管理機能にロケーション管理コンポーネントを追加し、承認時に変更申請機能から呼び出して、新版のロケーション登録と、切替方法②の場合の旧版の出庫停止を行う。\n\n現品票のQRコードに版と生産ロットの管理番号を追加し、出庫時に記録する。出庫引当は、出庫停止でないロケーションから、版、生産ロットの順に古いものを候補とする。\n\n2.4 移行の設計\n\n適用開始日に生産を止めずに3工場で切り替えるため、移行を2段階に分けて設計した。\n \n第1段階は棚の再配置と現品票の貼り替えである。入出庫実績から選んだ主要品目は生産ラインが止まる年末年始の棚卸で、それ以外は事前の循環棚卸に合わせて再配置する。棚卸の際は、既存在庫の現品票も版と生産ロットを含むものに貼り替える。この間も出庫引当は従来の順序で動かす。\n \n第2段階では、3工場の在庫数とロケーションの登録内容に差異がないことを判定条件とし、適用開始日時に3工場一斉に新しい出庫引当へ切り替える。", "u": "3.1 切替時期を確実に守るための工夫\n\n4M変更は月平均4〜5件発生し、その都度、切替当日に担当者がマスタを手作業で更新すると、更新漏れや時刻のずれで旧版が出庫されるおそれがある。特に切替方法③では、申請から切替までに期間が空くため、担当者が切替日を管理し続けるのは負担が大きい。2.3の出庫停止区分は即日停止する切替方法②には使えるが、時期を指定する③には使えない。そこで、ロケーションマスタに適用開始日時と出庫停止日時を追加した。変更申請の承認時点で、新版のロケーションを適用開始日時付きで事前登録し、旧版のロケーションには出庫停止日時を設定する。出庫引当は処理日時に有効なロケーションだけを対象とするため、切替時期になると人手を介さずに旧版の出庫が止まり、新版の出庫が始まる。同じ仕組みで、指針の適用開始日に向けた3工場分のマスタも事前に登録しておけるため、適用開始日の作業は登録内容の確認だけで済むようにした。\n\n3.2 版の情報がない過去の在庫を適用開始日に間に合わせるための工夫\n\n版の情報がない過去の在庫をすべて調査してから適用すると、適用開始日に間に合わない。そこで、版の項目に「版不明」のコード値を追加し、版不明の在庫は出庫引当で最優先にする設計とした。版不明の在庫を先に使い切ることで、版が分かる在庫だけが残る状態に自然に移行できる。2.4の棚卸で現品票を貼り替える際も、版が分からない在庫は「版不明」として発行する。作業者の負担を抑えるため、現品票発行機能にロケーション単位で一括発行する機能を加え、棚卸のときに貼り替えるだけで済むようにした。ただし切替方法②③の対象になる品目を版不明のまま出庫すると、切替方法に違反するおそれがある。このため、生産に影響する品目に限って、申請書に記載の変更時期と棚入れの時期から版を推定し、在庫管理担当者と協議して版を確定させた。\n\n3.3 作業者が迷わず先入れ先出しを守るための工夫\n\n作業者が古い在庫の場所を知らないと、指示されても守られない。そこで、出庫時に読み取った現品票の版と生産ロットより古い在庫が存在する場合は、警告メッセージとともに、古い在庫のロケーションをハンディ端末に表示する設計とした。一方、古い在庫が奥にあり取り出せない場合など、現場ではやむを得ない例外もある。そこで警告を無視して出庫する場合は理由を選択させ、出庫実績に記録するようにした。これにより、作業を止めずに順序違反を後から確認でき、在庫管理担当者が理由を分析して棚の配置を見直せるようにした。"}];

// ---- selectors
const sel=$("pid");
DATA.forEach(d=>{const o=document.createElement("option");o.value=d.id;o.textContent=d.label+" "+d.theme;sel.appendChild(o)});
sel.addEventListener("change",()=>{switchTo({pid:sel.value})});
document.querySelectorAll("#secSeg button").forEach(b=>b.addEventListener("click",()=>switchTo({sec:b.dataset.v})));
document.querySelectorAll("#modeSeg button").forEach(b=>b.addEventListener("click",()=>{st.mode=b.dataset.v;saveUi();renderModel();syncSeg()}));
function syncSeg(){
  sel.value=st.pid;
  document.querySelectorAll("#secSeg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===st.sec)));
  document.querySelectorAll("#modeSeg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===st.mode)));
}
function saveUi(){lsSet("mosha:ui",{pid:st.pid,sec:st.sec,mode:st.mode})}
function switchTo(ch){
  if(timer.run||timer.acc>0){ if(!confirmSwitch()) {syncSeg();return} }
  Object.assign(st,ch);saveUi();resetTimer();peeks=0;lastMatch=null;missSet=null;
  $("typed").value=lsGet(draftKey(),"");
  syncSeg();renderModel();updateStats();renderHistory();
}
let switchArmed=0;
function confirmSwitch(){ // no window.confirm in the frame: second click within 4s confirms
  const now=Date.now(); if(now-switchArmed<4000){switchArmed=0;return true}
  switchArmed=now; toast("計測中です。もう一度選ぶと切り替えます(タイマーはリセット)"); return false;
}

// ---- model pane
function isHead(line){return /^(第\d+章|\d+\.\d+|（\d+）|\(\d+\))/.test(line.trim())||/^\d+\.\d+\s/.test(line)}
function renderModel(){
  const box=$("model"); box.textContent="";
  const p=prob();
  $("modelTitle").textContent=p.label+" "+SEC_LABEL[st.sec]+" 見本";
  const text=modelText();
  const paras=text.split(/\n\s*\n/);
  let offset=0; // offset in stripped text for miss marks
  paras.forEach(par=>{
    const el=document.createElement("p");
    const line=par.replace(/\n/g,"");
    const head=isHead(line)&&line.length<60;
    if(head) el.className="h";
    if(st.mode==="cue"&&!head&&!peeking){
      const s=strip(line); el.className="cue";
      const em=document.createElement("em"); em.textContent=s.slice(0,10);
      el.appendChild(em); el.appendChild(document.createTextNode("……("+s.length+"字)"));
      offset+=s.length;
    } else if(missSet){
      // render char by char with misses
      let buf="",inMiss=false;
      const flush=()=>{ if(!buf) return; if(inMiss){const m=document.createElement("mark");m.className="miss";m.textContent=buf;el.appendChild(m)} else el.appendChild(document.createTextNode(buf)); buf="" };
      for(const ch of line){
        if(/\s/.test(ch)){buf+=ch;continue}
        const miss=missSet.has(offset); offset++;
        if(miss!==inMiss){flush();inMiss=miss}
        buf+=ch;
      }
      flush();
    } else { el.textContent=line; offset+=strip(line).length }
    box.appendChild(el);
  });
  if(st.mode==="blind"&&!peeking){
    const c=document.createElement("div");c.className="blindcover";
    const s=document.createElement("div");
    const t=document.createElement("strong");t.textContent="見本は隠れています";
    s.appendChild(t);s.appendChild(document.createTextNode("思い出せないときは「チラ見」で3秒だけ表示できます(回数を記録)。"));
    c.appendChild(s);box.appendChild(c);
  }
  $("peekBtn").hidden=st.mode==="show";
  $("sModel").textContent=strip(modelText()).length;
  const tm=TARGET_MIN[st.sec]; $("targetTxt").textContent="目安 "+tm+"分"+(st.sec==="all"?"(本番の本文に使える時間)":"");
  const lim=LIMIT[st.sec];
  $("limitTxt").textContent=lim?("本番の字数指定 "+lim[0]+"〜"+lim[1]+"字"):"本番の字数指定 ア400〜800 / イ800〜1,600 / ウ600〜1,200字";
  if(lastMatch!=null){$("matchChip").hidden=false;setMatchChip(lastMatch)} else $("matchChip").hidden=true;
}
$("peekBtn").addEventListener("click",()=>{
  if(peeking) return; peeks++; peeking=true; renderModel(); updateStats();
  clearTimeout(peekTimer); peekTimer=setTimeout(()=>{peeking=false;renderModel()},3000);
});

// ---- timer
function elapsed(){return timer.acc+(timer.run?Date.now()-timer.t0:0)}
function fmt(ms){const s=Math.floor(ms/1000);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):String(m).padStart(2,"0"))+":"+String(x).padStart(2,"0")}
function tick(){
  const ms=elapsed(); $("clock").textContent=fmt(ms);
  $("clock").classList.toggle("over",ms>TARGET_MIN[st.sec]*60000);
  updateCpm();
}
setInterval(()=>{if(timer.run) tick()},500);
function startTimer(){if(timer.run) return;timer.run=true;timer.t0=Date.now();$("startBtn").textContent="一時停止";tick()}
function pauseTimer(){if(!timer.run) return;timer.acc+=Date.now()-timer.t0;timer.run=false;$("startBtn").textContent="再開";tick()}
function resetTimer(){timer={run:false,acc:0,t0:0};$("startBtn").textContent="開始";tick()}
$("startBtn").addEventListener("click",()=>timer.run?pauseTimer():startTimer());
$("resetBtn").addEventListener("click",()=>{resetTimer();peeks=0;updateStats()});

// ---- typing
let saveT=null;
$("typed").addEventListener("input",()=>{
  if(!timer.run) startTimer();
  if(missSet){missSet=null;lastMatch=null;renderModel()}
  updateStats();
  clearTimeout(saveT); saveT=setTimeout(()=>lsSet(draftKey(),$("typed").value),400);
});
let clearArmed=0;
$("clearBtn").addEventListener("click",()=>{
  const now=Date.now(); if(now-clearArmed>4000){clearArmed=now;toast("もう一度押すと入力を消します");return}
  clearArmed=0; $("typed").value=""; lsSet(draftKey(),""); missSet=null; lastMatch=null; renderModel(); updateStats();
});
function updateCpm(){
  const n=strip($("typed").value).length, min=elapsed()/60000;
  $("sCpm").textContent=min>0.1&&n>0?Math.round(n/min):"–";
}
function updateStats(){
  const n=strip($("typed").value).length, m=strip(modelText()).length;
  $("sChars").textContent=n; $("sPeek").textContent=peeks;
  const lim=LIMIT[st.sec]||[1800,3600];
  const max=Math.max(lim[1],m);
  $("mFill").style.width=Math.min(100,n/max*100)+"%";
  $("mMin").style.left=(lim[0]/max*100)+"%";
  $("mFill").style.background=n>=lim[0]?"var(--good)":"var(--accent)";
  updateCpm();
}

// ---- matching (LCS)
function lcs(a,b){
  const n=a.length,m=b.length; if(!n||!m) return {len:0,miss:new Set([...Array(n).keys()])};
  if(n*m>16e6){ // length only
    let prev=new Uint16Array(m+1),cur=new Uint16Array(m+1);
    for(let i=1;i<=n;i++){for(let j=1;j<=m;j++){cur[j]=a[i-1]===b[j-1]?prev[j-1]+1:Math.max(prev[j],cur[j-1])}[prev,cur]=[cur,prev];cur.fill(0)}
    return {len:prev[m],miss:null};
  }
  const W=m+1,T=new Uint16Array((n+1)*W);
  for(let i=1;i<=n;i++){const ai=a[i-1],r=i*W,pr=(i-1)*W;for(let j=1;j<=m;j++){T[r+j]=ai===b[j-1]?T[pr+j-1]+1:(T[pr+j]>T[r+j-1]?T[pr+j]:T[r+j-1])}}
  const hit=new Uint8Array(n);let i=n,j=m;
  while(i>0&&j>0){if(a[i-1]===b[j-1]){hit[i-1]=1;i--;j--}else if(T[(i-1)*W+j]>=T[i*W+j-1])i--;else j--}
  const miss=new Set();for(let k=0;k<n;k++) if(!hit[k]) miss.add(k);
  return {len:T[n*W+m],miss};
}
function setMatchChip(v){const c=$("matchChip");c.textContent="一致率 "+v+"%";c.className="chip "+(v>=90?"good":v>=70?"warn":"bad")}
function doMatch(){
  const a=strip(modelText()),b=strip($("typed").value);
  const r=lcs(a,b); lastMatch=a.length?Math.round(r.len/a.length*100):0; missSet=r.miss; return lastMatch;
}
$("checkBtn").addEventListener("click",()=>{
  if(!strip($("typed").value)){toast("まだ入力がありません");return}
  const v=doMatch(); renderModel(); toast("一致率 "+v+"%。見本の赤い部分が抜けた・違った箇所です");
});

// ---- records storage
let records=[], store={kind:"local",db:null,uid:null};
function recCol(){return store.db.collection("data/users/"+store.uid)}
async function initStore(){
  records=lsGet("mosha:records",[]); renderHistory(); setStoreChip();
  try{
    const db=await window.claude?.use?.("db"); const user=await window.claude?.use?.("user");
    const uid=user?await user.id():null;
    if(db&&uid){
      store={kind:"db",db,uid}; setStoreChip("loading");
      const to=setTimeout(()=>setStoreChip("slow"),10000);
      const snap=await recCol().orderBy("at","desc").limit(1000).get();
      clearTimeout(to);
      const remote=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      // carry over records saved only in this browser
      const ids=new Set(remote.map(r=>r.id));
      for(const r of records){ if(!ids.has(r.id)){ try{await recCol().doc(r.id).set(r);remote.push(r)}catch(e){} } }
      records=remote.sort((x,y)=>x.at<y.at?1:-1); lsSet("mosha:records",records);
      setStoreChip(); renderHistory();
    }
  }catch(e){store={kind:"local",db:null,uid:null};setStoreChip()}
}
function setStoreChip(s){
  const c=$("storeChip");
  if(s==="loading"){c.textContent="アカウントの記録を読み込み中";c.className="chip";return}
  if(s==="slow"){c.textContent="記録の読み込みに時間がかかっています";c.className="chip warn";return}
  if(store.kind==="db"){c.textContent="記録はアカウントに保存(どの端末でも見られます)";c.className="chip good"}
  else {c.textContent="記録はこのブラウザにだけ保存";c.className="chip warn"}
}
async function addRecord(r){
  records.unshift(r); lsSet("mosha:records",records); renderHistory();
  if(store.kind==="db"){ try{await recCol().doc(r.id).set(r)}catch(e){toast("アカウントへの保存に失敗しました。このブラウザには残っています")} }
}
async function delRecord(id){
  records=records.filter(r=>r.id!==id); lsSet("mosha:records",records); renderHistory();
  if(store.kind==="db"){ try{await recCol().doc(id).delete()}catch(e){} }
}
$("saveBtn").addEventListener("click",async()=>{
  const n=strip($("typed").value).length;
  if(!n){toast("入力がないので記録できません");return}
  pauseTimer();
  const match=doMatch(); renderModel();
  const ms=elapsed(), min=ms/60000;
  const p=prob();
  const r={id:"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),at:new Date().toISOString(),
    pid:p.id,label:p.label,sec:st.sec,mode:st.mode,ms:Math.round(ms),chars:n,model:strip(modelText()).length,
    cpm:min>0?Math.round(n/min):0,match,peeks};
  await addRecord(r);
  resetTimer(); peeks=0; updateStats();
  toast("記録しました:"+fmt(ms)+" / "+n+"字 / 一致率 "+match+"%");
});

// ---- history view
function renderHistory(){
  const tb=$("hist"); tb.textContent="";
  const only=$("onlyCur").checked;
  const list=records.filter(r=>!only||r.pid===st.pid);
  $("emptyHist").hidden=list.length>0;
  list.slice(0,300).forEach(r=>{
    const tr=document.createElement("tr");
    const d=new Date(r.at);
    const cells=[(d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"),r.label,SEC_LABEL[r.sec]||r.sec,MODE_LABEL[r.mode]||r.mode,fmt(r.ms),r.chars,r.cpm,r.match+"%",r.peeks];
    cells.forEach((v,k)=>{const td=document.createElement("td");td.textContent=v;if(k>=4)td.className="n";tr.appendChild(td)});
    const td=document.createElement("td");const b=document.createElement("button");b.className="del";b.type="button";b.textContent="削除";b.setAttribute("aria-label","この記録を削除");
    let armed=0;b.addEventListener("click",()=>{const now=Date.now();if(now-armed>4000){armed=now;b.textContent="本当に?";return}delRecord(r.id)});
    td.appendChild(b);tr.appendChild(td);tb.appendChild(tr);
  });
  // tiles
  const today=new Date().toDateString();
  const todayMs=records.filter(r=>new Date(r.at).toDateString()===today).reduce((s,r)=>s+r.ms,0);
  $("tToday").textContent=Math.round(todayMs/60000)+"分";
  $("tCount").textContent=records.length+"回";
  const last=records.slice(0,5);$("tCpm").textContent=last.length?Math.round(last.reduce((s,r)=>s+r.cpm,0)/last.length):"–";
  const bl=records.filter(r=>r.mode==="blind");$("tBlind").textContent=bl.length?Math.round(bl.reduce((s,r)=>s+r.match,0)/bl.length)+"%":"–";
  // coverage
  const cv=$("cover");cv.textContent="";
  DATA.forEach(p=>{
    const row=document.createElement("div");row.className="cv";
    const name=document.createElement("span");name.textContent=p.label;row.appendChild(name);
    const dots=document.createElement("span");dots.className="dots";
    ["a","i","u"].forEach(s=>{
      const rs=records.filter(r=>r.pid===p.id&&(r.sec===s||r.sec==="all"));
      let lv=0;rs.forEach(r=>{const l=r.mode==="blind"?(r.match>=70?3:2):r.mode==="cue"?2:1;if(l>lv)lv=l});
      const d=document.createElement("span");d.className="dot"+(lv?" l"+lv:"");d.textContent={a:"ア",i:"イ",u:"ウ"}[s];
      d.title=SEC_LABEL[s]+":"+(["未着手","見て写した","頭出しで写した","目隠しで再現できた"][lv]);
      dots.appendChild(d);
    });
    row.appendChild(dots);row.style.cursor="pointer";row.tabIndex=0;row.setAttribute("role","button");row.setAttribute("aria-label",p.label+"を開く");
    const go=()=>switchTo({pid:p.id});row.addEventListener("click",go);row.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
    cv.appendChild(row);
  });
}
$("onlyCur").addEventListener("change",renderHistory);
$("csvBtn").addEventListener("click",async()=>{
  const head="日時,問題,設問,見せ方,時間(秒),字数,見本字数,字/分,一致率,チラ見";
  const lines=records.map(r=>[r.at,r.label,SEC_LABEL[r.sec],MODE_LABEL[r.mode],Math.round(r.ms/1000),r.chars,r.model,r.cpm,r.match,r.peeks].join(","));
  try{await navigator.clipboard.writeText([head,...lines].join("\n"));toast("CSVをコピーしました")}catch(e){toast("コピーできませんでした")}
});

// ---- boot
syncSeg(); $("typed").value=lsGet(draftKey(),""); renderModel(); updateStats(); tick(); renderHistory(); initStore();
</script>
</body>
</html>
